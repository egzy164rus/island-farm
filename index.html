  if (m<6)  return {name:'Лето',  icon:'sun', id:'summer'};
  if (m<9)  return {name:'Осень', icon:'leaf', id:'autumn'};
  return {name:'Зима', icon:'snow', id:'winter'};
}
function weatherForDay(days){
  if (S.settings.fixedSummer) return {name:'Ясно', icon:'sun', id:'sunny'};
  const r = ((days*9301+49297)%233280)/233280;
  if (r < 0.55) return {name:'Ясно', icon:'sun', id:'sunny'};
  if (r < 0.8)  return {name:'Дождь', icon:'rain', id:'rain'};
  return {name:'Засуха', icon:'drought', id:'drought'};
}
function weatherInfo(){ return weatherForDay(Math.floor(Date.now()/86400000)); }
function openForecast(){
  const day=Math.floor(Date.now()/86400000), labels=['Сегодня','Завтра','Через 2 дня'];
  const effects={sunny:'Обычные условия. Полив даёт +5% к урожаю.',rain:'Работы дольше на 20%, урожай ×0,85.',drought:'Полив даёт +10% к урожаю.'};
  const cards=labels.map((label,i)=>{const w=weatherForDay(day+i);return `<div class="forecast-card"><small>${label}</small><span class="forecast-icon">${ic(w.icon)}</span><b>${w.name}</b><p>${effects[w.id]}</p></div>`;}).join('');
  openDialog(`<h2>${ic('sun')} Прогноз погоды</h2><p class="muted forecast-intro">Погода острова влияет на таймеры и урожай. Прогноз на ближайшие дни:</p><div class="forecast-grid">${cards}</div><p class="forecast-note">Сезон: <b>${seasonInfo().name}</b> · сезонность культур тоже влияет на урожай.</p><button class="btn btn-primary btn-block" onclick="App.closeModal()">Понятно</button>`);
}
function seasonMult(cropId){
  const c = CROPS[cropId], s = seasonInfo().id;
  if (c.season==='any') return 1;
  return c.season===s ? 1 : 0.7;
}
function growthFactor(){
  let f = style().growth;
  if (seasonInfo().id==='winter') f *= 0.25;
  return f;
}
function machineSpeed(mid){
  const m = S.machines[mid];
  if (!m || !m.owned) return 1;
  return MACHINES[mid].speed * (1 + (m.lvl-1)*0.15);
}
function machineStatus(mid){
  if (!mid) return {ok:true, rent:0};
  const m = S.machines[mid];
  if (m.owned && m.cond > 0) return {ok:true, rent:0, speed:machineSpeed(mid)};
  if (m.owned && m.cond <= 0) return {ok:false, broken:true};
  return {ok:true, rent:40, speed:1};
}
function wearMachine(mid){
  const m = S.machines[mid];
  if (m && m.owned) m.cond = clamp(m.cond - randi(2,5), 0, 100);
}
function warehouseUsed(){ return Object.values(S.goods).reduce((a,b)=>a+b,0); }
function addGoods(good, n){
  const room = S.warehouseCap - warehouseUsed();
  const add = clamp(n, 0, Math.max(0, room));
  S.goods[good] += add;
  return add;
}
function fieldById(id){ return S.fields.find(f=>f.id===id); }
function fieldYield(f){
  const c = CROPS[f.crop];
  let mult = 1 + 0.25*f.fert + (f.watered ? (weatherInfo().id==='drought'?0.10:0.05) : 0)
           + (f.weeded?0.15:0) + (f.limed?0.10:0) + (f.sprayed?0.05:0) + f.manualBonus;
  mult *= seasonMult(f.crop);
  if (weatherInfo().id==='rain') mult *= 0.85;
  if (f.weeds && !f.weeded) mult *= 0.85;
  return Math.round(c.yield * mult);
}

/* ---------------- MARKET ---------------- */
function refreshMarket(force){
  const now = Date.now();
  if (!force && now - S.market.at < durMs(600)) return;
  S.market.at = now;
  S.market.mult = {};
  for (const p of POINTS){
    S.market.mult[p.id] = {};
    for (const g in GOODS) S.market.mult[p.id][g] = Math.round(rand(0.8,1.4)*100)/100;
  }
}
function bestPoint(good){
  let best = null, bp = 0;
  for (const p of POINTS){
    const m = S.market.mult[p.id]?.[good] ?? 1;
    if (m > bp){ bp = m; best = p; }
  }
  return {point:best, mult:bp};
}
function sellGood(good, qty){
  qty = Math.min(qty, S.goods[good]);
  if (qty <= 0) return 0;
  const {mult} = bestPoint(good);
  const gain = Math.round(qty * GOODS[good].price * mult);
  S.goods[good] -= qty;
  addCoins(gain); S.stats.sold += qty;
  return gain;
}

/* ---------------- JOBS ---------------- */
function addJob(job){ job.id = uid(); job.endsAt = Date.now() + job.durMs; S.jobs.push(job); }
function startFieldWork(f, action, extra={}){
  const w = WORK[action];
  const st = machineStatus(w.machine);
  if (!st.ok){ toast('Техника сломана — почини в гараже', 'bad', 'wrench'); sfx.bad(); return false; }
  const cost = w.cost + (st.rent||0) + (extra.seedCost||0);
  if (S.coins < cost){ toast('Не хватает монет', 'bad', 'coin'); sfx.bad(); return false; }
  let t = w.time / (st.speed||1);
  if (weatherInfo().id==='rain') t *= 1.2;
  addCoins(-cost);
  f.busy = { action, endsAt: Date.now() + durMs(t), total: durMs(t), crop: extra.crop||null, manualBonus: extra.manualBonus||0 };
  if (w.machine) wearMachine(w.machine);
  addJob({ kind:'field', ref:f.id, durMs: durMs(t) });
  sfx.pop(); save(); renderAll();
  return true;
}
function FX_FIELD_DONE(fieldId, emoji, color){
  try {
    const el = document.querySelector(`[data-swipe-field="${fieldId}"]`);
    if (!el) return;
    requestAnimationFrame(()=>{
      const p = FX.point(el);
      if (p) FX.burst(p.x, p.y, { n:14, speed:4.5, colors:[color,'#fff59d','#ffffff'], size:[1.8,3.6], ringSize:18, type:'dot' });
      FX.pop(el, emoji, 3);
    });
  } catch(e){}
}
function completeFieldWork(f){
  const b = f.busy; if (!b) return;
  f.busy = null;
  const a = b.action;
  if (a==='prepare' || a==='plow'){ f.state='prepared'; FX_FIELD_DONE(f.id, '🌱', '#c5e1a5'); }
  else if (a==='sow'){
    FX_FIELD_DONE(f.id, '🌱', '#b0cf7a');
    const c = CROPS[b.crop];
    f.crop = b.crop; f.state='growing';
    f.t0 = Date.now(); f.t1 = Date.now() + durMs(c.grow / growthFactor());
    f.fert=0; f.watered=false; f.weeded=false; f.limed=false; f.sprayed=false; f.weeds=false; f.weedsChecked=false; f.manualBonus=0;
    if (S.tutorial.step===2) tutAdvance('sow');
  }
  else if (a==='fertilize'){ f.fert = Math.min(2, f.fert+1); FX_FIELD_DONE(f.id, '💧', '#a5d6a7'); }
  else if (a==='spray'){ f.sprayed = true; }
  else if (a==='weed'){ f.weeded = true; f.weeds = false; }
  else if (a==='water'){ f.watered = true; }
  else if (a==='lime'){ f.limed = true; }
  else if (a==='harvest'){
    const units = fieldYield(f);
    const got = addGoods(f.crop, units);
    f.manualBonus = b.manualBonus||0;
    f.state='sterna'; f.crop=null; f.fert=0; f.watered=false; f.weeded=false; f.limed=false; f.sprayed=false; f.weeds=false;
    S.stats.harvests++; addXP(10);
    ui.fieldFx={id:f.id,action:'harvest',at:Date.now()};
    setTimeout(()=>{document.querySelector(`[data-swipe-field="${f.id}"]`)?.classList.remove('field-harvest-pop');if(ui.fieldFx?.id===f.id)ui.fieldFx=null;},1200);
    toast(`Урожай: +${got} ${GOODS[b.crop]?.name||''}`, 'good', 'check');
    sfx.coin(); buzz(40);
    // VISUAL JUICE: салют из поля и монеты в кошелёк
    requestAnimationFrame(()=>{
      const el = document.querySelector(`[data-swipe-field="${f.id}"]`);
      if (el){
        const p = FX.point(el);
        if (p){ FX.floatText(p.x, p.y - 20, '+'+got, '#c5e1a5'); FX.burst(p.x, p.y, { n:26, speed:7, colors:['#ffd54f','#d3a55d','#b0cf7a','#fff59d','#c5e1a5'], size:[2,4.5], ringSize:26 }); FX.pop(el, ({wheat:'🌾',rapeseed:'🌻',corn:'🌽',soy:'🫘',potato:'🥔',cotton:'☁️',grape:'🍇',grass:'🌿'})[b.crop]||'🌾', 3); }
        FX.coin(el);
      }
      FX.confetti(el);
    });
    if (S.tutorial.step===0) tutAdvance('harvest');
  }
  save(); renderAll();
}
function tickJobs(){
  const now = Date.now();
  let changed = false;
  S.jobs = S.jobs.filter(j => {
    if (now >= j.endsAt){
      changed = true;
      if (j.kind==='field'){ const f = fieldById(j.ref); if (f) completeFieldWork(f); }
      else if (j.kind==='contract'){ const c = S.board.find(x=>x.id===j.ref); if (c && c.state==='active'){ c.state='done'; toast(`Заказ «${contractType(c).name}» готов — забери награду!`, 'good', 'clipboard'); sfx.good(); if (S.tutorial.step===4) tutAdvance('ready'); } }
      return false;
    }
    return true;
  });
  for (const f of S.fields){
    if (f.owned && f.state==='growing' && !f.busy && now >= f.t1){
      f.state='ready'; changed = true;
      toast(`${f.name}: ${CROPS[f.crop].name} готово к уборке!`, 'good', 'check'); sfx.good(); buzz(50);
      hint('ready');
    }
    if (f.owned && f.state==='growing' && style().weeds && !f.weedsChecked && !f.weeds){
      const p = 1 - (f.t1-now)/Math.max(1,(f.t1-f.t0));
      if (p > 0.5){ f.weedsChecked = true; if (Math.random()<0.35){ f.weeds = true; toast(`На поле «${f.name}» сорняки! Прополоть: +15% урожая`, 'bad', 'leaf'); } }
    }
  }
  if (changed) renderAll();
}

/* ---------------- CONTRACTS ---------------- */
function contractType(c){ return CONTRACT_TYPES.find(t=>t.id===c.type); }
function genContract(tutorial=false){
  const t = tutorial ? CONTRACT_TYPES[0] : pick(CONTRACT_TYPES);
  const reward = Math.round(rand(t.pay[0], t.pay[1]) * style().pay * (1 + S.rep/200));
  return {
    id: uid(), type: t.id, fieldName: pick(NPC_NAMES),
    reward, cost: t.cost||0, time: t.time, repReq: t.repReq||0,
    state:'board', createdAt: Date.now(), tutorial: !!tutorial,
  };
}
function genBoard(){
  S.board = [];
  for (let i=0;i<6;i++) S.board.push(genContract());
  const cheap = S.board.filter(c=>c.reward<500).length;
  if (cheap < 2){ S.board[0] = genContract(); S.board[1] = genContract(); }
  S.boardAt = Date.now();
}
function activeContracts(){ return S.board.filter(c=>c.state==='active' || c.state==='done'); }
function takeContract(id){
  const c = S.board.find(x=>x.id===id);
  if (!c || c.state!=='board') return;
  if (activeContracts().length >= 3){ toast('Все 3 слота заняты!', 'bad', 'clipboard'); sfx.bad(); return; }
  if (S.rep < c.repReq){ toast(`Нужна репутация ${c.repReq}`, 'bad', 'heart'); sfx.bad(); return; }
  const t = contractType(c);
  const st = machineStatus(t.machine);
  if (!st.ok){ toast('Техника сломана — почини в гараже', 'bad', 'wrench'); sfx.bad(); return; }
  const total = c.cost + (st.rent ? Math.round(c.reward*0.25) : 0);
  if (S.coins < total){ toast('Не хватает монет на расходники', 'bad', 'coin'); sfx.bad(); return; }
  addCoins(-total);
  c.rented = !!st.rent;
  c.state = 'active';
  c.startedAt = Date.now();
  c.endsAt = Date.now() + durMs(c.time / (st.speed||1));
  c.total = durMs(c.time / (st.speed||1));
  if (t.machine) wearMachine(t.machine);
  addJob({ kind:'contract', ref:c.id, durMs: c.total });
  sfx.pop();
  if (S.tutorial.step===3) tutAdvance('contract');
  save(); renderAll();
}
function claimContract(id){
  const c = S.board.find(x=>x.id===id);
  if (!c || c.state!=='done') return;
  startMinigame({
    title:'Бонус за заказ!',
    sub:'Останови маркер в зелёной зоне: +10…20% к награде',
    zone:0.22,
    onDone:(hit)=>{
      const bonus = hit ? rand(1.10,1.20) : 1;
      const gain = Math.round(c.reward * bonus);
      addCoins(gain); S.rep = clamp(S.rep+2, 0, 100);
      S.stats.contractsDone++; addXP(15);
      S.daily.contracts++;
      if (S.daily.contracts>=3 && !S.daily.goal){ S.daily.goal=true; S.gems+=5; toast('Цель дня выполнена: +5 самоцветов!', 'good', 'gem'); }
      S.board = S.board.filter(x=>x.id!==c.id);
      toast(`+${fmt(gain)} монет за заказ${hit?' (бонус!)':''}`, 'good', 'coin');
      sfx.coin(); buzz(50);
      if (hit) { FX.confetti(); FX.shake(); }
      requestAnimationFrame(()=>FX.coin(document.querySelector('#modal-root .dialog') || document.querySelector('[data-tut="claim"]')));
      if (S.tutorial.step===4) tutAdvance('claim');
      save(); renderAll();
    }
  });
}
function cancelContract(id){
  const c = S.board.find(x=>x.id===id);
  if (!c || c.state!=='active') return;
  if (S.style==='expert'){ const pen = Math.round(c.reward*0.10); addCoins(-pen); toast(`Штраф за отмену: −${fmt(pen)} монет`, 'bad', 'coin'); }
  S.board = S.board.filter(x=>x.id!==c.id);
  S.jobs = S.jobs.filter(j=>j.ref!==c.id);
  save(); renderAll();
}

/* ---------------- BUILDINGS & PRODUCTION ---------------- */
function tickBuildings(){
  const now = Date.now();
  const decay = ts()/600;
  for (const id in S.buildings){
    const b = S.buildings[id]; if (!b.owned) continue;
    b.feed = clamp(b.feed-decay, 0, 100);
    b.water = clamp(b.water-decay, 0, 100);
    b.clean = clamp(b.clean-decay, 0, 100);
    const ok = b.feed>=30 && b.water>=30 && b.clean>=30;
    if (ok){
      if (!b.cycleEndsAt) b.cycleEndsAt = now + durMs(BUILDINGS[id].time);
      if (now >= b.cycleEndsAt){
        b.stored = Math.min(b.stored + BUILDINGS[id].units, BUILDINGS[id].units*3);
        b.cycleEndsAt = now + durMs(BUILDINGS[id].time);
      }
    }
  }
  for (const pr of PRODUCTION){
    const p = S.productions[pr.id]; if (!p.owned || !p.running) continue;
    if (now >= p.endsAt){
      p.running = false;
      for (const g in pr.out) p.stored[g] = (p.stored[g]||0) + pr.out[g];
      toast(`${pr.name}: готово! Забери продукцию`, 'good', 'factory'); sfx.good();
      renderAll();
    }
  }
}
function careBuilding(id, kind){
  const b = S.buildings[id];
  b[kind] = clamp(b[kind]+30, 0, 100);
  sfx.pop(); save(); renderAll();
}
function collectBuilding(id){
  const b = S.buildings[id], def = BUILDINGS[id];
  if (b.stored<=0) return;
  const got = addGoods(def.good, b.stored);
  b.stored -= got;
  toast(`+${got} ${GOODS[def.good].name}`, 'good', 'check');
  sfx.coin(); buzz(40); addXP(5); save(); renderAll();
}
function startProduction(id){
  const pr = PRODUCTION.find(p=>p.id===id), p = S.productions[id];
  if (p.running) return;
  for (const g in pr.inp) if (S.goods[g] < pr.inp[g]){ toast(`Не хватает: ${GOODS[g].name} ${pr.inp[g]}`, 'bad', 'box'); sfx.bad(); return; }
  for (const g in pr.inp) S.goods[g] -= pr.inp[g];
  p.running = true; p.total = durMs(pr.time); p.endsAt = Date.now() + p.total;
  sfx.pop(); save(); renderAll();
}
function collectProduction(id){
  const pr = PRODUCTION.find(p=>p.id===id), p = S.productions[id];
  let any = false;
  for (const g in p.stored){ if (p.stored[g]>0){ addGoods(g, p.stored[g]); p.stored[g]=0; any=true; } }
  if (any){
    toast('Продукция на складе!', 'good', 'box'); sfx.coin(); addXP(5);
    requestAnimationFrame(()=>{
      const el = document.querySelector(`[data-prod="${id}"]`) || document.querySelector('.biz-card');
      if (el) FX.pop(el, '📦', 5);
    });
  }
  save(); renderAll();
}

/* ---------------- FOREMAN ---------------- */
function tickForeman(){
  const fm = S.foreman;
  if (!fm.unlocked || !fm.on) return;
  if (S.jobs.some(j=>j.kind==='foreman')) return;
  const owned = S.fields.filter(f=>f.owned && !f.busy);
  let target = owned.find(f=>f.state==='ready');
  let action = 'harvest';
  if (!target){ target = owned.find(f=>f.state==='sterna'); action='prepare'; }
  if (!target){ target = owned.find(f=>f.state==='prepared'); action='sow'; }
  if (!target) return;
  const fee = 20;
  if (S.coins < fee) return;
  const w = WORK[action];
  const st = machineStatus(w.machine);
  if (!st.ok) return;
  addCoins(-fee);
  let t = w.time/(st.speed||1);
  const extra = action==='sow' ? {crop:'wheat', seedCost:CROPS.wheat.seed} : {};
  target.busy = { action, endsAt: Date.now()+durMs(t), total: durMs(t), crop: extra.crop||null, manualBonus:0 };
  if (w.machine) wearMachine(w.machine);
  addJob({ kind:'field', ref:target.id, durMs: durMs(t) });
  save();
}

/* ---------------- OFFLINE ---------------- */
function applyOffline(){
  const elapsed = Math.min((Date.now() - S.lastSeen)/1000, OFFLINE_CAP);
  const gameSec = elapsed * ts();
  if (gameSec < 60) return;
  const lines = [];
  let ready = 0;
  for (const f of S.fields){
    if (f.owned && f.state==='growing' && !f.busy && Date.now()>=f.t1){ f.state='ready'; ready++; }
  }
  if (ready) lines.push(`Готово к уборке: ${ready} пол.`);
  let done = 0;
  for (const c of S.board){
    if (c.state==='active' && Date.now()>=c.endsAt){ c.state='done'; done++; }
  }
  if (done) lines.push(`Заказы готовы к сдаче: ${done}`);
  let prod = 0;
  for (const id in S.buildings){
    const b = S.buildings[id]; if (!b.owned) continue;
    const ok = b.feed>=30 && b.water>=30 && b.clean>=30;
    if (ok && b.cycleEndsAt){
      const cycles = Math.floor((Date.now()-b.cycleEndsAt)/durMs(BUILDINGS[id].time)) + 1;
      if (cycles>0){ b.stored = Math.min(b.stored + cycles*BUILDINGS[id].units, BUILDINGS[id].units*3); prod += cycles*BUILDINGS[id].units; b.cycleEndsAt = Date.now()+durMs(BUILDINGS[id].time); }
    }
  }
  if (prod) lines.push(`Продукция животных накопилась`);
  let finishedRuns = 0;
  for (const def of PRODUCTION){
    const p = S.productions[def.id];
    if (p && p.owned && p.running && Date.now() >= p.endsAt){
      p.running = false;
      for (const good in def.out) p.stored[good] = (p.stored[good]||0) + def.out[good];
      finishedRuns++;
    }
  }
  if (finishedRuns) lines.push(`Производство завершено: ${finishedRuns} цех.`);
  if (lines.length){
    save();
    openDialog(`<div style="text-align:center">
      <div class="big-emoji">🌅</div><h2>Ферма ждала вас!</h2>
      <p class="muted">Прошло ${fmtTime(gameSec)} игрового времени</p>
      ${lines.map(l=>`<p style="font-weight:700">${l}</p>`).join('')}
      <button class="btn btn-primary btn-block" onclick="App.closeModal()">Продолжить</button></div>`);
  }
  if (gameSec >= 60) save();
}

/* ---------------- HINTS ---------------- */
function hint(key){
  if (S.hints[key]) return;
  S.hints[key] = true;
  const msgs = {
    ready:'Совет: нажми на поле, чтобы убрать урожай. Потом продай его на рынке!',
    contract:'Совет: заказы соседей — стабильный доход. Бери 3 сразу!',
    market:'Совет: цены меняются. Продавай там, где цена выше!',
  };
  if (msgs[key]) setTimeout(()=>toast(msgs[key], '', 'bulb'), 1200);
}

/* ---------- Field tile SVG renderer ---------- */
const TILE = { cx:120, cy:104, hw:106, hh:60 };
function tileDiamond(){ return `${TILE.cx},${TILE.cy-TILE.hh} ${TILE.cx+TILE.hw},${TILE.cy} ${TILE.cx},${TILE.cy+TILE.hh} ${TILE.cx-TILE.hw},${TILE.cy}`; }
function soilColors(state){
  switch(state){
    case 'sterna':   return ['#b09a8a','#8d6e63'];
    case 'prepared': return ['#8d6e63','#5d4037'];
    case 'growing':  return ['#a1887f','#6d4c41'];
    case 'ready':    return ['#a1887f','#6d4c41'];
    default:         return ['#a1887f','#6d4c41'];
  }
}
function plantPositions(seed){
  const out = [];
  const rnd = (()=>{ let s = seed||1; return ()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; })();
  for (let i=0;i<5;i++) for (let j=0;j<5;j++){
    const x = TILE.cx + (i-j)*20 + (rnd()-0.5)*7;
    const y = TILE.cy + (i+j)*10 - 40 + (rnd()-0.5)*4;
    const inside = Math.abs(x-TILE.cx)/TILE.hw + Math.abs(y-TILE.cy)/TILE.hh < 0.88;
    if (inside) out.push({x, y, d:(i+j)*10, r:rnd()});
  }
  return out.sort((a,b)=>a.y-b.y);
}
function fieldSVG(f, small){
  const uid2 = f.id + (small?'m':'');
  const state = f.busy ? 'busy' : f.state;
  const [c1, c2] = soilColors(f.busy ? 'growing' : f.state);
  const seed = hashStr(f.id) + 7;
  let inner = '';
  // тень под полем
  inner += `<ellipse cx="${TILE.cx}" cy="${TILE.cy+34}" rx="${TILE.hw*0.92}" ry="26" fill="rgba(27,60,20,.28)"/>`;
  // почва
  inner += `<defs>
    <linearGradient id="soil-${uid2}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/>
    </linearGradient>
    <clipPath id="clip-${uid2}"><polygon points="${tileDiamond()}"/></clipPath>
  </defs>`;
  inner += `<polygon points="${tileDiamond()}" fill="url(#soil-${uid2})" stroke="rgba(0,0,0,.18)" stroke-width="2"/>`;
  // борозды
  let rows = '';
  for (let k=1;k<5;k++){
    rows += `<line x1="${TILE.cx-TILE.hw+k*TILE.hw/5}" y1="${TILE.cy}" x2="${TILE.cx}" y2="${TILE.cy-TILE.hh+k*TILE.hh/5}" stroke="rgba(0,0,0,.14)" stroke-width="2.4"/>`;
    rows += `<line x1="${TILE.cx+TILE.hw-k*TILE.hw/5}" y1="${TILE.cy}" x2="${TILE.cx}" y2="${TILE.cy-TILE.hh+k*TILE.hh/5}" stroke="rgba(0,0,0,.14)" stroke-width="2.4"/>`;
    rows += `<line x1="${TILE.cx-TILE.hw+k*TILE.hw/5}" y1="${TILE.cy}" x2="${TILE.cx}" y2="${TILE.cy+TILE.hh-k*TILE.hh/5}" stroke="rgba(255,255,255,.10)" stroke-width="2.4"/>`;
    rows += `<line x1="${TILE.cx+TILE.hw-k*TILE.hw/5}" y1="${TILE.cy}" x2="${TILE.cx}" y2="${TILE.cy+TILE.hh-k*TILE.hh/5}" stroke="rgba(255,255,255,.10)" stroke-width="2.4"/>`;
  }
  inner += `<g clip-path="url(#clip-${uid2})">${rows}</g>`;
  // стерня
  if (f.state==='sterna' && !f.busy){
    let st = '';
    for (const p of plantPositions(seed)){
      st += `<path d="M${p.x} ${p.y} l-2 -6 M${p.x+3} ${p.y} l1 -7 M${p.x-3} ${p.y} l-1 -5" stroke="#d7c9a8" stroke-width="1.8" stroke-linecap="round"/>`;
    }
    inner += st;
  }
  // растения
  if (f.state==='growing' && !f.busy){
    const p = clamp(1 - (f.t1-Date.now())/Math.max(1,(f.t1-f.t0)), 0, 1);
    const s = plantScale(p);
    for (const pos of plantPositions(seed)){
      const sc = s * (0.85 + pos.r*0.3);
      inner += `<g transform="translate(${pos.x},${pos.y}) scale(${sc.toFixed(2)})"><g class="plant-sway" style="animation-delay:${(pos.r*2).toFixed(1)}s">${plantInner(f.crop, p)}</g></g>`;
    }
    if (f.weeds && !f.weeded){
      for (const pos of plantPositions(seed).filter((_,i)=>i%3===0)){
        inner += `<g transform="translate(${pos.x+6},${pos.y}) scale(.8)"><path d="M0 0 C-1 -6 -3 -9 -5 -11 M0 0 C0 -7 1 -11 3 -13 M0 0 C1 -5 3 -8 5 -9" stroke="#7cb342" stroke-width="2" fill="none" stroke-linecap="round"/></g>`;
      }
    }
  }
  // готовый урожай: зрелые растения + блёстки
  if (f.state==='ready' && !f.busy){
    for (const pos of plantPositions(seed)){
      const sc = 0.95 + pos.r*0.15;
      inner += `<g transform="translate(${pos.x},${pos.y}) scale(${sc.toFixed(2)})"><g class="plant-sway" style="animation-delay:${(pos.r*2).toFixed(1)}s">${PLANTS[f.crop]||SPROUT}</g></g>`;
    }
    for (const pos of plantPositions(seed).filter((_,i)=>i%4===1)){
      inner += `<path class="sparkle" style="animation-delay:${(pos.r*1.8).toFixed(1)}s" transform="translate(${pos.x},${pos.y-26})" d="M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6Z" fill="#fff59d"/>`;
    }
  }
  // работа техники: трактор ездит по полю
  if (f.busy){
    const w = WORK[f.busy.action];
    const mach = w.machine ? svgInner(MACH_SVG[w.machine]()) : svgInner(I.tractor);
    inner += `<g class="tractor-drive">
      <g transform="translate(28,${TILE.cy+10}) scale(0.95)">${mach}</g>
      <circle class="dust" cx="30" cy="${TILE.cy+34}" r="5" fill="rgba(210,190,160,.7)"/>
      <circle class="dust" style="animation-delay:.5s" cx="24" cy="${TILE.cy+38}" r="4" fill="rgba(210,190,160,.6)"/>
      <circle class="dust" style="animation-delay:1s" cx="20" cy="${TILE.cy+42}" r="3.4" fill="rgba(210,190,160,.5)"/>
    </g>`;
  }
  // облако
  inner += `<g class="cloud-drift" opacity=".9"><g transform="translate(0,18)">
    <ellipse cx="20" cy="10" rx="16" ry="8" fill="#fff"/><ellipse cx="34" cy="6" rx="12" ry="7" fill="#fff"/><ellipse cx="46" cy="10" rx="14" ry="7" fill="#fff"/>
  </g></g>`;
  return `<svg class="tile-svg" viewBox="0 0 240 240" aria-hidden="true">${inner}</svg>`;
}

function flyCoin(fromEl){
  try{
    const r = fromEl.getBoundingClientRect();
    const c = document.createElement('div');
    c.className='float-coin'; c.textContent='🪙';
    c.style.left = (r.left+r.width/2)+'px'; c.style.top = (r.top)+'px';
    document.body.appendChild(c);
    const hud = $('#hud .chip').getBoundingClientRect();
    c.animate([
      {transform:'translate(0,0) scale(1)', opacity:1},
      {transform:`translate(${hud.left-r.left}px, ${hud.top-r.top}px) scale(.4)`, opacity:.6}
    ], {duration:650, easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish = ()=>c.remove();
  }catch(e){}
}

/* ---------------- MINI-GAME (бонус) ---------------- */
function startMinigame({title, sub, zone=0.22, onDone}){
  document.body.classList.add('wallet-overlay');
  const z0 = rand(0.05, 0.95-zone);
  let pos = 0, dir = 1, alive = true, timer = null;
  $('#overlay-root').innerHTML = `
    <div class="backdrop center">${walletMarkup()}<div class="dialog mg-wrap">
      <h2>${ic('gift')} ${title}</h2><p class="muted">${sub}</p>
      <div class="mg-bar">
        <div class="mg-zone" style="left:${z0*100}%;width:${zone*100}%"></div>
        <div class="mg-marker" id="mg-marker" style="left:0%"></div>
      </div>
      <button class="btn btn-gold btn-block btn-shine" id="mg-stop" style="min-height:60px;font-size:18px">СТОП!</button>
      <p class="small muted" style="margin-top:8px">Пропустишь — ничего страшного, награда всё равно твоя</p>
    </div></div>`;
  const marker = $('#mg-marker');
  timer = setInterval(()=>{
    pos += dir * 0.028;
    if (pos>1){ pos=1; dir=-1; } if (pos<0){ pos=0; dir=1; }
    marker.style.left = `calc(${pos*100}% - 3px)`;
  }, 16);
  const finish = (hit)=>{
    if (!alive) return; alive=false; clearInterval(timer);
    $('#overlay-root').innerHTML='';
    document.body.classList.remove('wallet-overlay');
    onDone(hit);
  };
  $('#mg-stop').onclick = ()=>{ sfx.pop(); finish(pos>=z0 && pos<=z0+zone); };
  setTimeout(()=>finish(false), 6000);
}

function renderTabs(){
  const readyFields = S.fields.filter(f=>f.owned && f.state==='ready').length;
  const claimable = S.board.filter(c=>c.state==='done').length;
  const tab = (id, icon, label, badge) => `
    <button class="tab-btn ${ui.tab===id?'active':''}" data-tut="tab-${id}" onclick="App.tab('${id}')">
      ${ic(icon)}<span>${label}</span>${badge?`<span class="tab-badge">${badge}</span>`:''}
    </button>`;
  $('#tabs').innerHTML = tab('farm','home','Ферма','') + tab('map','seed','Поля',readyFields||'') + tab('business','barn','Хоз-во','') + tab('tasks','clipboard','Заказы',claimable||'') + `<button class="tab-btn garage-tab" onclick="App.openGarage()" aria-label="Открыть гараж">${ic('tractor')}<span>Гараж</span></button>`;
}

function renderScreen(){
  if (!S) return;
  if (ui.tab==='farm') renderFarm();
  else if (ui.tab==='map') renderMap();
  else if (ui.tab==='business') renderBusiness();
  else renderTasks();
  positionCoach();
}

/* ---------- FARM TAB ---------- */
function fieldTileHTML(f){
  const busy=!!f.busy;
  const stage=f.state==='ready'?'ready':f.state==='growing'?'growing':'soil';
  const stateLabel=busy?`${WORK[f.busy.action].name}…`:f.state==='ready'?'ГОТОВ К УБОРКЕ':f.state==='growing'?`${CROPS[f.crop]?.name||'Культура'} растёт`:f.state==='prepared'?'ГОТОВО К ПОСЕВУ':'НУЖНА ОБРАБОТКА';
  const micro=busy?`Техника · ${fmtTime(Math.max(0,(f.busy.endsAt-Date.now())/1000))}`:f.state==='growing'?`Сбор через <span data-timer="${f.id}">…</span>`:f.state==='ready'?'Урожай готов':f.state==='prepared'?'Выбери культуру':'Подготовь почву';
  const top=busy?'РАБОТА ВЫПОЛНЯЕТСЯ':f.state==='ready'?'ГОТОВНОСТЬ · 100%':f.state==='growing'?'РОСТ КУЛЬТУРЫ':'УЧАСТОК';
  const actionIcon=busy?'tractor':f.state==='ready'?'check':f.state==='growing'?'clock':f.state==='prepared'?'seed':'wrench';
  const harvestFx=ui.fieldFx?.id===f.id&&ui.fieldFx.action==='harvest'&&Date.now()-ui.fieldFx.at<1200;
  return `<button class="field-tile ${f.state==='ready'&&!busy?'ready-glow':''} ${harvestFx?'field-harvest-pop':''}" data-tut="field-${f.id}" data-swipe-field="${f.id}" onclick="App.openField('${f.id}')" aria-label="${esc(f.name)} — ${stateLabel}">
    <span class="field-photo stage-${stage}">
      <span class="photo-top"><span>${top}</span><i>${ic(actionIcon)}</i></span>
      <span class="photo-bottom"><b class="fname">${esc(f.name)}</b><small class="fstate">${stateLabel}</small>
        ${f.state==='growing'||busy?`<span class="photo-progress"><i data-pb="${f.id}" style="width:0%"></i></span>`:''}
        <small class="photo-meta">${micro}</small>
      </span>
      ${busy?`<span class="work-marker">${machIcon(WORK[f.busy.action].machine||'tractor')}</span>`:''}
    </span>
  </button>`;
}

function renderFarm(){
  const owned=S.fields.filter(f=>f.owned);
  const ready=owned.filter(f=>f.state==='ready'&&!f.busy);
  const growing=owned.filter(f=>f.state==='growing').length;
  const busy=owned.filter(f=>f.busy).length;
  const active=activeContracts().length;
  const login=S.loginReward||(S.loginReward={lastClaim:'',streak:0});
  const loginClaimed=login.lastClaim===todayStr();
  const loginStreak=loginClaimed?(login.streak||1):(login.lastClaim===yesterdayStr()?(login.streak||0)+1:1);
  const loginDay=(loginStreak-1)%LOGIN_REWARDS.length+1;
  const loginPrize=LOGIN_REWARDS[loginDay-1];
  const loginPrizeText=[loginPrize.coins?`+${fmt(loginPrize.coins)} монет`:null,loginPrize.gems?`+${loginPrize.gems} ${gemWord(loginPrize.gems)}`:null].filter(Boolean).join(' · ');
  const focus=ready[0] || owned.find(f=>f.state==='prepared') || owned.find(f=>f.state==='sterna') || owned.find(f=>f.state==='growing');
  let focusText='Расширь хозяйство', focusSub='Открой карту и выбери новое поле', focusIcon='map';
  if(focus){
    if(focus.state==='ready'){focusText='Урожай созрел';focusSub=`${focus.name} · ${CROPS[focus.crop]?.name||'культура'} ждёт уборки`;focusIcon='wheat';}
    else if(focus.state==='growing'){focusText='Поля растут';focusSub=`${focus.name} · осталось ${fmtTime(Math.max(0,(focus.t1-Date.now())/1000))}`;focusIcon='clock';}
    else if(focus.state==='prepared'){focusText='Поле готово к посеву';focusSub=`${focus.name} · выбери культуру`;focusIcon='seed';}
    else {focusText='Пора в поле';focusSub=`${focus.name} · почва ждёт обработки`;focusIcon='tractor';}
  }
  const tutAttr = S.tutorial && !S.tutorial.done && (S.tutorial.step===0 && focus?.id==='f1' || S.tutorial.step===2 && focus?.id==='f1') ? `data-tut="${S.tutorial.step===0?'harvest':'field-f1'}"` : '';
  $('#screen').innerHTML = `
    <div class="farm-scene compact-scene season-${seasonInfo().id} weather-${weatherInfo().id}" role="group" aria-label="Островная ферма · ${seasonInfo().name}, ${weatherInfo().name}">
      <div class="scene-top"><span class="scene-kicker">ОСТРОВ • ${seasonInfo().name.toUpperCase()}</span><button class="scene-weather" onclick="App.openForecast()" aria-label="Прогноз погоды: ${weatherInfo().name}">${ic(weatherInfo().icon)} ${weatherInfo().name}<span class="forecast-chevron">›</span></button></div>
      <div class="scene-copy"><div class="scene-title">Твоя ферма</div><div class="scene-caption">Всё важное — под рукой</div></div>
      <div class="scene-count">${owned.length} / ${S.fields.length} полей</div>
    </div>
    <button class="daily-focus ${S.daily.goal?'is-done':''}" onclick="App.tab('tasks')">
      <span class="focus-mark">${ic(S.daily.goal?'check':'target')}</span>
      <span class="focus-copy"><b>${S.daily.goal?'Цель дня выполнена':'Заказы на сегодня'}</b><small>${S.daily.goal?'Награда получена':'3 заказа · награда 5 самоцветов'}</small>
        <span class="focus-progress"><i style="width:${Math.min(100,S.daily.contracts/3*100)}%"></i></span></span>
      <span class="focus-count">${S.daily.contracts}/3 <small>→</small></span>
    </button>
    <div class="overview-stats">
      <button class="overview-stat" onclick="App.tab('map')"><b>${ready.length}</b><small>к уборке</small></button>
      <button class="overview-stat" onclick="App.tab('map')"><b>${growing}</b><small>растёт</small></button>
      <button class="overview-stat" onclick="App.tab('tasks')"><b>${active}/3</b><small>заказов</small></button>
    </div>
    <div class="priority-card">
      <div class="priority-icon">${ic(focusIcon)}</div>
      <div class="priority-copy"><small>СЛЕДУЮЩИЙ ШАГ</small><b>${focusText}</b><span>${focusSub}</span></div>
      <button class="priority-go" ${focus?`onclick="App.openField('${focus.id}')"`:`onclick="App.tab('map')"`} ${tutAttr} aria-label="${focusText}">${ic('arrow')}</button>
    </div>
    <div class="overview-actions">
      <button class="overview-action" onclick="App.tab('map')">${ic('seed')}<span>Мои поля</span></button>
      <button class="overview-action" onclick="App.tab('business')">${ic('barn')}<span>Хозяйство</span></button>
      <button class="overview-action" onclick="App.openGarage()">${ic('tractor')}<span>Гараж</span></button>
      <button class="overview-action" ${S.tutorial.step===1?'data-tut="sell"':''} onclick="App.openMarket()">${ic('coin')}<span>Рынок</span></button>
    </div>
    <div class="login-reward ${loginClaimed?'claimed':''}">
      <button class="login-stamp" type="button" ${loginClaimed?'disabled':''} onclick="App.claimDailyReward()" aria-label="${loginClaimed?'Награда уже получена':'Забрать подарок'}">${ic(loginClaimed?'check':'gift')}</button>
      <span class="login-copy"><b>${loginClaimed?'Награда получена':`Ежедневный бонус · день ${loginDay}/7`}</b><small>${loginClaimed?`Серия входов: ${login.streak||1} дн.`:loginPrizeText}</small>
        <span class="reward-track">${LOGIN_REWARDS.map((_,i)=>`<i class="${i<loginDay?'filled':''}"></i>`).join('')}</span>
      </span>
      <button class="login-claim" ${loginClaimed?'disabled':''} onclick="App.claimDailyReward()">${loginClaimed?'Получено':'Забрать'}</button>
    </div>
    <div class="foreman-row"><span class="foreman-mark">${ic('hand')}</span><span class="foreman-copy"><b>Бригадир</b><small>${S.foreman.unlocked?(S.foreman.on?'Автоматизация включена':'Автоматизация на паузе'):'Помощник открывается с 3 уровня'}</small></span>${S.foreman.unlocked?`<button class="mini-cta" onclick="App.toggleForeman()">${S.foreman.on?'Пауза':'Включить'}</button>`:`<button class="mini-cta" onclick="App.unlockForeman()">Нанять · 800</button>`}</div>
    <div class="overview-footer"><span>${busy?`${busy} работ выполняется`:'Техника работает по таймеру'}</span><span>${seasonInfo().name} · ${weatherInfo().name}</span></div>
  `;
}

/* ---------- MAP TAB ---------- */
function renderMap(){
  ui.district=clamp(ui.district||0,0,DISTRICTS.length-1);
  const di=ui.district, d=DISTRICTS[di], unlocked=S.level>=d.lvl;
  const fields=S.fields.slice(di*4,di*4+4);
  const owned=fields.filter(f=>f.owned).length;
  const districtTabs=DISTRICTS.map((x,i)=>`<button class="district-tab ${i===di?'active':''}" onclick="App.district(${i})"><span>${x.name.replace(' район','').replace(' поля','')}</span><small>${i===0?'I':i===1?'II':'III'}</small></button>`).join('');
  let cards='';
  fields.forEach(f=>{
    if(f.owned){ cards+=fieldTileHTML(f); return; }
    if(unlocked){ cards+=`<div class="land-card"><div class="land-plot"><div class="field-photo stage-soil land-photo"><span class="photo-top"><span>НОВЫЙ УЧАСТОК</span>${ic('map')}</span></div></div><div class="land-info"><b>${esc(f.name)}</b><small>Участок под застройку</small><button class="btn btn-primary btn-sm btn-block" onclick="App.buyField('${f.id}')">Купить · ${fmt(d.price)}</button></div></div>`; }
    else { cards+=`<div class="land-card locked"><div class="land-plot"><div class="field-photo stage-soil land-photo"><span class="photo-top"><span>НОВЫЙ УЧАСТОК</span>${ic('map')}</span></div></div><div class="land-info"><b>${esc(f.name)}</b><small>Откроется на ${d.lvl} уровне</small><span class="lock-tag">${ic('shield')} Закрыто</span></div></div>`; }
  });
  $('#screen').innerHTML=`
    <div class="page-heading"><div><small>УГОДЬЯ</small><h2>Поля острова</h2></div><div class="row"><span class="district-count">${owned}/4 своих</span><button class="garage-shortcut" onclick="App.doAll()">${ic('bolt')} Авто</button></div></div>
    <div class="district-tabs">${districtTabs}</div>
    <div class="district-heading"><div><b>${d.name}</b><small>${unlocked?'Выбери участок или управляй своими полями':`Нужен ${d.lvl} уровень`}</small></div><span class="land-price">${fmt(d.price)} <small>мон.</small></span></div>
    <div class="grid2 land-grid">${cards}</div>
    <div class="land-footnote">${ic('info')} Нажми на своё поле, чтобы обработать его или собрать урожай.</div>
  `;
}

function renderBusiness(){
  const sections=[['animals','Животные'],['production','Цеха'],['warehouse','Склад']];
  const tabs=sections.map(([id,label])=>`<button class="biz-tab ${ui.biz===id?'active':''}" onclick="App.businessSection('${id}')">${label}</button>`).join('');
  let body='';
  if(ui.biz==='animals'){
    body=`<div class="business-grid">`;
    for(const id in BUILDINGS){
      const b=S.buildings[id], d=BUILDINGS[id];
      const care=(kind,v,icon)=>`<button class="care-mini" onclick="App.care('${id}','${kind}')" aria-label="Пополнить"><span>${ic(icon)}</span><i><b style="width:${v}%"></b></i></button>`;
      body+=`<article class="business-card">
        <div class="business-card-head"><span class="business-icon">${ic(BLD_ICON[id])}</span><div><b>${d.name}</b><small>${b.owned?`${b.stored} ед. готово`:`${fmt(d.price)} монет`}</small></div></div>
        ${b.owned?`<div class="care-strip">${care('feed',b.feed,'sack')}${care('water',b.water,'droplet')}${care('clean',b.clean,'wrench')}</div>
          <div class="business-card-foot"><span>${b.stored>0?`Готово ×${b.stored}`:fmtTime(Math.max(0,(b.cycleEndsAt-Date.now())/1000))}</span>${b.stored>0?`<button class="mini-cta" onclick="App.collectBuilding('${id}')">Собрать</button>`:''}</div>`
          :`<div class="business-desc">${d.desc}</div><button class="mini-cta full" onclick="App.buyBuilding('${id}')">Построить</button>`}
      </article>`;
    }
    body+=`</div><div class="business-hint">${ic('info')} Уход поддерживает производство. Забирай товары на склад.</div>`;
  } else if(ui.biz==='production'){
    body=`<div class="business-grid">`;
    for(const d of PRODUCTION){
      const p=S.productions[d.id], stored=Object.values(p.stored||{}).reduce((a,b)=>a+b,0);
      const canStart=!p.running&&Object.keys(d.inp).every(g=>S.goods[g]>=d.inp[g]);
      body+=`<article class="business-card">
        <div class="business-card-head"><span class="business-icon">${ic(PROD_ICON[d.id])}</span><div><b>${d.name}</b><small>${fmt(d.price)} монет</small></div></div>
        <div class="business-desc">${d.desc}</div>
        ${p.owned?(p.running?`<div class="bar gold"><i data-pb="prod-${d.id}" style="width:0%"></i></div><div class="business-card-foot"><span data-timer="prod-${d.id}">…</span></div>`:stored?`<div class="business-card-foot"><span>Готово к выдаче</span><button class="mini-cta" onclick="App.collectProduction('${d.id}')">Забрать</button></div>`:`<div class="business-card-foot"><span>${fmtTime(d.time/ts())}</span><button class="mini-cta" ${canStart?'':'disabled'} onclick="App.startProduction('${d.id}')">Запустить</button></div>`)
        :`<button class="mini-cta full" onclick="App.buyProduction('${d.id}')">Построить</button>`}
      </article>`;
    }
    body+=`</div><div class="business-hint">${ic('info')} Сначала произведи нужные ингредиенты, затем запускай цех.</div>`;
  } else {
    const goods=Object.keys(S.goods).filter(g=>S.goods[g]>0);
    body=`<div class="warehouse-summary"><div><small>ЗАНЯТО НА СКЛАДЕ</small><b>${fmt(warehouseUsed())} <i>/ ${fmt(S.warehouseCap)}</i></b></div><button class="mini-cta" onclick="App.openMarket()">${ic('coin')} Продать</button></div>
      ${goods.length?`<div class="goods-grid">${goods.map(g=>`<div class="goods-item"><span class="goods-symbol">${goodsIcon(g)}</span><span>${GOODS[g].name}</span><b>×${fmt(S.goods[g])}</b></div>`).join('')}</div>`:`<div class="empty-state"><span>${ic('box')}</span><b>Склад пока пуст</b><small>Убери урожай или собери продукцию</small></div>`}
      <div class="warehouse-actions"><button class="btn btn-primary" onclick="App.openMarket()">${ic('coin')} Рынок</button><button class="btn btn-ghost" onclick="App.openLoan()">${ic('card')} Аванс ${S.debt?`· долг ${fmt(S.debt)}`:''}</button></div>
      <div class="business-hint">${S.autoSell?'Авто-продажа включена':'Продажа вручную · цены меняются на рынке'}<button class="mini-cta" onclick="App.toggleAutoSell()">${S.autoSell?'Отключить':'Авто-продажа'}</button></div>`;
  }
  $('#screen').innerHTML=`<div class="page-heading"><div><small>РАЗВИТИЕ</small><h2>Хозяйство</h2></div><button class="garage-shortcut" onclick="App.openGarage()">${ic('tractor')} Гараж</button></div><div class="biz-tabs">${tabs}</div>${body}`;
}

/* ---------- TASKS TAB ---------- */
function renderTasks(){
  const act=activeContracts(), goalLeft=Math.max(0,3-S.daily.contracts);
  const board=S.board.filter(c=>c.state==='board');
  const maxPage=Math.max(0,Math.ceil(board.length/3)-1); ui.boardPage=clamp(ui.boardPage||0,0,maxPage);
  const tabs=`<div class="biz-tabs task-tabs"><button class="biz-tab ${ui.taskView==='active'?'active':''}" onclick="App.taskSection('active')">Мои заказы <span>${act.length}</span></button><button class="biz-tab ${ui.taskView==='board'?'active':''}" onclick="App.taskSection('board')">Доска <span>${board.length}</span></button></div>`;
  let html=`<div class="page-heading"><div><small>СОСЕДИ И ЗАКАЗЫ</small><h2>Контракты</h2></div><span class="rep-tag">${ic('heart')} ${S.rep}</span></div>
    <div class="daily-compact ${goalLeft===0?'done':''}"><span>${ic(goalLeft===0?'check':'target')}</span><div><b>${goalLeft===0?'Дневная цель выполнена':'Цель дня'}</b><small>${goalLeft===0?'5 самоцветов получено':`${S.daily.contracts}/3 заказа · награда 5 самоцветов`}</small></div><i>${S.daily.contracts}/3</i></div>${tabs}`;
  if(ui.taskView==='active'){
    html+=`<div class="task-list">`;
    if(!act.length) html+=`<div class="empty-state"><span>${ic('clipboard')}</span><b>Пока нет активных заказов</b><small>Загляни на доску и выбери работу по силам</small><button class="mini-cta" onclick="App.taskSection('board')">Открыть доску</button></div>`;
    for(const c of act){
      const t=contractType(c), done=c.state==='done';
      html+=`<article class="contract-card ${done?'done':''}"><div class="contract-visual">${machIcon(t.machine,'ic-lg')}</div><div class="contract-main"><div class="row between"><b>${t.name}</b><span class="contract-reward">${ic('coin')} ${fmt(c.reward)}</span></div><small>${esc(c.fieldName)} · ${MACHINES[t.machine].name}${c.rented?' · аренда':''}</small>
        ${done?`<button class="btn btn-primary btn-block" data-tut="claim" onclick="App.claimContract('${c.id}')">${ic('gift')} Забрать награду</button>`:`<div class="contract-progress"><div class="bar"><i data-pb="contract-${c.id}" style="width:0%"></i></div><span data-timer="contract-${c.id}">…</span><button class="cancel-link" onclick="App.cancelContract('${c.id}')">Отменить</button></div>`}</div></article>`;
    }
    html+=`</div><button class="btn btn-primary btn-block board-link" onclick="App.taskSection('board')">${ic('clipboard')} Найти заказ</button>`;
  }else{
    const show=board.slice(ui.boardPage*3,ui.boardPage*3+3);
    html+=`<div class="board-toolbar"><span>${board.length} доступных заказов</span><span class="board-pages"><button onclick="App.boardPage(-1)" ${ui.boardPage===0?'disabled':''}>‹</button><b>${ui.boardPage+1}/${maxPage+1}</b><button onclick="App.boardPage(1)" ${ui.boardPage>=maxPage?'disabled':''}>›</button></span></div><div class="task-list">`;
    if(!board.length) html+=`<div class="empty-state"><b>Доска обновляется</b><small>Новые заказы скоро появятся</small></div>`;
    for(const c of show){
      const t=contractType(c), st=machineStatus(t.machine), rent=st.rent?Math.round(c.reward*.25):0;
      const can=act.length<3&&S.rep>=c.repReq&&S.coins>=c.cost+rent;
      html+=`<article class="board-card"><div class="contract-visual">${machIcon(t.machine,'ic-lg')}</div><div class="contract-main"><div class="row between"><b>${t.name}</b><span class="contract-reward">${ic('coin')} ${fmt(c.reward)}</span></div><small>${esc(c.fieldName)} · ${fmtTime(c.time/ts())} · ${MACHINES[t.machine].name}</small><small>Расход ${c.cost+rent} монет${c.repReq?` · репутация ${c.repReq}+`:''}</small><button class="mini-cta full" ${can?'':'disabled'} onclick="App.takeContract('${c.id}')">Взять заказ</button></div></article>`;
    }
    html+=`</div>`;
  }
  $('#screen').innerHTML=html;
}

/* ---------- FIELD SHEET ---------- */
function openField(id){
  const f = fieldById(id);
  ui.selField = id;
  let html = `<h2>${ic('seed')} ${esc(f.name)}</h2>`;
  const actBtn = (action, label, extra='') => {
    const w = WORK[action];
    const st = machineStatus(w.machine);
    const cost = w.cost + (st.rent||0) + (extra.seedCost||0);
    const dis = !st.ok || S.coins < cost;
    const sub = st.broken ? 'сломана — в гараж' : (st.rent ? `аренда +${st.rent}` : (w.machine ? MACHINES[w.machine].name : 'без техники'));
    return `<button class="btn ${action==='harvest'?'btn-gold':'btn-primary'} btn-block" ${dis?'disabled':''} onclick="App.fieldAction('${action}')">
      ${w.machine ? machIcon(w.machine) : ic('droplet')} ${label||w.name} · ${cost} монет <small style="font-weight:600;opacity:.85">(${sub}, ${fmtTime(w.time/(st.speed||1)/ts())})</small></button>`;
  };
  if (f.busy){
    html += `<div class="card" style="margin-top:10px"><b>${WORK[f.busy.action].name}…</b>
      <div class="bar" style="margin-top:8px"><i data-pb="${f.id}" style="width:0%"></i></div>
      <div class="small muted" data-timer="${f.id}" style="margin-top:4px">…</div>
      ${S.daily.speedups<5?`<button class="btn btn-blue btn-block" style="margin-top:8px" onclick="App.speedField('${f.id}')">${ic('bolt')} Ускорить за 1 самоцвет (${S.daily.speedups}/5 в день)</button>`:''}
      </div>`;
  } else if (f.state==='sterna'){
    html += `<p class="muted">Стерня после уборки. Обработай почву перед посевом.</p><div class="action-list">`;
    html += actBtn('prepare');
    if (S.style!=='casual') html += actBtn('plow');
    html += `</div>`;
  } else if (f.state==='prepared'){
    html += `<p class="muted">Почва готова! Выбери культуру:</p><div class="crop-grid">`;
    for (const cid in CROPS){
      const c = CROPS[cid];
      const offSeason = seasonMult(cid)<1;
      html += `<button class="crop-pick" ${S.coins<c.seed?'disabled':''} onclick="App.pickCrop('${cid}')">
        <span class="plant-ic"><svg viewBox="-16 -46 32 48">${PLANTS[cid]}</svg></span>${c.name}<br><small>${fmtTime(c.grow/ts())}</small><br><small>семена ${c.seed}</small>${offSeason?'<br><small style="color:#f57f17">не сезон −30%</small>':''}</button>`;
    }
    html += `</div>`;
  } else if (f.state==='growing'){
    const c = CROPS[f.crop];
    const y = fieldYield(f);
    html += `<p class="muted">${c.name} растёт. Ожидаемый урожай: <b>${y}</b> ед. ${f.weeds&&!f.weeded?'<br>Сорняки снижают урожай!':''}</p>
    <div class="action-list">`;
    if (f.weeds && !f.weeded) html += actBtn('weed','Прополоть (+15%)');
    if (!f.watered) html += actBtn('water','Полить (+5%)');
    if (f.fert<2) html += actBtn('fertilize',`Удобрение ${f.fert+1}/2 (+25%)`);
    if (!f.sprayed) html += actBtn('spray','Опрыскивание (+5%)');
    if (style().lime && !f.limed) html += actBtn('lime','Известь (+10%)');
    html += `<button class="btn btn-ghost btn-block" onclick="App.closeModal()">Закрыть</button></div>`;
  } else if (f.state==='ready'){
    const y = fieldYield(f);
    html += `<p class="muted">Урожай: <b>${y}</b> ед. (продажа ≈ ${fmt(y)} монет)</p><div class="action-list">`;
    html += `<button class="btn btn-gold btn-block btn-shine" data-tut="harvest" onclick="App.fieldAction('harvest')">${ic('wheat')||''} Убрать урожай</button>`;
    html += `<button class="btn btn-blue btn-block" onclick="App.manualHarvest()">${ic('play')} Сесть за руль (+10% урожая)</button>`;
    html += `</div>`;
  }
  openSheet(html);
}

/* ============================================================
   TUTORIAL (онбординг за 60 секунд)
   ============================================================ */
const TUT_STEPS = [
  {text:'Открой готовое поле и нажми «Убрать урожай».', target:'[data-tut="harvest"]'},
  {text:'Отлично! Теперь продай зерно — кнопка «Продать»', target:'[data-tut="sell"]'},
  {text:'Посей рапс: тап по полю, затем выбери «Рапс»', target:'[data-tut="field-f1"]'},
  {text:'Возьми первый заказ соседа во вкладке «Заказы»', target:'[data-tut="tab-tasks"]'},
  {text:'Заказ готов! Забери награду кнопкой «Получить»', target:'[data-tut="claim"]'},
];
function tutShow(){
  if (!S || S.tutorial.done) return;
  const step = TUT_STEPS[S.tutorial.step];
  if (!step){ tutFinish(); return; }
  const root = $('#coach-root');
  const stepNo=S.tutorial.step+1;
  root.innerHTML = `<div class="coach-bubble" id="coach-bubble" role="status" aria-live="polite">
      <div class="coach-head"><span>БЫСТРЫЙ СТАРТ</span><b>${String(stepNo).padStart(2,'0')} / ${String(TUT_STEPS.length).padStart(2,'0')}</b></div>
      <div class="coach-progress" aria-hidden="true">${TUT_STEPS.map((_,i)=>`<i class="${i<S.tutorial.step?'done':i===S.tutorial.step?'current':''}"></i>`).join('')}</div>
      <div class="txt">${step.text}</div>
      <div class="coach-actions"><button type="button" onclick="App.tutSkip()">Пропустить обучение</button></div>
    </div><div class="coach-arrow" id="coach-arrow"></div>`;
  positionCoach();
}
function positionCoach(){
  if (!S || S.tutorial.done || !$('#coach-bubble')) return;
  const step = TUT_STEPS[S.tutorial.step];
  if (!step) return;
  const el = document.querySelector(step.target);
  const bubble = $('#coach-bubble'), arrow = $('#coach-arrow');
  $$('.tut-glow').forEach(e=>e.classList.remove('tut-glow'));
  if (!el){ bubble.style.bottom = '90px'; bubble.style.top='auto'; arrow.style.display='none'; return; }
  el.classList.add('tut-glow');
  const r = el.getBoundingClientRect();
  const bh = bubble.offsetHeight || 120;
  const above = r.top - bh - 26 > 70;
  bubble.style.top = above ? (r.top - bh - 26) + 'px' : 'auto';
  bubble.style.bottom = above ? 'auto' : (window.innerHeight - r.bottom - 26) + 'px';
  arrow.style.display = 'block';
  arrow.style.left = (clamp(r.left + r.width/2 - 12, 8, window.innerWidth-32)) + 'px';
  if (above){ arrow.style.top = (r.top - 26) + 'px'; arrow.style.borderTop = '14px solid #1f2b23'; arrow.style.borderBottom='none'; }
  else { arrow.style.top = (r.bottom + 12) + 'px'; arrow.style.borderBottom = '14px solid #1f2b23'; arrow.style.borderTop='none'; }
}
function tutAdvance(event){
  if (S.tutorial.done) return;
  const need = ['harvest','sell','sow','contract','claim'][S.tutorial.step];
  if (event !== need) return;
  S.tutorial.step++;
  sfx.good(); buzz(40);
  if (S.tutorial.step >= TUT_STEPS.length) tutFinish();
  else { save(); tutShow(); }
}
function tutFinish(){
  S.tutorial.done = true;
  $('#coach-root').innerHTML = '';
  $$('.tut-glow').forEach(e=>e.classList.remove('tut-glow'));
  addCoins(150); S.gems += 2;
  openDialog(`<div style="text-align:center">
    <div class="big-emoji">🎉</div><h2>Ты настоящий фермер!</h2>
    <p>Награда за обучение: <b>+150 монет и +2 самоцвета</b></p>
    <p class="muted">Дальше сама подскажу, когда понадобится</p>
    <button class="btn btn-primary btn-block" onclick="App.closeModal()">К работе!</button></div>`);
  save();
}

/* ============================================================
   APP ACTIONS
   ============================================================ */
const App = {
  tab(id){ sfx.click(); ui.tab = id; closeModal(); renderAll(); },
  businessSection(id){ ui.biz=id; sfx.click(); renderBusiness(); },
  taskSection(id){ ui.taskView=id; ui.boardPage=0; sfx.click(); renderTasks(); },
  boardPage(delta){ ui.boardPage=Math.max(0,(ui.boardPage||0)+delta); renderTasks(); },
  district(n){ ui.district=n; sfx.click(); renderMap(); },
  closeModal(){ closeModal(); },
  selectPreset(id){ ui.selPreset = id; sfx.click(); renderStart(); },
  selectStyle(id){ ui.selStyle = id; sfx.click(); renderStart(); },
  startGame(){
    S = freshState(ui.selPreset, ui.selStyle);
    genBoard(); refreshMarket(true);
    save(); renderAll(); tutShow();
    toast('Добро пожаловать на остров!', 'good', 'barn');
  },
  openField(id){ sfx.click(); openField(id); },
  swipeHarvest(id){ const f=fieldById(id); if(!f || f.state!=='ready' || f.busy) return; if(startFieldWork(f,'harvest')){ buzz(35); toast('Уборка началась','good','wheat'); } },
  claimDailyReward(){ claimDailyReward(); },
  openForecast(){ openForecast(); },
  fieldAction(action){
    const f = fieldById(ui.selField);
    if (!f || f.busy) return;
    if (action==='sow'){ return; }
    startFieldWork(f, action);
  },
  pickCrop(cid){
    const f = fieldById(ui.selField);
    if (!f) return;
    const c = CROPS[cid];
    if (S.coins < c.seed){ toast('Не хватает монет на семена', 'bad', 'coin'); return; }
    if (startFieldWork(f, 'sow', {crop:cid, seedCost:c.seed})) closeModal();
  },
  speedField(id){
    const f = fieldById(id);
    if (!f || !f.busy || S.gems<1 || S.daily.speedups>=5) return;
    S.gems--; S.daily.speedups++;
    const left = f.busy.endsAt - Date.now();
    f.busy.endsAt = Date.now() + Math.max(500, left*0.3);
    S.jobs.forEach(j=>{ if (j.kind==='field' && j.ref===id) j.endsAt = f.busy.endsAt; });
    toast('Ускорено!', 'good', 'bolt'); sfx.coin(); save(); renderAll();
  },
  manualHarvest(){
    const f = fieldById(ui.selField);
    if (!f) return;
    closeModal();
    startMinigame({
      title:'Ручной режим', sub:'Останови маркер в зелёной зоне: +10% к урожаю',
      zone:0.25,
      onDone:(hit)=>{
        if (hit){ f.manualBonus = 0.10; toast('Отличное вождение! +10% урожая', 'good', 'target'); }
        startFieldWork(f, 'harvest', {manualBonus: f.manualBonus});
      }
    });
  },
  doAll(){
    sfx.click();
    let n = 0;
    for (const f of S.fields){
      if (!f.owned || f.busy) continue;
      if (f.state==='ready' && startFieldWork(f,'harvest')) n++;
      else if (f.state==='sterna' && startFieldWork(f,'prepare')) n++;
    }
    toast(n ? `Запущено работ: ${n}` : 'Сейчас нечего делать — всё в работе', n?'good':'', 'bolt');
    renderAll();
  },
  openMarket(){ sfx.click(); openMarket(); },
  sell(good){
    const gain = sellGood(good, S.goods[good]);
    if (gain>0){
      toast(`+${fmt(gain)} монет`, 'good', 'coin'); sfx.coin(); addXP(5);
      const src = document.querySelector('.goods-item') || document.querySelector('#modal-root .sheet');
      FX.coin(document.querySelector('#modal-root .sheet') || src);
      FX.pop(src, '💰', 4);
      const p = FX.point(src);
      if (p) FX.floatText(p.x, p.y - 6, '+'+fmt(gain), '#ffe082');
    }
    if (S.tutorial.step===1) tutAdvance('sell');
    save(); renderAll(); if (ui.modal) openMarket();
  },
  sellAll(){
    let total = 0;
    for (const g in S.goods) total += sellGood(g, S.goods[g]);
    if (total>0){
      toast(`+${fmt(total)} монет`, 'good', 'coin'); sfx.coin(); addXP(10);
      const src = document.querySelector('#modal-root .sheet') || document.querySelector('.goods-item');
      for (let i=0;i<4;i++) setTimeout(()=>FX.coin(src), i*90);
      FX.confetti(src);
      const pp = FX.point(src);
      if (pp) FX.floatText(pp.x, pp.y - 8, '+'+fmt(total), '#ffe082');
    }
    if (S.tutorial.step===1) tutAdvance('sell');
    save(); renderAll(); if (ui.modal) openMarket();
  },
  openGarage(){ sfx.click(); openGarage(); },
  buyMachine(id){
    const def = MACHINES[id];
    if (S.coins < def.price){ toast('Не хватает монет', 'bad', 'coin'); sfx.bad(); return; }
    addCoins(-def.price); S.machines[id].owned = true; S.machines[id].cond = 100;
    toast(`${def.name} куплен!`, 'good', 'tractor'); sfx.good();
    setTimeout(()=>FX.confetti(document.querySelector('#modal-root .sheet')), 60);
    save(); openGarage(); renderAll();
  },
  sellMachine(id){
    const def = MACHINES[id];
    S.machines[id].owned = false; S.machines[id].cond = 100; S.machines[id].lvl = 1;
    addCoins(Math.round(def.price*0.5));
    toast(`Продано за ${fmt(def.price*0.5)} монет`, 'good', 'coin'); sfx.coin(); save(); openGarage(); renderAll();
  },
  repairMachine(id){
    const def = MACHINES[id], m = S.machines[id];
    const cost = Math.round((100-m.cond)*def.price/100);
    if (S.coins < cost){ toast('Не хватает монет', 'bad', 'coin'); sfx.bad(); return; }
    addCoins(-cost); m.cond = 100;
    toast('Техника как новая!', 'good', 'wrench'); sfx.pop(); save(); openGarage(); renderAll();
  },
  upgradeMachine(id){
    const def = MACHINES[id], m = S.machines[id];
    const cost = Math.round(def.price*0.5*m.lvl);
    if (m.lvl>=3 || S.coins < cost){ toast('Не хватает монет', 'bad', 'coin'); sfx.bad(); return; }
    addCoins(-cost); m.lvl++;
    toast(`${def.name} — уровень ${m.lvl}! Скорость выше`, 'good', 'star'); sfx.good(); save(); openGarage(); renderAll();
  },
  openSettings(){ sfx.click(); openSettings(); },
  async installPwa(){
    sfx.click();
    if (window.matchMedia?.('(display-mode: standalone)').matches || navigator.standalone===true){ toast('Приложение уже установлено','good','check'); return; }
    if (deferredInstallPrompt){
      const promptEvent=deferredInstallPrompt; deferredInstallPrompt=null;
      await promptEvent.prompt();
      const choice=await promptEvent.userChoice;
      toast(choice.outcome==='accepted'?'Приложение устанавливается':'Установку можно запустить позже',choice.outcome==='accepted'?'good':'','info');
      return;
    }
    const isApple=/iphone|ipad|ipod/i.test(navigator.userAgent);
    toast(isApple?'Safari: нажми «Поделиться», затем «На экран Домой»':'Браузер: меню ⋮ → «Установить приложение» или «Добавить на главный экран»','','info');
  },
  setSetting(k, v){
    S.settings[k] = v; sfx.click(); save(); openSettings(); applySettings();
  },
  openHelp(){ openHelp(); },
  resetGame(){
    if (confirm('Точно сбросить весь прогресс?')){ wipeSave(); location.reload(); }
  },

   TICK (1 сек): таймеры, прогресс, автосейв

let tickCount = 0;
function tick(){
  if (!S) return;
  tickCount++;
  if (S.daily.date !== todayStr()){ S.daily = {date:todayStr(), contracts:0, speedups:0, goal:false}; }
  tickJobs();
  tickBuildings();
  tickForeman();
  if (Date.now() - S.boardAt > durMs(900)){ genBoard(); renderAll(); }
  refreshMarket(false);
  updateDynamicUI();
  fxTick();
  if (tickCount % 10 === 0) save();
}
let __fxLast = 0, __fxWeather = null;
function fxTick(){
  if (!S) return;
  const now = Date.now();
  const dt = __fxLast ? now - __fxLast : 16;
  __fxLast = now;
  const w = weatherInfo().id;
  if (w !== __fxWeather){ __fxWeather = w; FX.setWeather(w === 'rain'); }
  FX.ambientUpdate(dt);
}
function updateDynamicUI(){
  const now = Date.now();
  $$('[data-coins]').forEach(el=>el.textContent=fmt(S.coins));
  $$('[data-gems]').forEach(el=>el.textContent=S.gems);
  $$('[data-pb]').forEach(el=>{
    const key = el.dataset.pb;
    let pct = 0, left = 0;
    const f = fieldById(key);
    if (f && f.busy){ pct = 1-(f.busy.endsAt-now)/Math.max(1,f.busy.total); left = (f.busy.endsAt-now)/1000; }
    else if (f && f.state==='growing'){ pct = 1-(f.t1-now)/Math.max(1,(f.t1-f.t0)); left = (f.t1-now)/1000; }
    else if (key.startsWith('contract-')){ const c = S.board.find(x=>x.id===key.slice(9)); if (c&&c.state==='active'){ pct = 1-(c.endsAt-now)/Math.max(1,c.total); left=(c.endsAt-now)/1000; } }
    else if (key.startsWith('prod-')){ const p = S.productions[key.slice(5)]; if (p&&p.running){ pct = 1-(p.endsAt-now)/Math.max(1,p.total); left=(p.endsAt-now)/1000; } }
    el.style.width = clamp(pct*100,0,100)+'%';
    const tm = $(`[data-timer="${key}"]`);
    if (tm) tm.textContent = fmtTime(left);
  });
  const bt = $('[data-timer="board"]');
  if (bt) bt.textContent = fmtTime(Math.max(0,(S.boardAt + durMs(900) - now)/1000));
  positionCoach();
}

/* ---------------- TOUCH GESTURES ---------------- */
function installSwipeGestures(){
  const screen=$('#screen'), modalRoot=$('#modal-root');
  let start=null, modalStart=null;
  const point=e=>{const t=e.changedTouches&&e.changedTouches[0];return t?{x:t.clientX,y:t.clientY,time:Date.now()}:null;};
  const valid=(a,b)=>a&&b&&Date.now()-a.time<900;
  screen.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    const t=e.touches[0];start={x:t.clientX,y:t.clientY,time:Date.now(),target:e.target};
  },{passive:true});
  screen.addEventListener('touchend',e=>{
    const end=point(e);if(!valid(start,end)){start=null;return;}
    const dx=end.x-start.x,dy=end.y-start.y, target=start.target;
    start=null;
    if(Math.abs(dx)<68 || Math.abs(dx)<Math.abs(dy)*1.3)return;
    const field=target.closest?.('[data-swipe-field]');
    if(field && dx<0){ App.swipeHarvest(field.dataset.swipeField); return; }
    if(target.closest?.('button,a,input,select,textarea,[data-no-swipe],#tabs'))return;
    const order=['farm','map','business','tasks'],idx=order.indexOf(ui.tab),next=idx+(dx<0?1:-1);
    if(next>=0&&next<order.length)App.tab(order[next]);
  },{passive:true});
  modalRoot.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    const panel=e.target.closest?.('.sheet,.dialog');if(!panel)return;
    const t=e.touches[0];modalStart={x:t.clientX,y:t.clientY,time:Date.now(),panel};
  },{passive:true});
  modalRoot.addEventListener('touchend',e=>{
    const end=point(e);if(!valid(modalStart,end)){modalStart=null;return;}
    const dx=end.x-modalStart.x,dy=end.y-modalStart.y,panel=modalStart.panel;modalStart=null;
    const closeDown=dy>82&&dy>Math.abs(dx)*1.25&&panel.scrollTop<=1;
    const goBack=dx>105&&Math.abs(dx)>Math.abs(dy)*1.25&&panel.scrollLeft<=1;
    if(closeDown||goBack)App.closeModal();
  },{passive:true});
}

/* ---------------- VISUAL FX ENGINE ---------------- */
const FX = (()=>{
  const cv = document.getElementById('fx-canvas');
  if (!cv) return { burst(){}, coin(){}, confetti(){}, shake(){}, pop(){}, ambientUpdate(){}, point(){} };
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio||1, 2);
  let parts = [], running = false, raf = 0, lastT = 0;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener('resize', resize);

  const COLORS = ['#ffd54f','#d3a55d','#b0cf7a','#89b36b','#a5d6a7','#fff59d','#ffcc80','#c5e1a5'];
  const pick = a => a[(Math.random()*a.length)|0];
  const rnd = (a,b) => a + Math.random()*(b-a);

  function spawn(p){ parts.push(p); if(!running) start(); if(parts.length>460) parts.splice(0, parts.length-460); }

  function start(){ if(running) return; running = true; lastT = performance.now(); raf = requestAnimationFrame(loop); }
  function loop(t){
    const dt = Math.min(50, t - lastT)/16.667; lastT = t;
    ctx.clearRect(0,0,W,H);
    for (let i = parts.length-1; i >= 0; i--){
      const p = parts[i];
      p.life -= dt;
      if (p.life <= 0){ if (p.amb) ambSpawned = Math.max(0, ambSpawned-1); parts.splice(i,1); continue; }
      p.vy += (p.g||0)*dt;
      p.vx *= (p.drag==null?0.995:Math.pow(p.drag,dt));
      p.vy *= (p.drag==null?0.995:Math.pow(p.drag,dt));
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.rot += (p.vr||0)*dt;
      if (p.homing){
        p.age = (p.age||0) + dt;
        if (p.age > 14){
          const dx = p._tx - p.x, dy = p._ty - p.y, d = Math.hypot(dx,dy)||1;
          const k = Math.min(0.34, 0.05 + p.age*0.006);
          p.vx += dx/d * 22 * k * dt;
          p.vy += dy/d * 22 * k * dt;
          p.g = 0; p.drag = 0.9;
          if (d < 22){ parts.splice(i,1); pulseWallet(p._tx, p._ty); continue; }
        }
      }
      if (p.bounce && p.y > p.floor){ p.y = p.floor; p.vy *= -0.45; p.vx *= 0.7; p.vr *= 0.6; }
      const a = Math.max(0, Math.min(1, p.life/p.maxLife));
      ctx.save();
      ctx.globalAlpha = (p.alpha==null?1:p.alpha) * (p.fade===false?1:(a<0.35? a/0.35 : 1));
      ctx.translate(p.x, p.y); ctx.rotate(p.rot||0);
      if (p.type==='rect'){
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.r, -p.r*0.55, p.r*2, p.r*1.1);
      } else if (p.type==='spark'){
        ctx.strokeStyle = p.color; ctx.lineWidth = p.w||2; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(-p.r,0); ctx.lineTo(p.r,0); ctx.stroke();
      } else if (p.type==='ring'){
        ctx.strokeStyle = p.color; ctx.lineWidth = p.w||3;
        ctx.beginPath(); ctx.arc(0,0, p.r * (1.6 - a), 0, Math.PI*2); ctx.stroke();
      } else if (p.type==='text'){
        ctx.font = '800 ' + p.r + 'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 6;
        ctx.fillStyle = p.color;
        ctx.fillText(p.txt, 0, 0);
      } else if (p.type==='coin'){
        const g2 = ctx.createRadialGradient(-p.r*0.35, -p.r*0.35, p.r*0.15, 0, 0, p.r);
        g2.addColorStop(0,'#fff8d8'); g2.addColorStop(0.55,'#ffd75e'); g2.addColorStop(1,'#c9942a');
        ctx.fillStyle = g2;
        ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(120,82,20,.85)'; ctx.lineWidth = Math.max(1, p.r*0.16);
        ctx.stroke();
        ctx.fillStyle = 'rgba(146,103,26,.5)';
        ctx.beginPath(); ctx.arc(0,0,p.r*0.42,0,Math.PI*2); ctx.fill();
      } else if (p.type==='emoji'){
        ctx.font = p.r+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(p.char, 0, 0);
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }
    if (parts.length){ raf = requestAnimationFrame(loop); }
    else { running = false; ctx.clearRect(0,0,W,H); }
  }

  function pulseWallet(x, y){
    const chip = (coinTarget()||{closest:()=>null}).closest('.chip');
    if (!chip) return;
    chip.style.transition = 'none';
    chip.style.transform = 'scale(1.16)';
    requestAnimationFrame(()=>{ chip.style.transition = 'transform .32s cubic-bezier(.34,1.56,.64,1)'; chip.style.transform = 'scale(1)'; });
    spawn({ x, y, vx:0, vy:0, g:0, life:14, maxLife:14, r:16, color:'#ffd54f', type:'ring', w:3.5, rot:0 });
  }

  function point(el){
    if (!el || !el.getBoundingClientRect) return null;
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width/2, y: r.top + r.height/2, w: r.width, h: r.height };
  }

  function burst(x, y, opts={}){
    if (reduce) return;
    const n = opts.n || 18, spd = opts.speed || 5.5, colors = opts.colors || COLORS;
    const sz = opts.size || [2, 4.5];
    for (let i = 0; i < n; i++){
      const ang = (Math.PI*2*i)/n + rnd(-0.3,0.3), v = rnd(spd*0.45, spd);
      spawn({
        x, y, vx: Math.cos(ang)*v, vy: Math.sin(ang)*v - (opts.lift||0.8),
        g: opts.g==null?0.12:opts.g, life: rnd(26,42), maxLife: 40,
        r: rnd(sz[0], sz[1]),
        color: pick(colors), type: opts.type||'dot', rot: rnd(0,6.28), vr: rnd(-0.2,0.2),
        drag: 0.97
      });
    }
    if (opts.ring !== false){
      spawn({ x, y, vx:0, vy:0, g:0, life:16, maxLife:16, r: (opts.ringSize||18), color: opts.ringColor||'#ffe082', type:'ring', w:2.4, rot:0 });
    }
  }

  function coinTarget(){
    // Приоритет — кошелёк в шапке HUD, а не плавающий chip из модалки
    const hud = document.querySelector('#hud [data-coins]');
    if (hud){ const r = hud.getBoundingClientRect(); if (r.width>0) return hud; }
    const list = Array.from(document.querySelectorAll('[data-coins]'));
    return list.find(el=>{ const r = el.getBoundingClientRect(); return r.width>0 && r.height>0 && r.top < window.innerHeight*0.5; }) || list[0] || null;
  }

  function coin(fromEl, toEl){
    toEl = toEl || coinTarget();
    if (reduce || !fromEl || !toEl) return;
    const a = point(fromEl), b = point(toEl);
    if (!a || !b) return;
    spawn({ x:a.x, y:a.y, vx: rnd(-1.5,1.5), vy: -rnd(5,7.5), g:0.32, life:36, maxLife:36,
      r: 10, color:'#ffd54f', type:'coin', rot:0, vr:0.1, drag:0.99,
      _tx:b.x, _ty:b.y, homing:true });
    // маленький след искр
    burst(a.x, a.y, { n:6, speed:3, colors:['#ffe082','#fff59d'], type:'spark', ring:false, size:[4,8] });
  }

  function confetti(originEl){
    if (reduce) return;
    const p = originEl ? point(originEl) : { x: W/2, y: H*0.35 };
    for (let i = 0; i < 70; i++){
      spawn({
        x: p.x + rnd(-40,40), y: p.y + rnd(-10,10),
        vx: rnd(-7,7), vy: rnd(-13,-4), g: 0.28,
        life: rnd(60,110), maxLife: 100,
        r: rnd(3,6.5), color: pick(COLORS), type:'rect',
        rot: rnd(0,6.28), vr: rnd(-0.3,0.3), drag:0.99
      });
    }
  }

  function floatText(x, y, text, color='#ffe082'){
    if (reduce) return;
    spawn({ x, y, vx: rnd(-0.25,0.25), vy: -1.5, g: 0.012, life: 54, maxLife: 54,
      r: 17, color, type: 'text', txt: text, rot:0, drag:1, fade:true, alpha:1 });
  }

  function pop(el, char='✨', n=8){
    if (reduce) return;
    const p = point(el); if (!p) return;
    for (let i=0;i<n;i++) spawn({
      x:p.x+rnd(-p.w/2,p.w/2), y:p.y+rnd(-p.h/2,p.h/2),
      vx:rnd(-2.2,2.2), vy:-rnd(2,5), g:0.06, life:rnd(22,34), maxLife:30,
      r:rnd(12,20), color:'#fff', type:'emoji', char, rot:0, vr:rnd(-0.08,0.08), drag:0.96
    });
  }

  function shake(){
    if (reduce) return;
    const app = document.getElementById('app');
    if (!app) return;
    app.classList.remove('shake');
    void app.offsetWidth;
    app.classList.add('shake');
    setTimeout(()=>app.classList.remove('shake'), 380);
  }

  function weather(){
    try { return (typeof weatherInfo==='function' && weatherInfo().id === 'rain') ? 'rainy' : 'sunny'; } catch(e){ return 'sunny'; }
  }

  let ambSpawned = 0;
  function spawnAmbient(){
    if (reduce || document.hidden) return;
    if (ambSpawned > 46) return;
    const rainy = weather()==='rainy';
    if (rainy){
      for (let i=0;i<7;i++){ ambSpawned++;
        spawn({ x: rnd(-30,W+30), y:-12, vx:-1.1, vy: rnd(12,17), g:0.05, life: 74, maxLife:74, r: rnd(8,15), w:1.5, color:'#9fd0ea', type:'spark', rot:1.35, fade:false, alpha:.55, drag:1, amb:true }); }
    } else if (Math.random() < 0.5){
      ambSpawned++;
      spawn({ x: rnd(20,W-20), y: H*rnd(0.15,0.9), vx:rnd(-0.15,0.15), vy:-0.08, g:0, life: rnd(90,150), maxLife:120, r: rnd(1.4,2.6), color: pick(['#e8f5c8','#ffffff']), type:'dot', rot:0, fade:false, alpha:.7, drag:1, amb:true });
    } else if (Math.random() < 0.55){
      ambSpawned++;
      spawn({ x: rnd(-24,W+24), y: rnd(H*0.28,H*0.82), vx: rnd(0.3,0.8), vy: rnd(-0.45,-0.12), g:0, life: 320, maxLife:320, r:14, type:'emoji', char:pick(['🦋','🍃','🌾','🐝']), rot:0, vr:0.02, fade:false, alpha:.42, drag:1, amb:true });
    } else {
      ambSpawned++;
      spawn({ x: rnd(-70,W*0.5), y: rnd(H*0.12,H*0.34), vx: rnd(0.9,1.7), vy: 0, g:0, life: 420, maxLife:420, r:13, type:'emoji', char:'🕊️', rot:0, vr:0.03, fade:false, alpha:.36, drag:1, amb:true });
    }
  }
  setInterval(spawnAmbient, 300);

  function ambientUpdate(){}

  return { burst, coin, coinTarget, confetti, shake, pop, point, floatText, ambientUpdate,
    setWeather(r){ const a=document.getElementById('ambient'); if(a) a.classList.toggle('rainy', !!r); } };
})();

/* ---------------- 2.5D ПАРАЛЛАКС (гироскоп + скролл) ---------------- */
function installDepthParallax(){
  if (window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) return;
  const ambient = document.getElementById('ambient');
  if (!ambient) return;
  const layers = {
    hills: ambient.querySelector('.amb-hills'),
    sun: ambient.querySelector('.amb-sun'),
    clouds: Array.from(ambient.querySelectorAll('.amb-cloud')),
    stars: ambient.querySelector('.amb-stars'),
  };
  let tx = 0, ty = 0, cx = 0, cy = 0, raf = 0;

  const apply = () => {
    raf = 0;
    cx += (tx - cx) * 0.12; cy += (ty - cy) * 0.12;
    if (Math.abs(tx-cx) < 0.002 && Math.abs(ty-cy) < 0.002){ cx = tx; cy = ty; }
    if (layers.hills) layers.hills.style.setProperty('--px', (cx*26).toFixed(2)+'px');
    if (layers.sun)   layers.sun.style.transform = `translate(${(cx*-18).toFixed(2)}px, ${(cy*-14).toFixed(2)}px)`;
    layers.clouds.forEach((c,i)=>{
      c.style.setProperty('--px', (cx*(12 + i*8)).toFixed(2)+'px');
      c.style.setProperty('--py', (cy*(8 + i*4)).toFixed(2)+'px');
    });
    if (layers.stars) layers.stars.style.setProperty('--px', (cx*-8).toFixed(2)+'px');
    if (raf || Math.abs(tx-cx) > 0.002 || Math.abs(ty-cy) > 0.002) raf = raf || requestAnimationFrame(apply);
  };
  const kick = () => { if (!raf) raf = requestAnimationFrame(apply); };

  // гироскоп (мобильные)
  const onOrient = e => {
    if (e.gamma == null || e.beta == null) return;
    tx = clamp(e.gamma / 35, -1, 1);
    ty = clamp((e.beta - 45) / 45, -1, 1);
    kick();
  };
  window.addEventListener('deviceorientation', onOrient, { passive:true });

  // указатель (десктоп / превью)
  window.addEventListener('pointermove', e => {
    tx = clamp((e.clientX / window.innerWidth - 0.5) * 2, -1, 1);
    ty = clamp((e.clientY / window.innerHeight - 0.5) * 2, -1, 1);
    kick();
  }, { passive:true });
}

/* ---------------- PARALLAX ---------------- */
function installParallax(){
  const screen = document.getElementById('screen');
  const clouds = Array.from(document.querySelectorAll('#ambient .amb-cloud'));
  const hills = document.querySelector('#ambient .amb-hills');
  const stars = document.querySelector('#ambient .amb-stars');
  if (!screen) return;
  let raf = 0, last = -1;
  const apply = () => {
    raf = 0;
    const y = screen.scrollTop || 0;
    if (Math.abs(y-last) < 0.5) return;
    last = y;
    const k = Math.max(-60, Math.min(140, y));
    if (hills) hills.style.transform = `translateY(${(k*0.10).toFixed(1)}px)`;
    clouds.forEach((c,i)=>{ c.style.marginTop = (k*(0.03 + i*0.015)).toFixed(1)+'px'; });
    if (stars) stars.style.transform = `translateY(${(k*-0.02).toFixed(1)}px)`;
  };
  screen.addEventListener('scroll', ()=>{ if (!raf) raf = requestAnimationFrame(apply); }, { passive:true });

/* ---------------- TAP RIPPLE ---------------- */
function installRipple(){
  document.addEventListener('pointerdown', e=>{
    const t = e.target.closest('button,.btn,.tab-btn,.field-tile,.pick-card,.action-btn,.chip');
    if (!t) return;
    try {
      const r = t.getBoundingClientRect();
      const size = Math.max(r.width, r.height) * 1.15;
      const d = document.createElement('span');
      d.className = 'tap-ripple';
      d.style.width = d.style.height = size + 'px';
      d.style.left = (e.clientX - size/2) + 'px';
      d.style.top = (e.clientY - size/2) + 'px';
      document.body.appendChild(d);
      setTimeout(()=>d.remove(), 520);
    } catch(err){}
  }, { passive:true });
}

/* ---------------- INIT ---------------- */
function init(){
  window.addEventListener('beforeinstallprompt', event=>{
    event.preventDefault();
    deferredInstallPrompt=event;
  });
  window.addEventListener('appinstalled',()=>{
    deferredInstallPrompt=null;
    toast('Островная ферма установлена','good','check');
  });
  const saved = load();
  if (saved){
    S = saved;
    if(!S.loginReward) S.loginReward={lastClaim:'',streak:0};
    applySettings();
    genBoardIfNeeded();
    refreshMarket(false);
    renderAll();
    applyOffline();
    if (!S.tutorial.done) tutShow();
  } else {
    renderStart();
  }
  setInterval(tick, 1000);
  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', ()=>{ if (document.hidden) save(); });
  window.addEventListener('resize', positionCoach);
  installSwipeGestures();
  installRipple();
  installParallax();
  installDepthParallax();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(window.__farmSwRefresh) return;
      window.__farmSwRefresh=true;
      location.reload();
    });
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});
  }
}
function genBoardIfNeeded(){
  if (!S.board || !S.board.length || Date.now()-S.boardAt > durMs(900)) genBoard();

function RET_migrate(){

/* ---------------- БАЗОВЫЕ ХЕЛПЕРЫ ---------------- */
function RET_today(){ return todayStr(); }
function RET_has(objId){ return !!S?.ret?.ach?.claimed?.includes(objId); }

/* Универсальный счётчик прогресса: quests + pass XP + achievements */
function RET_track(kind, amount){
  if (!S || !S.ret || amount <= 0) return;
  const R = S.ret;
  // ---- ежедневные задания
  if (R.daily.date === RET_today()){
    for (const q of (R.daily.ids||[])){
      const def = DAILY_QUESTS.find(d=>d.id===q);
      if (!def) continue;
      const tier = R.daily.tier?.[q] ?? 0;
      if ((R.daily.prog[q]||0) >= def.targets[tier]) continue;
      const map = { sell:'sellCoins' };
      const wantKind = map[def.id] || def.id;
      if (wantKind !== kind) continue;
      R.daily.prog[q] = Math.min(def.targets[tier], (R.daily.prog[q]||0) + amount);
      if (R.daily.prog[q] >= def.targets[tier]) {
        toast('Задание дня готово!', 'good', 'target');
        sfx.good(); buzz(35);
      }
    }
  }
  // ---- пропуск
  R.pass.xp = (R.pass.xp||0) + amount;

  // ---- достижения по статистике
  RET_checkAchievements();
}

function RET_checkAchievements(){
  const R = S.ret; if (!R) return;
  const statVal = {
    harvests: S.stats.harvests||0,
    earned: S.stats.earned||0,
    contractsDone: S.stats.contractsDone||0,
    aged: S.stats.aged||0,
    buildings: Object.values(S.buildings).filter(b=>b.owned).length,
    bestStreak: R.streak?.best||0,
  };
  for (const a of ACHIEVEMENTS){
    if (R.ach.unlocked.includes(a.id)) continue;
    if ((statVal[a.stat]||0) >= a.need){
      R.ach.unlocked.push(a.id);
      const rw = [];
      if (a.reward.coins){ addCoins(a.reward.coins); rw.push(`+${fmt(a.reward.coins)} монет`); }
      if (a.reward.gems){ S.gems += a.reward.gems; rw.push(`+${a.reward.gems} ${gemWord(a.reward.gems)}`); }
      R.ach.claimed.push(a.id);
      setTimeout(()=>{
        toast(`Достижение: ${a.name} · ${rw.join(', ')}`, 'good', a.icon);
        FX.confetti(); sfx.good();
      }, 400);
    }
  }
}

/* ---------------- ЕЖЕДНЕВНЫЕ ЗАДАНИЯ ---------------- */
function RET_rollDaily(){
  const R = S.ret;
  const today = RET_today();
  if (R.daily.date === today && R.daily.ids?.length) return;
  const pool = DAILY_QUESTS.filter(q=>q.id!=='age' || (S.level>=3));
  const picked = [];
  const shuffled = [...pool].sort(()=>Math.random()-0.5);
  for (const q of shuffled){ if (picked.length<3) picked.push(q.id); }
  R.daily = {
    date: today, ids: picked, prog:{}, claimed:{},
    tier: Object.fromEntries(picked.map(id=>[id, Math.min(2, Math.floor(S.level/6))])),
  };
}

function RET_questState(qid){
  const R = S.ret, def = DAILY_QUESTS.find(d=>d.id===qid);
  if (!def) return null;
  const tier = R.daily.tier?.[qid] ?? 0;
  const target = def.targets[tier];
  const prog = Math.min(target, R.daily.prog?.[qid] || 0);
  return { def, tier, target, prog, done: prog>=target, claimed: !!R.daily.claimed?.[qid] };
}

function RET_claimQuest(qid){
  if (!S?.ret?.daily) return;
  const st = RET_questState(qid);
  if (!st){ toast('Задание недоступно', 'bad', 'info'); return; }
  if (!st.done){ toast('Задание ещё не выполнено', '', 'clock'); return; }
  if (st.claimed) return;
  const R = S.ret;
  R.daily.claimed[qid] = true;
  const rw = st.def.reward;
  const coins = rw.coins[st.tier] ?? rw.coins[0];
  const gems = (rw.gems?.[st.tier]) || 0;
  addCoins(coins);
  if (gems) S.gems += gems;
  RET_track('_noop', 30); // XP за задание
  toast(`Задание: +${fmt(coins)} монет${gems?`, +${gems} ${gemWord(gems)}`:''}`, 'good', 'gift');
  sfx.coin(); buzz(40); FX.confetti();
  save(); renderAll();
}
