<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#111914"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Островная ферма — мобильный фермерский симулятор</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icon-192.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-title" content="Ферма"/>
<style>
/* ============================================================
   DESIGN SYSTEM — «Островная ферма» v2
   ============================================================ */
:root{
  --green-900:#1b5e20; --green-800:#2e7d32; --green-700:#388e3c;
  --green-600:#43a047; --green-500:#66bb6a; --green-400:#81c784;
  --green-300:#a5d6a7; --green-200:#c8e6c9; --green-100:#e8f5e9;
  --gold-600:#f57f17; --gold-500:#ffb300; --gold-400:#ffca28; --gold-300:#ffd54f;
  --earth-700:#5d4037; --earth-600:#6d4c41; --earth-500:#8d6e63; --earth-400:#a1887f; --earth-300:#bcaaa4;
  --sky-600:#1e88e5; --sky-500:#42a5f5; --sky-400:#64b5f6; --sky-300:#90caf9; --sky-100:#e3f2fd;
  --ink:#263238; --ink-2:#455a64; --muted:#78909c; --red:#ef5350; --red-d:#c62828;
  --radius:18px; --tap:48px;
  --shadow-sm:0 2px 8px rgba(27,94,32,.14);
  --shadow-md:0 8px 24px rgba(27,94,32,.18);
  --shadow-lg:0 18px 44px rgba(27,94,32,.28);
  --glass:rgba(255,255,255,.92);
  --glass-brd:rgba(255,255,255,.75);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink); overflow:hidden; touch-action:manipulation;
  background:#17251f;
  background-size:340px 340px;
}
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;}
#screen{flex:1;overflow-y:auto;padding:12px 12px 20px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;position:relative;z-index:1;}
#screen::-webkit-scrollbar{width:4px}
#screen::-webkit-scrollbar-thumb{background:rgba(27,94,32,.35);border-radius:4px}

/* ---------- Icons ---------- */
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none;width:20px;height:20px;vertical-align:-4px;}
.ic svg{width:100%;height:100%;display:block;}
.ic-lg{width:28px;height:28px;}
.ic-xl{width:40px;height:40px;}

/* ---------- HUD ---------- */
#hud{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;z-index:5;position:relative;}
.chip{display:flex;align-items:center;gap:5px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--glass-brd);border-radius:999px;padding:5px 11px;font-weight:800;font-size:14px;
  box-shadow:var(--shadow-sm);min-height:34px;white-space:nowrap;color:var(--ink);}
.chip small{font-weight:700;color:var(--muted);font-size:11px;}
.chip .ic{width:18px;height:18px;}
.hud-btn{margin-left:auto;display:flex;gap:6px;}
.icon-btn{width:42px;height:42px;border:1px solid var(--glass-brd);border-radius:13px;background:var(--glass);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow-sm);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .08s;}
.icon-btn:active{transform:scale(.92);}
.icon-btn .ic{width:22px;height:22px;}
.xpbar{flex-basis:100%;height:7px;background:rgba(255,255,255,.55);border-radius:99px;overflow:hidden;margin-top:3px;
  box-shadow:inset 0 1px 3px rgba(27,94,32,.25);}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-600),var(--gold-400),var(--gold-300));
  border-radius:99px;transition:width .4s;box-shadow:0 0 8px rgba(255,179,0,.7);}

/* ---------- Tabs ---------- */
#tabs{display:flex;gap:6px;z-index:5;position:relative;
  margin:0 10px calc(env(safe-area-inset-bottom) + 10px);padding:6px;
  background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--glass-brd);border-radius:22px;box-shadow:var(--shadow-md);}
.tab-btn{flex:1;border:none;background:transparent;border-radius:16px;padding:7px 4px 5px;font-size:11px;font-weight:800;
  color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative;
  min-height:58px;justify-content:center;transition:all .15s;font-family:inherit;}
.tab-btn .ic{width:26px;height:26px;opacity:.75;}
.tab-btn.active{background:linear-gradient(180deg,var(--green-500),var(--green-600));color:#fff;
  box-shadow:0 4px 12px rgba(67,160,71,.45),inset 0 1px 0 rgba(255,255,255,.35);}
.tab-btn.active .ic{opacity:1;}
.tab-btn:active{transform:scale(.95);}
.tab-badge{position:absolute;top:3px;right:calc(50% - 24px);background:var(--red);color:#fff;font-size:11px;font-weight:800;
  min-width:20px;height:20px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 5px;
  border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);animation:badgePop .3s;}

/* ---------- Buttons (3D game style) ---------- */
.btn{border:none;border-radius:14px;min-height:var(--tap);padding:10px 16px;font-size:15px;font-weight:800;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;position:relative;overflow:hidden;
  transition:transform .08s,box-shadow .08s,filter .15s;}
.btn .ic{width:20px;height:20px;}
.btn:active{transform:translateY(2px);}
.btn-primary{background:linear-gradient(180deg,var(--green-500),var(--green-600));color:#fff;
  box-shadow:0 4px 0 var(--green-800),0 8px 16px rgba(46,125,50,.35),inset 0 1px 0 rgba(255,255,255,.4);}
.btn-primary:active{box-shadow:0 2px 0 var(--green-800),0 4px 8px rgba(46,125,50,.35),inset 0 1px 0 rgba(255,255,255,.4);}
.btn-gold{background:linear-gradient(180deg,var(--gold-300),var(--gold-500));color:#5d4037;
  box-shadow:0 4px 0 var(--gold-600),0 8px 16px rgba(245,127,23,.35),inset 0 1px 0 rgba(255,255,255,.55);}
.btn-gold:active{box-shadow:0 2px 0 var(--gold-600),0 4px 8px rgba(245,127,23,.35),inset 0 1px 0 rgba(255,255,255,.55);}
.btn-blue{background:linear-gradient(180deg,var(--sky-400),var(--sky-600));color:#fff;
  box-shadow:0 4px 0 #1565c0,0 8px 16px rgba(30,136,229,.35),inset 0 1px 0 rgba(255,255,255,.4);}
.btn-blue:active{box-shadow:0 2px 0 #1565c0,0 4px 8px rgba(30,136,229,.35),inset 0 1px 0 rgba(255,255,255,.4);}
.btn-ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 #cfd8dc,0 6px 12px rgba(38,50,56,.12),inset 0 1px 0 #fff;}
.btn-ghost:active{box-shadow:0 1px 0 #cfd8dc,0 3px 6px rgba(38,50,56,.12),inset 0 1px 0 #fff;}
.btn-danger{background:linear-gradient(180deg,#ef5350,#e53935);color:#fff;
  box-shadow:0 4px 0 #b71c1c,0 8px 16px rgba(198,40,40,.3),inset 0 1px 0 rgba(255,255,255,.35);}
.btn-danger:active{box-shadow:0 2px 0 #b71c1c,0 4px 8px rgba(198,40,40,.3),inset 0 1px 0 rgba(255,255,255,.35);}
.btn:disabled{opacity:.5;filter:grayscale(.4);box-shadow:0 2px 0 rgba(0,0,0,.15);}
.btn-block{width:100%;}
.btn-sm{min-height:40px;font-size:13px;padding:6px 12px;border-radius:11px;}
.btn-shine::after{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);
  animation:shine 3.2s ease-in-out infinite;}
@keyframes shine{0%,55%{left:-80%}85%,100%{left:160%}}

/* ---------- Cards ---------- */
.card{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--glass-brd);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:13px;margin-bottom:12px;
  animation:fadeUp .35s both;}
.card h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:7px;font-weight:800;}
.card h3 .ic{width:22px;height:22px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.row{display:flex;align-items:center;gap:8px;}
.row.between{justify-content:space-between;}
.muted{color:var(--muted);font-size:13px;}
.small{font-size:12px;}
.bar{height:10px;background:rgba(38,50,56,.1);border-radius:99px;overflow:hidden;flex:1;box-shadow:inset 0 1px 3px rgba(0,0,0,.12);}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green-600),var(--green-400));transition:width .5s linear;}
.bar.blue>i{background:linear-gradient(90deg,var(--sky-600),var(--sky-300));}
.bar.red>i{background:linear-gradient(90deg,var(--red-d),#ff8a80);}
.bar.gold>i{background:linear-gradient(90deg,var(--gold-600),var(--gold-300));}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--green-100);border:1px solid var(--green-300);
  color:var(--green-800);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800;}
.pill.warn{background:#fff8e1;border-color:#ffe082;color:#f57f17;}
.pill.bad{background:#ffebee;border-color:#ef9a9a;color:#c62828;}
.pill .ic{width:13px;height:13px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.section-title{font-size:16px;font-weight:900;margin:16px 2px 9px;display:flex;align-items:center;gap:7px;color:#fff;
  text-shadow:0 2px 6px rgba(27,94,32,.55);}
.section-title .ic{width:22px;height:22px;filter:drop-shadow(0 2px 3px rgba(27,94,32,.5));}
.section-title .spacer{flex:1;}
.divider{height:1px;background:rgba(38,50,56,.08);margin:10px 0;}

/* ---------- Field tiles (SVG) ---------- */
.field-tile{position:relative;border-radius:20px;cursor:pointer;user-select:none;
  filter:drop-shadow(0 8px 14px rgba(27,94,32,.35));transition:transform .12s;}
.field-tile:active{transform:scale(.96);}
.field-tile svg.tile-svg{width:100%;height:auto;display:block;}
.field-tile.ready-glow{animation:readyGlow 1.4s ease-in-out infinite;}
@keyframes readyGlow{0%,100%{filter:drop-shadow(0 8px 14px rgba(27,94,32,.35)) drop-shadow(0 0 0 rgba(255,193,7,0))}
  50%{filter:drop-shadow(0 8px 14px rgba(27,94,32,.35)) drop-shadow(0 0 14px rgba(255,193,7,.95))}}
.tile-label{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;
  background:rgba(27,42,27,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:5px 9px;color:#fff;}
.tile-label .fname{font-weight:800;font-size:13px;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.4);}
.tile-label .fstate{font-size:11px;font-weight:700;opacity:.9;line-height:1.2;}
.tile-label .pbar{height:6px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin-top:4px;}
.tile-label .pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-400),var(--gold-300));border-radius:99px;}
.tile-label .ftimer{font-size:10px;font-weight:800;margin-top:2px;opacity:.95;}
.tile-badges{position:absolute;top:7px;right:7px;display:flex;gap:4px;z-index:4;}
.tile-badge{width:26px;height:26px;border-radius:9px;background:rgba(255,255,255,.92);box-shadow:0 2px 6px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;animation:badgePop .3s;}
.tile-badge .ic{width:16px;height:16px;}
.tile-badge.alert{background:#ffecb3;animation:badgePop .3s,wiggle 1.6s ease-in-out infinite;}
@keyframes badgePop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}

/* SVG tile animations */
.plant-sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.4s ease-in-out infinite alternate;}
@keyframes sway{from{transform:rotate(-2.4deg)}to{transform:rotate(2.4deg)}}
.tractor-drive{animation:drive 5s ease-in-out infinite;}
@keyframes drive{0%{transform:translate(0,0)}48%{transform:translate(118px,-34px)}52%{transform:translate(118px,-34px)}100%{transform:translate(0,0)}}
.wheel-spin{transform-box:fill-box;transform-origin:center;animation:spin .55s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.dust{animation:dustPuff 1.6s ease-out infinite;}
@keyframes dustPuff{0%{opacity:.55;transform:scale(.5)}100%{opacity:0;transform:scale(1.6) translateY(-4px)}}
.sparkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.5s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.5) rotate(0deg)}50%{opacity:1;transform:scale(1.15) rotate(45deg)}}
.cloud-drift{animation:drift 26s linear infinite;}
@keyframes drift{from{transform:translateX(-70px)}to{transform:translateX(330px)}}
.sun-rays{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite;}

/* ---------- Modal / sheet ---------- */
.backdrop{position:fixed;inset:0;background:rgba(20,35,20,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s;}
.backdrop.center{align-items:center;padding:20px;}
.sheet{background:#fff;width:100%;max-width:520px;max-height:88dvh;overflow-y:auto;border-radius:24px 24px 0 0;
  padding:14px 16px calc(env(safe-area-inset-bottom) + 16px);animation:slideUp .24s cubic-bezier(.2,.9,.3,1.1);}
.dialog{background:#fff;width:100%;max-width:440px;border-radius:22px;padding:18px;animation:popIn .22s cubic-bezier(.2,.9,.3,1.15);
  max-height:88dvh;overflow-y:auto;box-shadow:var(--shadow-lg);}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet h2,.dialog h2{margin:0 0 4px;font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px;}
.sheet h2 .ic,.dialog h2 .ic{width:26px;height:26px;}
.grab{width:46px;height:5px;border-radius:99px;background:#cfd8dc;margin:0 auto 12px;}
.action-list{display:flex;flex-direction:column;gap:9px;margin-top:10px;}
.crop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
.crop-pick{border:2px solid #eceff1;background:#fff;border-radius:14px;padding:8px 3px;text-align:center;cursor:pointer;
  font-size:11px;font-weight:700;font-family:inherit;transition:all .12s;}
.crop-pick .plant-ic{width:44px;height:44px;margin:0 auto 2px;}
.crop-pick .plant-ic svg{width:100%;height:100%;}
.crop-pick:active{transform:scale(.94);border-color:var(--green-500);background:var(--green-100);}
.crop-pick:disabled{opacity:.4;}

/* ---------- Toast ---------- */
#toast-root{position:fixed;top:calc(env(safe-area-inset-top) + 66px);left:50%;transform:translateX(-50%);z-index:100;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,480px);}
.toast{background:rgba(27,42,27,.94);color:#fff;border-radius:14px;padding:10px 16px;font-size:14px;font-weight:700;
  box-shadow:0 8px 22px rgba(0,0,0,.35);animation:toastIn .25s;text-align:center;max-width:100%;
  display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.18);}
.toast.good{background:rgba(27,94,32,.96);}
.toast.bad{background:rgba(183,28,28,.96);}
@keyframes toastIn{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}

/* ---------- Coach (tutorial) ---------- */
#coach-root{position:fixed;inset:0;z-index:90;pointer-events:none;}
.coach-bubble{position:absolute;left:12px;right:12px;background:#fff;border-radius:18px;box-shadow:0 12px 34px rgba(0,0,0,.35);
  padding:14px;pointer-events:auto;animation:popIn .25s;border:2px solid var(--gold-400);}
.coach-bubble .txt{font-size:16px;font-weight:800;line-height:1.35;}
.coach-arrow{position:absolute;width:0;height:0;border:12px solid transparent;filter:drop-shadow(0 3px 3px rgba(0,0,0,.2));}
.tut-glow{outline:4px solid var(--gold-400)!important;outline-offset:2px;animation:readyGlow 1.2s infinite;border-radius:20px;}

/* ---------- Mini-game ---------- */
.mg-wrap{text-align:center;}
.mg-bar{position:relative;height:46px;background:#eceff1;border-radius:13px;overflow:hidden;margin:14px 0;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.15);}
.mg-zone{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,var(--green-400),var(--green-600));
  border-left:2px solid var(--green-800);border-right:2px solid var(--green-800);}
.mg-marker{position:absolute;top:-2px;bottom:-2px;width:7px;background:#e53935;border-radius:4px;box-shadow:0 0 10px rgba(0,0,0,.5);}

/* ---------- Start screen ---------- */
.start-wrap{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:calc(env(safe-area-inset-top) + 18px) 16px 20px;text-align:center;overflow:hidden;}
.start-hero{position:absolute;inset:0;background:var(--island-art) center 44%/cover no-repeat;z-index:0;}
.start-hero::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(27,94,32,.05) 0%,rgba(27,94,32,0) 30%,rgba(27,94,32,.55) 72%,rgba(27,94,32,.85) 100%);}
.start-content{position:relative;z-index:1;width:100%;display:flex;flex-direction:column;align-items:center;margin-top:38dvh;}
.start-title{font-size:34px;font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(27,94,32,.45),0 6px 18px rgba(0,0,0,.4);margin:0;letter-spacing:.5px;}
.start-sub{color:#e8f5e9;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.55);margin:4px 0 16px;font-size:14px;line-height:1.4;}
.pick-card{background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-radius:16px;padding:11px 13px;margin-bottom:9px;width:100%;
  max-width:420px;text-align:left;cursor:pointer;border:3px solid transparent;box-shadow:var(--shadow-md);
  display:flex;gap:10px;align-items:center;transition:all .12s;}
.pick-card:active{transform:scale(.98);}
.pick-card.sel{border-color:var(--gold-400);background:#fffde7;box-shadow:0 0 0 2px rgba(255,193,7,.35),var(--shadow-md);}
.pick-card .pic{width:46px;height:46px;flex:none;}
.pick-card .pic svg{width:100%;height:100%;}
.pick-card .t{font-weight:900;font-size:16px;}
.pick-card .d{font-size:12px;color:var(--muted);margin-top:1px;line-height:1.35;}
.pick-label{width:100%;max-width:420px;text-align:left;font-weight:900;color:#fff;margin:10px 0 6px;
  text-shadow:0 2px 5px rgba(0,0,0,.5);font-size:14px;}
.pick-row{display:flex;gap:8px;width:100%;max-width:420px;}
.pick-row .pick-card{flex:1;flex-direction:column;text-align:center;margin-bottom:0;padding:10px 6px;}
.pick-row .pick-card .pic{width:38px;height:38px;}

/* ---------- Misc ---------- */
.float-coin{position:fixed;z-index:120;font-size:24px;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));}
.contract-card{border-left:6px solid var(--green-500);}
.contract-card.done{border-left-color:var(--gold-500);background:#fffde7;}
.machine-card .stat{font-size:11px;color:var(--muted);font-weight:700;}
.care-row{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;flex:1;}
.care-row .bar{height:8px;}
.care-row .ic{width:16px;height:16px;}
.big-emoji{font-size:44px;}
.goods-row{display:flex;align-items:center;gap:9px;padding:4px 0;}
.goods-row .ic{width:24px;height:24px;}
.goods-row .gname{font-weight:700;font-size:14px;}
.toggle{position:relative;width:52px;height:30px;background:#cfd8dc;border-radius:99px;cursor:pointer;transition:background .2s;flex:none;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.15);}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;background:#fff;border-radius:50%;
  box-shadow:0 2px 5px rgba(0,0,0,.3);transition:left .2s;}
.toggle.on{background:var(--green-600);}
.toggle.on::after{left:25px;}
.seg{display:flex;background:#eceff1;border-radius:12px;padding:3px;gap:3px;}
.seg button{flex:1;border:none;background:transparent;border-radius:9px;padding:8px 4px;font-weight:800;font-size:13px;cursor:pointer;
  color:var(--muted);font-family:inherit;}
.seg button.on{background:#fff;color:var(--green-800);box-shadow:0 2px 6px rgba(0,0,0,.12);}
body.cb .bar>i{background:repeating-linear-gradient(45deg,var(--green-600) 0 8px,var(--green-400) 8px 16px);}
body.cb .xpbar>i{background:repeating-linear-gradient(45deg,var(--gold-600) 0 8px,var(--gold-400) 8px 16px);}

html,body{background:#17251f;}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#17251f;color:var(--ink);}
#app{max-width:560px;background:#f2f3ed;box-shadow:0 0 48px rgba(0,0,0,.25);}
#hud{background:#20352b;padding:calc(env(safe-area-inset-top) + 10px) 14px 11px;gap:7px;}
.chip{background:rgba(255,255,255,.09);color:#f5f3e9;border:1px solid rgba(255,255,255,.12);box-shadow:none;border-radius:10px;padding:5px 9px;font-size:13px;backdrop-filter:none;}
.chip small{color:#c1cbbf;}
.hud-btn{gap:7px;}
.icon-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);box-shadow:none;border-radius:11px;}
.icon-btn .ic{filter:brightness(1.35);}
.xpbar{height:3px;background:rgba(255,255,255,.17);box-shadow:none;margin-top:1px;}
.xpbar>i{background:#cfaa70;box-shadow:none;}
#screen{padding:14px 14px 22px;background:#f2f3ed;scrollbar-color:#c7cec3 transparent;}
#screen::-webkit-scrollbar-thumb{background:#c7cec3;}
#tabs{margin:0;padding:5px 12px calc(env(safe-area-inset-bottom) + 5px);border-radius:0;background:#fbfcf8;border:0;border-top:1px solid #e4e8e0;box-shadow:0 -4px 16px rgba(34,48,39,.06);gap:2px;backdrop-filter:none;}
.tab-btn{min-height:54px;border-radius:12px;font-size:11px;font-weight:650;color:#758078;gap:3px;}
.tab-btn .ic{width:22px;height:22px;opacity:.75;filter:grayscale(.35);}
.tab-btn.active{color:#294b3a;background:#e8eee5;box-shadow:none;font-weight:800;}
.tab-btn.active .ic{filter:none;}
.tab-badge{background:#b56e4b;border:2px solid #fbfcf8;box-shadow:none;}
.btn{border-radius:10px;font-size:14px;font-weight:700;min-height:44px;box-shadow:none!important;transition:background .16s,transform .12s;}
.btn:active{transform:scale(.985);}
.btn-primary{background:#355a43;color:#fff;}
.btn-primary:hover{background:#294b3a;}
.btn-gold{background:#d7b67e;color:#30291e;}
.btn-blue{background:#537d83;color:white;}
.btn-ghost{background:#f5f6f2;color:#344139;border:1px solid #dfe4dc;}
.btn-danger{background:#a85545;color:white;}
.btn-shine::after{display:none;}
.card{background:#fff;border:1px solid #e6e9e2;border-radius:14px;box-shadow:0 2px 8px rgba(28,45,35,.045);padding:14px;margin-bottom:10px;backdrop-filter:none;animation:fadeUp .2s both;}
.card h3{font-size:15px;font-weight:750;}
.muted{color:#758078;}
.pill{background:#eef2eb;border:1px solid #e1e7dd;color:#47624e;border-radius:7px;font-weight:700;}
.pill.warn{background:#f6f0e3;border-color:#eee1c4;color:#997342;}
.pill.bad{background:#f6eae6;border-color:#efd5cb;color:#a85545;}
.section-title{color:#304538;text-shadow:none;font-size:15px;font-weight:750;margin:19px 2px 10px;}
.section-title .ic{filter:none;opacity:.78;}
.field-tile{filter:drop-shadow(0 3px 5px rgba(41,59,44,.13));transition:transform .15s;}
.field-tile:active{transform:scale(.985);}
.field-tile .cloud-drift{opacity:.3!important;}
.tile-label{left:8px;right:8px;bottom:8px;background:rgba(25,41,31,.82);border:1px solid rgba(255,255,255,.17);border-radius:9px;padding:7px 9px;backdrop-filter:blur(8px);}
.tile-label .fname{font-size:12px;letter-spacing:.01em;}
.tile-label .fstate{font-size:10px;color:#e4e8df;}
.tile-label .pbar{height:3px;margin-top:5px;}
.tile-badge{border-radius:8px;box-shadow:0 2px 6px rgba(18,30,22,.18);}
.field-tile.ready-glow{animation:readyGlow 2s ease-in-out infinite;}
@keyframes readyGlow{0%,100%{filter:drop-shadow(0 3px 5px rgba(41,59,44,.13))}50%{filter:drop-shadow(0 3px 7px rgba(178,136,73,.35))}}
.backdrop{background:rgba(17,29,23,.52);backdrop-filter:blur(5px);}
.sheet,.dialog{background:#fbfcf8;border:1px solid rgba(255,255,255,.65);box-shadow:0 18px 56px rgba(12,24,18,.25);}
.sheet h2,.dialog h2{font-weight:750;letter-spacing:-.02em;}
.grab{background:#d6ddd4;}
.crop-pick{border:1px solid #e3e8df;border-radius:11px;background:#fff;font-weight:650;color:#344139;}
.crop-pick:active{border-color:#789779;background:#f0f3ed;}
#toast-root{top:calc(env(safe-area-inset-top) + 78px);}
.toast{border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-weight:650;}
.coach-bubble{border:1px solid #e2d5b7;border-radius:14px;}
.farm-scene{position:relative;height:172px;border-radius:15px;overflow:hidden;margin:0 0 13px;background-image:linear-gradient(90deg,rgba(23,40,30,.70),rgba(23,40,30,.05) 78%),linear-gradient(0deg,rgba(20,35,26,.46),transparent 60%),var(--island-art);background-size:cover;background-position:center 50%;color:#fff;box-shadow:0 5px 15px rgba(31,51,41,.12);}
.scene-top{position:absolute;top:12px;left:13px;right:13px;display:flex;align-items:center;justify-content:space-between;}
.scene-kicker{font-size:9px;letter-spacing:.16em;font-weight:800;color:#f0eadc;}
.scene-weather{display:flex;align-items:center;gap:5px;background:rgba(27,42,31,.4);border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:4px 8px;font-size:10px;font-weight:650;backdrop-filter:blur(5px);}

.daily-focus{width:100%;border:1px solid #e4e8df;border-radius:13px;background:#fbfcf8;padding:10px 12px;margin:0 0 12px;display:flex;align-items:center;gap:10px;text-align:left;color:#304538;font:inherit;cursor:pointer;box-shadow:0 2px 8px rgba(28,45,35,.04);}

/* Compact navigation and sectioned layouts */
#tabs{margin:0;padding:5px 7px calc(env(safe-area-inset-bottom) + 5px);gap:3px;border-radius:0;}

.lock-tag{font-size:9px;color:#8b8171;}
.land-footnote,.business-hint{display:flex;align-items:center;gap:6px;color:#808b80;font-size:10px;margin:11px 2px 0;}
.land-footnote .ic,.business-hint .ic{width:14px;height:14px;}
.business-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.business-card{min-width:0;min-height:118px;padding:10px;background:#fff;border:1px solid #e5e9e2;border-radius:12px;box-shadow:0 2px 6px rgba(28,45,35,.04);display:flex;flex-direction:column;}
.business-card-head{display:flex;align-items:center;gap:8px;min-width:0;}

.mini-cta{border:0;border-radius:7px;background:#e9eee6;color:#355a43;font:700 10px system-ui;padding:6px 8px;white-space:nowrap;cursor:pointer;}

.care-strip{display:flex;gap:7px;margin:9px 0 5px;}
.care-mini{border:0;background:transparent;padding:0;flex:1;display:flex;align-items:center;gap:3px;cursor:pointer;}

.care-mini i{height:4px;flex:1;background:#e7ebe4;border-radius:6px;overflow:hidden;}
.care-mini i b{display:block;height:100%;background:#91a483;border-radius:6px;}
.warehouse-summary{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#fff;border:1px solid #e5e9e2;border-radius:12px;margin-bottom:10px;}

.goods-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.goods-item{min-width:0;min-height:66px;background:#fff;border:1px solid #e7ebe4;border-radius:10px;padding:8px;display:grid;grid-template-columns:22px 1fr;align-items:center;gap:4px;}
.goods-symbol{width:20px;height:20px;}.goods-symbol svg{width:100%;height:100%;filter:saturate(.55);}

.goods-item b{grid-column:2;font-size:11px;color:#33463a;}
.warehouse-actions{display:flex;gap:7px;margin-top:10px;}.warehouse-actions .btn{flex:1;min-height:39px;font-size:11px;padding:5px;}
.empty-state{min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:#fff;border:1px solid #e7ebe4;border-radius:13px;text-align:center;padding:22px;color:#708074;}
.empty-state>span .ic,.empty-state>span{width:30px;height:30px;color:#81917f;}.empty-state b{font-size:13px;color:#405548;}.empty-state small{font-size:10px;}.empty-state .mini-cta{margin-top:6px;}
.daily-compact{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #e4e8df;border-radius:11px;padding:8px 10px;margin-bottom:10px;}
.daily-compact>span{width:28px;height:28px;border-radius:8px;background:#edf1e9;color:#557e61;display:grid;place-items:center;}.daily-compact .ic{width:16px;height:16px;}
.daily-compact>div{display:flex;flex-direction:column;gap:2px;flex:1;}.daily-compact b{font-size:11px;}.daily-compact small{font-size:9px;color:#808b80;}.daily-compact>i{font-style:normal;font-size:10px;font-weight:800;color:#66806b;}
.daily-compact.done>span{background:#e5eee5;}
.task-tabs{margin-bottom:10px;}.task-tabs .biz-tab{font-size:10px;min-height:32px;}.task-tabs .biz-tab span{font-size:9px;opacity:.75;}
.task-list{display:flex;flex-direction:column;gap:7px;}
.contract-card,.board-card{display:flex;gap:9px;padding:10px;background:#fff;border:1px solid #e5e9e2;border-radius:12px;}
.contract-visual{width:37px;height:37px;display:grid;place-items:center;background:#edf1e9;border-radius:10px;flex:none;color:#55765c;}
.contract-visual .ic{width:24px;height:24px;}.contract-main{min-width:0;flex:1;}
.contract-main .row{gap:4px;}.contract-main .row>b{font-size:11px;color:#34483a;}.contract-main>small{display:block;color:#818c82;font-size:9px;margin-top:3px;}
.contract-reward{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;color:#8b714c;white-space:nowrap;}.contract-reward .ic{width:13px;height:13px;}
.contract-progress{display:flex;align-items:center;gap:6px;margin-top:7px;}.contract-progress .bar{height:4px;}.contract-progress>span,.cancel-link{font-size:9px;color:#7c877d;white-space:nowrap;}
.cancel-link{border:0;background:none;padding:2px;color:#9a6a5c;}
.contract-main .btn{min-height:32px;font-size:10px;margin-top:8px;}.contract-main .btn .ic{width:15px;height:15px;}
.board-link{margin-top:9px;min-height:40px;font-size:11px;}
.board-toolbar{display:flex;justify-content:space-between;align-items:center;color:#829084;font-size:10px;margin:0 2px 8px;}
.board-pages{display:flex;align-items:center;gap:8px;}.board-pages button{border:1px solid #e1e6dd;background:#fff;color:#42644b;border-radius:7px;width:26px;height:25px;font-size:17px;}.board-pages button:disabled{opacity:.35;}

.overview-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:0 0 9px;}
.overview-stat{background:#fff;border:1px solid #e4e8df;border-radius:11px;padding:8px 5px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:1px;color:#33473a;}

.priority-card{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #e4e8df;border-radius:12px;padding:10px;margin-bottom:9px;min-height:68px;}
.priority-icon{width:35px;height:35px;background:#edf1e9;color:#59745d;border-radius:10px;display:grid;place-items:center;flex:none;}.priority-icon .ic{width:19px;height:19px;}
.priority-copy{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}.priority-copy small{font-size:8px;letter-spacing:.12em;color:#929b91;font-weight:800;}.priority-copy b{font-size:12px;color:#33483a;}.priority-copy span{font-size:9px;color:#818c82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.overview-action .ic{width:18px;height:18px;color:#68806c;}
.overview-footer{display:flex;align-items:center;justify-content:space-between;color:#899489;font-size:9px;padding:10px 2px 0;}.overview-footer .ic{width:13px;height:13px;vertical-align:middle;}
.garage-shortcut{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid #e4e8df;border-radius:8px;padding:7px 9px;font:650 10px system-ui;color:#49624e;}

.rep-tag{display:flex;align-items:center;gap:4px;}.rep-tag .ic{width:14px;height:14px;}
.compact-scene{height:134px;margin-bottom:10px;}.compact-scene .scene-title{font-size:24px;}
@media(max-width:390px){.business-card{padding:8px;min-height:112px;}.business-grid{gap:6px;}.land-plot{height:90px;}.compact-scene{height:125px;}.page-heading h2{font-size:23px;}}


/* HUD is deliberately two-row: currency, actions and status never compete for width. */
#hud{display:block;padding:calc(env(safe-area-inset-top) + 8px) 13px 8px;background:#20352b;}
.hud-top{display:flex;align-items:center;gap:7px;min-height:35px;}
.hud-top .chip{min-height:33px;padding:4px 9px;gap:6px;font-size:13px;}
.hud-top .chip b{font-weight:750;}
.hud-top .chip .ic{width:16px;height:16px;}
.hud-btn{margin-left:auto;display:flex;gap:6px;}
.hud-top .icon-btn{width:34px;height:34px;border-radius:9px;}
.hud-top .icon-btn .ic{width:18px;height:18px;}
.hud-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 1px 4px;color:#d6dfd5;font-size:10px;min-width:0;}
.level-meta,.weather-meta{display:flex;align-items:center;gap:5px;white-space:nowrap;}
.level-meta{color:#d8dfd3;}.level-meta b{display:flex;align-items:center;gap:4px;font-weight:700;}.level-meta .ic{width:12px;height:12px;}
.level-meta i,.weather-meta i{width:1px;height:11px;background:rgba(230,238,227,.25);font-style:normal;}
.weather-meta{color:#c0cdc0;overflow:hidden;text-overflow:ellipsis;}.weather-meta .ic{width:13px;height:13px;flex:none;}
.xpbar{height:2px;margin:0;background:rgba(255,255,255,.15);box-shadow:none;}.xpbar>i{background:#cbb27e;box-shadow:none;}
.icon-btn .ic{filter:none;}
@media(max-width:340px){.weather-meta{font-size:9px;gap:3px}.hud-meta{font-size:9px}.hud-top .chip{padding-inline:7px;}}


.foreman-row{display:flex;align-items:center;gap:8px;padding:7px 9px;margin-top:8px;border:1px solid #e4e8df;background:#fff;border-radius:10px;min-height:43px;}

.foreman-copy{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px;}.foreman-copy b{font-size:10px;color:#3d5143;}.foreman-copy small{font-size:8px;color:#859087;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}


/* Final fit pass: prevent flex/grid text collisions on compact phones. */
#screen>*{min-width:0;}
.row>*{min-width:0;}
.tab-btn{min-width:0;}
.tab-btn>span:not(.ic):not(.tab-badge){max-width:100%;white-space:nowrap;font-size:10px;letter-spacing:-.01em;}

.district-heading>div{min-width:0;}.district-heading b,.district-heading small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}

.contract-reward{flex:none;}.contract-main>small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.business-card-foot>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.page-heading>div{min-width:0;}.page-heading h2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

 #screen{padding-left:9px;padding-right:9px;}

 .contract-visual{width:32px;height:32px;}

:root{--sim-bg:#151c18;--sim-panel:#202a24;--sim-panel-2:#26322b;--sim-border:#36453b;--sim-text:#edf1e9;--sim-muted:#a5b0a3;--sim-green:#89b36b;--sim-lime:#b0cf7a;--sim-amber:#d3a55d;}
body{background:#0f1512;color:var(--sim-text);}
#app{background:#18211c;box-shadow:0 18px 55px rgba(0,0,0,.4);}
#hud{background:#111914;border-bottom:1px solid #29352d;}
.chip{background:#222c25;border-color:#37443b;color:#edf1e9;}
.chip small{color:#bac4b8;}
.hud-meta{color:#c9d3c8;}
.level-meta,.weather-meta{color:#c9d3c8;}
.level-meta i,.weather-meta i{background:#59665b;}
.xpbar{background:#343e35;}
.xpbar>i{background:var(--sim-lime);}
#screen{background:#18211c;color:var(--sim-text);}
#tabs{background:#111914;border-top:1px solid #2c3930;box-shadow:0 -8px 20px rgba(0,0,0,.14);}
.tab-btn{color:#9ca89d;}
.tab-btn.active{background:#293a2c;color:#c8e4a0;box-shadow:inset 0 -2px 0 #9fca6d;}
.tab-btn .ic{color:inherit;}
.card,.daily-focus,.overview-stat,.priority-card,.overview-action,.foreman-row,.business-card,.land-card,.warehouse-summary,.goods-item,.empty-state,.contract-card,.board-card{background:var(--sim-panel);border-color:var(--sim-border);color:var(--sim-text);box-shadow:0 4px 13px rgba(0,0,0,.12);}
.page-heading h2{color:#f0f3eb;}
.page-heading>div>small,.district-heading small,.land-info small{color:#9eaa9f;}
.district-tabs,.biz-tabs{background:#111914;border-color:#303c33;}
.district-tab,.biz-tab{color:#a4afa4;}
.district-tab.active,.biz-tab.active{background:#344337;color:#e2efda;box-shadow:inset 0 -2px 0 #a3ca73;}
.district-heading b,.business-card-head b,.contract-main .row>b,.empty-state b,.warehouse-summary b,.goods-item b,.overview-stat,.priority-copy b,.foreman-copy b{color:#eef2ea;}
.land-price,.district-count,.rep-tag,.pill{background:#2d3a30;border-color:#415242;color:#c3dca3;}
.muted,.business-card-head small,.business-desc,.business-hint,.land-footnote,.overview-footer,.focus-copy small,.daily-compact small{color:#a4afa3;}
.btn-primary,.mini-cta.full{background:#577b43;color:#f5f8ef;}
.btn-primary:hover{background:#668b50;}
.btn-gold{background:#bf9657;color:#171b16;}
.btn-blue{background:#526e70;color:#fff;}
.btn-ghost,.mini-cta{background:#303c33;border:1px solid #455247;color:#dbe5d7;}
.btn-danger{background:#8e493a;color:#fff;}
.section-title{color:#e9eee6;}

/* Modern typography, restrained motion, and a single reusable UI type stack. */
:root{--font-ui:Inter,"SF Pro Display","Segoe UI Variable",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--font-display:var(--font-ui);}
html,body,button,input,select,textarea{font-family:var(--font-ui);font-kerning:normal;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
.start-title,.page-heading h2,.scene-title{font-family:var(--font-display);font-weight:720;letter-spacing:-.045em;}
.start-sub{font-size:13px;line-height:1.5;letter-spacing:.005em;}
.pick-row .pick-card .t{font-size:clamp(8px,2.35vw,13px);font-weight:700;letter-spacing:-.035em;white-space:normal;overflow:visible;overflow-wrap:normal;word-break:normal;text-overflow:clip;}
.pick-row .pick-card .d{font-size:clamp(9px,2.15vw,10px);line-height:1.34;color:#cbd4c8;}
#tabs .tab-btn>span:not(.ic):not(.tab-badge){font-size:clamp(9px,2.6vw,11px);font-weight:650;letter-spacing:-.01em;}
.business-card-head b{font-size:12px;font-weight:700;}
.business-card-head small,.business-desc,.business-card-foot{font-size:10px;line-height:1.35;}
.business-desc{font-size:10px;}
.photo-bottom .fstate{font-size:9px;letter-spacing:.045em;}
.photo-meta{font-size:10px;}
.contract-main .row>b{font-size:12px;font-weight:650;}
.contract-main>small,.contract-progress>span,.cancel-link{font-size:10px;}
.overview-action{font-size:10px;font-weight:650;}
.district-heading b,.land-info b{font-size:12px;}
.district-heading small,.land-info small{font-size:10px;}
.section-title{font-size:16px;letter-spacing:-.02em;}
.card,.business-card,.land-card,.contract-card,.board-card{transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;}
.btn,.mini-cta,.overview-action,.tab-btn,.district-tab,.biz-tab,.field-tile{transition:transform .15s cubic-bezier(.2,.75,.25,1),background-color .18s ease,border-color .18s ease,box-shadow .18s ease;}
.btn:active,.mini-cta:active,.overview-action:active,.tab-btn:active,.district-tab:active,.biz-tab:active{transform:scale(.97);}
#tabs .tab-btn.active{position:relative;}
#tabs .tab-btn.active::after{content:"";position:absolute;left:30%;right:30%;bottom:2px;height:2px;border-radius:2px;background:#b6d48a;animation:tabMark .22s ease both;}
@keyframes tabMark{from{transform:scaleX(.4);opacity:0}to{transform:scaleX(1);opacity:1}}
.page-heading{animation:pageArrive .24s cubic-bezier(.2,.7,.25,1) both;}
@keyframes pageArrive{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.stage-ready::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(112deg,transparent 35%,rgba(255,244,205,.16) 48%,transparent 62%);transform:translateX(-120%);animation:cropGleam 7.5s ease-in-out infinite;}
@keyframes cropGleam{0%,58%{transform:translateX(-120%)}82%,100%{transform:translateX(120%)}}
.field-tile.ready-glow{animation:readyPulse 2.8s ease-in-out infinite;}
@keyframes readyPulse{0%,100%{box-shadow:0 5px 14px rgba(0,0,0,.24),0 0 0 0 rgba(192,164,101,0)}50%{box-shadow:0 8px 20px rgba(0,0,0,.28),0 0 0 1px rgba(192,164,101,.55)}}
.farm-scene{isolation:isolate;}
.farm-scene::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,.08) 50%,transparent 68%);transform:translateX(-120%);animation:sceneGleam 13s ease-in-out infinite;}
@keyframes sceneGleam{0%,70%{transform:translateX(-120%)}90%,100%{transform:translateX(120%)}}
.farm-scene::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.26;background:var(--weather-overlay,transparent),var(--season-overlay,transparent);transition:opacity .5s ease;}
.farm-scene.season-spring{--season-overlay:linear-gradient(115deg,rgba(101,153,91,.2),transparent 60%);}
.farm-scene.season-autumn{--season-overlay:linear-gradient(115deg,rgba(181,122,62,.19),transparent 62%);}
.farm-scene.season-winter{--season-overlay:linear-gradient(115deg,rgba(124,166,188,.3),rgba(178,198,202,.08) 62%,transparent);}
.farm-scene.weather-sunny{--weather-overlay:radial-gradient(ellipse at 83% 8%,rgba(255,226,155,.32),transparent 42%);}
.farm-scene.weather-rain::before{opacity:.3;--weather-overlay:repeating-linear-gradient(108deg,transparent 0 13px,rgba(224,240,239,.25) 14px,transparent 15px 26px),linear-gradient(120deg,rgba(54,86,101,.22),transparent 70%);background-size:100% 100%,100% 100%;animation:rainDrift 1.8s linear infinite;}
.farm-scene.weather-drought{--weather-overlay:radial-gradient(ellipse at 76% 24%,rgba(245,190,113,.22),transparent 46%),linear-gradient(115deg,rgba(154,114,60,.14),transparent 68%);}
@keyframes rainDrift{from{background-position:0 0,0 0}to{background-position:-8px 22px,0 0}}
.scene-top,.scene-copy,.scene-count{z-index:1;}
@media(hover:hover){.business-card:hover,.land-card:hover,.contract-card:hover,.board-card:hover{transform:translateY(-2px);border-color:#52664f;box-shadow:0 9px 22px rgba(0,0,0,.2);}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important;}}

@keyframes currencyGain{0%{transform:scale(1);border-color:#37443b}38%{transform:scale(1.075);border-color:#bbd18f;box-shadow:0 0 0 3px rgba(187,209,143,.16)}100%{transform:scale(1);border-color:#37443b;box-shadow:none}}
@keyframes currencyIcon{0%,100%{transform:rotate(0) scale(1)}45%{transform:rotate(-12deg) scale(1.18)}}
@keyframes currencySpend{0%{transform:scale(1)}45%{transform:scale(.96)}100%{transform:scale(1)}}
.xpbar>i{transition:width .45s cubic-bezier(.2,.75,.25,1);}
.photo-progress>i{background:linear-gradient(90deg,#a8c779,#dce8b0,#a8c779);background-size:200% 100%;animation:fieldProgressSheen 2.6s linear infinite;}
@keyframes fieldProgressSheen{to{background-position:200% 0}}
.stage-growing::before{content:"";position:absolute;inset:18% 7% 43%;z-index:0;pointer-events:none;opacity:.34;mix-blend-mode:screen;background:repeating-linear-gradient(174deg,transparent 0 11px,rgba(179,211,137,.36) 12px 14px,transparent 15px 25px);animation:cropRows 3.6s ease-in-out infinite;}
@keyframes cropRows{0%,100%{opacity:.2;transform:translateY(1px)}50%{opacity:.43;transform:translateY(-1px)}}

@keyframes machinePass{0%,100%{transform:translate(-50%,-50%) rotate(-2deg);box-shadow:0 4px 14px rgba(0,0,0,.35)}48%{transform:translate(calc(-50% + 17px),calc(-50% + 5px)) rotate(1deg);box-shadow:0 7px 17px rgba(0,0,0,.4)}}

.focus-progress i{background:linear-gradient(90deg,#8eaa69,#c4d89a,#8eaa69);background-size:180% 100%;animation:fieldProgressSheen 2.8s linear infinite;}
.coach-actions{display:flex;justify-content:flex-end;margin-top:10px;}
.coach-actions button{padding:6px 9px;border:0;background:transparent;color:#b8c4b4;font:600 10px var(--font-ui);cursor:pointer;}
.coach-actions button:active{color:#edf2e8;}
.login-reward{display:flex;align-items:center;gap:9px;min-height:51px;margin:8px 0;padding:7px 9px;background:#202a24;border:1px solid #3b4a3d;border-radius:11px;box-shadow:0 4px 13px rgba(0,0,0,.12);animation:rewardArrive .28s cubic-bezier(.2,.7,.25,1) both;}
.login-stamp{width:36px;height:36px;display:grid;place-items:center;flex:none;border:0;padding:0;border-radius:10px;background:#344433;color:#bdd991;cursor:pointer;transition:transform .16s,background-color .16s;}
.login-stamp:not(:disabled):active{transform:scale(.9);background:#4b6240;}
.login-stamp:disabled{cursor:default;opacity:.75;}
.login-stamp .ic{width:17px;height:17px;}
.login-copy{min-width:0;display:flex;flex-direction:column;gap:2px;flex:1;}
.login-copy b{font-size:10px;color:#edf2e8;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.login-copy small{font-size:9px;color:#bac7b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.reward-track{display:flex;gap:3px;margin-top:2px;}
.reward-track i{height:2px;flex:1;border-radius:3px;background:#455144;}
.reward-track i.filled{background:#9dbb72;}
.login-claim{min-width:64px;height:30px;padding:0 9px;border:0;border-radius:8px;background:#67884d;color:#f5f7f0;font:700 9px var(--font-ui);white-space:nowrap;cursor:pointer;transition:transform .15s,filter .15s;}
.login-claim:active{transform:scale(.96);}
.login-claim:disabled{background:#313c32;color:#bdc8b8;cursor:default;}
.login-reward.claimed{border-color:#334137;}
@keyframes rewardArrive{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
#modal-root .sheet{box-sizing:border-box;width:min(520px,calc(100vw - 24px));max-width:520px;flex:0 0 auto;}
#modal-root .sheet>*{box-sizing:border-box;max-width:100%;}
#modal-root .sheet .card{width:100%;min-width:0;}
#modal-root .sheet .card .row.between{display:flex;flex-wrap:wrap;align-items:flex-start;gap:7px;}
#modal-root .sheet .card .row.between>b.row{flex:1 1 140px;min-width:0;white-space:normal;overflow-wrap:anywhere;}
#modal-root .sheet .card .row.between>.pill{max-width:100%;min-width:0;white-space:normal;overflow-wrap:anywhere;}
#modal-root .sheet .card .small{line-height:1.4;overflow-wrap:anywhere;}
#modal-root .sheet .btn-block{width:100%;}

body.ret-offline-open #modal-root .backdrop{padding-top:60px;}
#modal-root .backdrop>.wallet-float,#overlay-root .backdrop>.wallet-float{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;z-index:4;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:7px;width:max-content;max-width:calc(100vw - 24px);pointer-events:none;}
.wallet-float .chip{min-height:34px;padding:5px 10px;background:rgba(20,29,23,.97);border:1px solid #53634f;border-radius:11px;box-shadow:0 4px 16px rgba(0,0,0,.3);color:#f1f4ed;font-size:13px;}
.wallet-float .chip .ic{width:16px;height:16px;color:#d9c28e;}

.goods-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}

.warehouse-actions .btn{width:100%;min-width:0;white-space:normal;line-height:1.2;overflow-wrap:anywhere;}

/* ============================================================
   VISUAL JUICE — частицы, живой фон, эффекты
   ============================================================ */
#fx-canvas{position:fixed;inset:0;z-index:200;pointer-events:none;}
#ambient{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;border-radius:inherit;
  background:
    radial-gradient(ellipse 120% 55% at 50% 0%,rgba(56,90,64,.55) 0%,rgba(24,33,28,0) 70%),
    radial-gradient(ellipse 90% 40% at 12% 100%,rgba(41,66,48,.45) 0%,rgba(24,33,28,0) 70%),
    linear-gradient(180deg,#121a16 0%,#18211c 45%,#1b2620 100%);
  transition:background .8s ease;}
#ambient .amb-stars{position:absolute;inset:0;opacity:.62;translate:var(--px,0px) 0;
  background-image:radial-gradient(1.9px 1.9px at 12% 14%,#dff3c9 50%,transparent 51%),radial-gradient(1.2px 1.2px at 28% 7%,#ffffff 50%,transparent 51%),radial-gradient(1.6px 1.6px at 46% 18%,#dff3c9 50%,transparent 51%),radial-gradient(1.1px 1.1px at 63% 9%,#ffffff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 78% 20%,#dff3c9 50%,transparent 51%),radial-gradient(1.2px 1.2px at 89% 6%,#ffffff 50%,transparent 51%),radial-gradient(1.3px 1.3px at 7% 27%,#ffffff 50%,transparent 51%),radial-gradient(1.1px 1.1px at 36% 30%,#dff3c9 50%,transparent 51%),radial-gradient(1.4px 1.4px at 70% 31%,#ffffff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 95% 28%,#dff3c9 50%,transparent 51%);
  animation:starsTwinkle 6s ease-in-out infinite;}
@keyframes starsTwinkle{0%,100%{opacity:.45}50%{opacity:.85}}
#ambient .amb-hills{position:absolute;left:-6%;right:-6%;bottom:-2%;height:46%;transform:translateX(var(--px,0px));
  background:
    radial-gradient(ellipse 46% 100% at 18% 100%,rgba(43,67,49,.92) 0%,rgba(38,58,43,.85) 60%,rgba(38,58,43,0) 61%),
    radial-gradient(ellipse 55% 100% at 58% 100%,rgba(33,52,39,.95) 0%,rgba(29,45,34,.9) 60%,rgba(29,45,34,0) 61%),
    radial-gradient(ellipse 40% 100% at 96% 100%,rgba(38,60,44,.9) 0%,rgba(33,52,39,.85) 60%,rgba(33,52,39,0) 61%);
  animation:hillsBreathe 14s ease-in-out infinite;}
@keyframes hillsBreathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#ambient .amb-vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(0,0,0,0) 40%,rgba(4,10,7,.55) 100%);}
#ambient.rainy .amb-hills{filter:brightness(.8) saturate(.7);}
#ambient .amb-sun{position:absolute;top:74px;right:20px;width:58px;height:58px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#eef7d2 0%,#cfe8a3 38%,rgba(140,190,110,0) 70%);
  box-shadow:0 0 26px 6px rgba(160,210,120,.18);
  animation:sunPulse 5.5s ease-in-out infinite;}
#ambient .amb-sun::after{content:'';position:absolute;inset:-22px;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0deg,rgba(190,230,150,.22) 10deg,transparent 22deg,rgba(190,230,150,.22) 58deg,transparent 70deg,rgba(190,230,150,.22) 118deg,transparent 130deg,rgba(190,230,150,.22) 178deg,transparent 190deg,rgba(190,230,150,.22) 238deg,transparent 250deg,rgba(190,230,150,.22) 298deg,transparent 310deg);
  animation:sunSpin 40s linear infinite;}
@keyframes sunPulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.06);opacity:1}}
@keyframes sunSpin{to{transform:rotate(360deg)}}
#ambient .amb-cloud{position:absolute;background:#3a4f41;border-radius:99px;opacity:.55;animation:cloudFloat linear infinite;translate:var(--px,0px) var(--py,0px);}
#ambient .amb-cloud::before,#ambient .amb-cloud::after{content:'';position:absolute;background:#3a4f41;border-radius:50%;}
#ambient .amb-cloud::before{width:55%;height:170%;top:-85%;left:18%;}
#ambient .amb-cloud::after{width:40%;height:130%;top:-60%;right:15%;}
@keyframes cloudFloat{from{transform:translateX(-150px)}to{transform:translateX(680px)}}
#ambient.rainy{background:
    radial-gradient(ellipse 120% 55% at 50% 0%,rgba(48,74,86,.5) 0%,rgba(21,28,26,0) 70%),
    linear-gradient(180deg,#0f1618 0%,#151d1f 45%,#182120 100%);}
#ambient.rainy .amb-sun{opacity:.16;box-shadow:none;}
#ambient.rainy .amb-stars{opacity:.16;}
#ambient.rainy .amb-cloud{opacity:.8;background:#2f4048;}
#ambient.rainy .amb-cloud::before,#ambient.rainy .amb-cloud::after{background:#2f4048;}
.xpbar>i{position:relative;overflow:hidden;}
.xpbar>i::after{content:'';position:absolute;top:0;left:-60%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
  animation:xpSheen 2.6s ease-in-out infinite;}
@keyframes xpSheen{0%,60%{left:-60%}100%{left:160%}}
.field-tile.ready-glow{animation:readyBreathe 1.9s ease-in-out infinite;}
@keyframes readyBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.022)}}
@keyframes screenShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-3px,1px)}40%{transform:translate(3px,-1px)}60%{transform:translate(-2px,-1px)}80%{transform:translate(2px,1px)}}
#app.shake{animation:screenShake .35s ease-out;}
.toast .ic{animation:toastIconPop .3s cubic-bezier(.2,.9,.3,1.3);}
@keyframes toastIconPop{from{transform:scale(.4) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.btn{transition:transform .14s cubic-bezier(.34,1.56,.64,1),box-shadow .08s,filter .15s;}
.btn:active{transform:scale(.955);}
@media (prefers-reduced-motion:reduce){
  #ambient .amb-sun,#ambient .amb-sun::after,#ambient .amb-cloud,.xpbar>i::after,.field-tile.ready-glow{animation:none!important;}
}

/* ambient должен просвечивать сквозь контент */
#app > #screen{background:transparent !important;}
#app > #hud{position:relative;z-index:3;}
#app > #tabs{position:relative;z-index:3;}
.tap-ripple{position:fixed;border-radius:50%;pointer-events:none;z-index:210;
  background:radial-gradient(circle,rgba(255,255,255,.55) 0%,rgba(255,255,255,.18) 55%,transparent 70%);
  animation:rippleOut .5s cubic-bezier(.2,.7,.3,1) forwards;}
@keyframes rippleOut{from{transform:scale(.15);opacity:.85}to{transform:scale(1);opacity:0}}
/* ============================================================
   СТИЛИ МОДУЛЯ УДЕРЖАНИЯ + КАРТА ФЕРМЫ
   Вставляется перед закрывающим тегом style
   ============================================================ */

/* ---------- общие ---------- */
.muted-small{font-size:10px;color:#9fae9c;line-height:1.45;}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px;gap:8px;}
.sec-title h3{margin:0;font-size:13px;font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:6px;color:#e6efe2;}
.sec-title h3 .ic{width:16px;height:16px;color:#b0cf7a;}
.sec-title small{font-size:10px;color:#9fae9c;font-weight:600;}
.chip-mini{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:8px;background:#27332b;border:1px solid #3a4a3d;font-size:10px;font-weight:700;color:#cfe0c5;}

/* ---------- ЕЖЕДНЕВНЫЕ ЗАДАНИЯ ---------- */
.quest-list{display:flex;flex-direction:column;gap:7px;}
.quest-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;background:#202a24;border:1px solid #33423a;position:relative;overflow:hidden;}
.quest-item.done{border-color:#5f8a4d;background:#22301f;}
.quest-item.claimed{opacity:.55;}
.quest-ic{width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:9px;background:#2b3a30;color:#b0cf7a;}
.quest-ic .ic{width:18px;height:18px;}
.quest-body{flex:1;min-width:0;}
.quest-body b{display:block;font-size:11.5px;font-weight:700;color:#eef3ea;line-height:1.3;}
.quest-bar{margin-top:5px;height:4px;border-radius:99px;background:#33423a;overflow:hidden;}
.quest-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8fbf5f,#c3e08a);transition:width .4s;}
.quest-prog{font-size:9.5px;color:#9fae9c;font-weight:600;margin-top:3px;}
.quest-claim{flex:none;padding:6px 10px;border-radius:9px;border:0;font:800 10px/1 var(--font-ui);background:linear-gradient(180deg,#d8b25e,#b98f3c);color:#231a06;cursor:pointer;}
.quest-claim:active{transform:scale(.94);}
.quest-claim:disabled{background:#2f3a31;color:#7d8b7c;cursor:default;}
.quest-check{flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:#3f6b34;color:#d5f0b8;}
.quest-check .ic{width:14px;height:14px;}

/* ---------- СТРИК ---------- */
.streak-card{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:13px;background:linear-gradient(135deg,#2b3a2b 0%,#1e2a20 100%);border:1px solid #40543f;}
.streak-flame{width:38px;height:38px;flex:none;display:grid;place-items:center;font-size:20px;border-radius:11px;background:#3a2f1a;border:1px solid #5c4a24;}
.streak-info{flex:1;min-width:0;}
.streak-info b{display:block;font-size:12px;color:#f2e7c8;font-weight:800;}
.streak-info small{font-size:9.5px;color:#a9b8a2;}
.streak-freeze{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle;}
.streak-freeze i{width:11px;height:11px;border-radius:3px;background:#39463a;display:inline-block;}
.streak-freeze i.on{background:linear-gradient(180deg,#9fd6f0,#5fa8cc);box-shadow:0 0 5px rgba(120,200,240,.5);}
.streak-days{display:flex;gap:3px;margin-top:5px;}
.streak-days i{width:100%;height:4px;border-radius:99px;background:#39463a;}
.streak-days i.on{background:linear-gradient(90deg,#d8b25e,#f0d68f);}

/* ---------- ЯРМАРКА ---------- */
.fair-banner{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;position:relative;overflow:hidden;
  background:linear-gradient(120deg,#2a3a2b 0%,#33452c 55%,#3d4a26 100%);border:1px solid #55663f;}
.fair-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,230,150,.12) 50%,transparent 70%);
  transform:translateX(-100%);animation:fairShine 4s ease-in-out infinite;}
@keyframes fairShine{0%,70%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.fair-ic{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:11px;background:#4a3f1e;color:#f5d98a;font-size:18px;}
.fair-body{flex:1;min-width:0;}
.fair-body b{display:block;font-size:11.5px;color:#f7f0d8;font-weight:800;}
.fair-body small{font-size:9.5px;color:#c3cfae;}
.fair-timer{flex:none;font:800 10px var(--font-ui);color:#e8d9a6;background:#3a3a20;padding:5px 8px;border-radius:8px;}

/* ---------- ОФФЛАЙН-ЭКРАН ---------- */
.offline-hero{text-align:center;padding:6px 0 2px;}
.offline-hero .big{font-size:44px;line-height:1;margin-bottom:2px;}
.offline-time{display:inline-block;margin:6px auto 12px;padding:4px 12px;border-radius:99px;background:#2b3a30;color:#b9cbb0;font:700 10px var(--font-ui);}
.offline-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0;}
.offline-stat{padding:10px;border-radius:12px;background:#202a24;border:1px solid #33423a;text-align:left;}
.offline-stat b{display:block;font-size:16px;font-weight:900;color:#eaf3e3;}
.offline-stat small{font-size:9.5px;color:#9fae9c;font-weight:600;line-height:1.3;}
.offline-stat.gold b{color:#f0d68f;}

/* ---------- ВКЛАДКИ ФЕРМЫ (карта) ---------- */
.farm-map{padding:2px 0 6px;}
.map-scene{position:relative;border-radius:16px;overflow:hidden;border:1px solid #3b4d3c;
  background:radial-gradient(ellipse at 50% 10%,#2f4732 0%,#22331f 55%,#1a2619 100%);
  padding:10px;height:auto;}
.map-island{position:relative;min-height:230px;}
.map-slot{position:absolute;width:74px;transform:translate(-50%,-50%);cursor:pointer;text-align:center;}
.map-slot .slot-art{width:74px;height:56px;border-radius:12px;display:grid;place-items:center;font-size:26px;
  background:linear-gradient(160deg,#33472f,#26361f);border:1px solid #4a6041;box-shadow:0 3px 10px rgba(0,0,0,.35);transition:transform .15s;}
.map-slot:active .slot-art{transform:scale(.94);}
.map-slot .slot-name{font-size:8.5px;color:#c6d5bd;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.map-slot.locked .slot-art{opacity:.5;filter:grayscale(.7);}
.map-slot.has-alert .slot-art{animation:slotAlert 1.6s ease-in-out infinite;border-color:#c9a44e;}
@keyframes slotAlert{0%,100%{box-shadow:0 3px 10px rgba(0,0,0,.35)}50%{box-shadow:0 0 0 3px rgba(201,164,78,.4),0 3px 12px rgba(0,0,0,.4)}}
.map-path{position:absolute;inset:0;pointer-events:none;}
.map-badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:99px;background:#c9503c;color:#fff;font:800 9px/17px var(--font-ui);text-align:center;padding:0 4px;}
.map-badge.ok{background:#4d8a3e;}
.map-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92px;text-align:center;}
.map-center .mc-art{width:92px;height:74px;border-radius:16px;display:grid;place-items:center;font-size:34px;
  background:linear-gradient(160deg,#3d5a3a,#2b4227);border:2px solid #6d8a54;box-shadow:0 0 18px rgba(140,190,110,.25);}
.map-center .mc-name{font-size:9px;font-weight:800;color:#dff0cf;margin-top:3px;}

/* статы карты */
.map-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0;}
.map-stat{padding:9px 8px;border-radius:11px;background:#202a24;border:1px solid #33423a;text-align:center;}
.map-stat b{display:block;font-size:14px;font-weight:900;color:#eaf3e3;line-height:1.1;}
.map-stat small{font-size:8.5px;color:#9fae9c;font-weight:700;letter-spacing:.03em;}
.map-stat.warn b{color:#e8b46a;}

/* ---------- СКЛАД-БУНКЕР (выдержка) ---------- */
.age-card{border-radius:14px;background:#202a24;border:1px solid #3a4a3d;padding:11px;margin-bottom:8px;}
.age-head{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.age-ic{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;background:#33452f;font-size:17px;}
.age-head b{display:block;font-size:11.5px;color:#eef3ea;}
.age-head small{font-size:9.5px;color:#9fae9c;}
.age-slots{display:flex;gap:6px;margin-top:8px;}
.age-slot{flex:1;border-radius:10px;background:#18211c;border:1px dashed #3d4c3e;padding:8px 6px;text-align:center;min-height:74px;display:flex;flex-direction:column;justify-content:center;gap:3px;}
.age-slot.active{border-style:solid;border-color:#8a7434;background:linear-gradient(160deg,#2b2a1b,#1f2118);}
.age-slot .as-good{font-size:9.5px;font-weight:700;color:#e8e0c4;line-height:1.2;}
.age-slot .as-mult{font-size:15px;font-weight:900;color:#f0d68f;line-height:1;}
.age-slot .as-time{font-size:8.5px;color:#b8b193;}
.age-slot .as-mult-max{color:#9fdf8a;}
.age-empty{font-size:9px;color:#7d8b7c;line-height:1.3;}

/* ---------- ЗАГОНЫ / ЖИВОТНЫЕ ---------- */
.pen-card{border-radius:14px;background:#202a24;border:1px solid #3a4a3d;padding:11px;margin-bottom:8px;position:relative;overflow:hidden;}
.pen-head{display:flex;align-items:center;gap:9px;}
.pen-ic{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:11px;background:#33452f;font-size:20px;}
.pen-head b{display:block;font-size:12px;color:#eef3ea;}
.pen-head small{font-size:9.5px;color:#9fae9c;}
.pen-status{margin-left:auto;flex:none;font:800 9px var(--font-ui);padding:4px 7px;border-radius:7px;}
.pen-status.good{background:#2f4a2c;color:#b8e39a;}
.pen-status.warn{background:#4a3d20;color:#e8c078;}
.pen-status.bad{background:#4a2622;color:#e8a090;}
.pen-care{display:flex;gap:5px;margin-top:8px;}
.pen-care button{flex:1;border:0;border-radius:9px;padding:7px 4px;background:#2b3a30;color:#cfe0c5;font:700 9px var(--font-ui);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
.pen-care button:active{transform:scale(.95);}
.pen-care button .ic{width:14px;height:14px;color:#a9c88f;}
.pen-care button.low .ic{color:#e8b46a;}
.pen-bar{height:3px;border-radius:99px;background:#2d3a2e;margin-top:6px;overflow:hidden;}

.pass-head .ic{width:20px;height:20px;color:#e8c078;}
.pass-head b{font-size:12.5px;color:#f3edd9;}
.pass-head small{margin-left:auto;font-size:9.5px;color:#b6c4ac;font-weight:700;}
.pass-bar{height:7px;border-radius:99px;background:#2b382c;overflow:hidden;margin-bottom:4px;}

.ach-grid{display:flex;flex-direction:column;gap:6px;}

.ach-body{flex:1;min-width:0;}
.ach-body b{display:block;font-size:10.5px;color:#eef3ea;}
.ach-body small{font-size:9px;color:#9fae9c;}

/* ---------- ВКЛАДКИ ЭКРАНА ФЕРМЫ ---------- */
.farm-switch{display:flex;gap:4px;margin-bottom:9px;background:#1b241e;padding:4px;border-radius:12px;border:1px solid #2f3c32;}
.farm-switch button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 4px;color:#9aa896;font:700 9.5px var(--font-ui);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
.farm-switch button .ic{width:15px;height:15px;}
.farm-switch button.active{background:#2e4230;color:#d6ecbe;box-shadow:inset 0 -2px 0 #9fca6d;}

/* адаптив: карта на узких экранах */
@media (max-width:360px){
  .map-slot{width:66px;}
  .map-slot .slot-art{width:66px;height:50px;font-size:23px;}
  .map-center{width:80px;}
  .map-center .mc-art{width:80px;height:64px;font-size:28px;}
}

/* ---------- 1. ВРЕМЯ СУТОК ---------- */
#ambient{transition:background 1.4s ease, filter 1.4s ease;}
#ambient .amb-sun,#ambient .amb-cloud,#ambient .amb-hills{transition:all 1.4s ease;}

body.tod-dawn #ambient{
  background:
    radial-gradient(ellipse 130% 62% at 50% 100%,rgba(255,150,90,.42) 0%,rgba(120,90,120,.22) 52%,transparent 74%),
    radial-gradient(ellipse 120% 55% at 50% 0%,rgba(80,100,150,.4) 0%,transparent 66%),

body.tod-day #ambient{

    radial-gradient(ellipse 120% 55% at 50% 0%,rgba(120,180,225,.42) 0%,rgba(24,33,28,0) 70%),
    linear-gradient(180deg,#2c5474 0%,#3f6f7d 34%,#527a5e 68%,#5f8352 100%);}

body.tod-day #ambient .amb-vignette{background:radial-gradient(ellipse 85% 65% at 50% 40%,rgba(0,0,0,0) 55%,rgba(8,22,14,.35) 100%);}

body.tod-golden #ambient{
  background:
    radial-gradient(ellipse 120% 62% at 78% 80%,rgba(255,170,70,.5) 0%,transparent 64%),
    radial-gradient(ellipse 110% 50% at 30% 0%,rgba(90,120,150,.3) 0%,transparent 66%),
    linear-gradient(180deg,#2a3d55 0%,#4d5a5e 36%,#8a6f42 70%,#b98a4a 100%);}
body.tod-golden #ambient .amb-hills{filter:brightness(.92) saturate(1.06) sepia(.12);}
body.tod-golden #ambient .amb-sun{top:auto;bottom:26%;right:22px;box-shadow:0 0 48px 16px rgba(255,190,100,.4);}

body.tod-dusk #ambient{
  background:
    radial-gradient(ellipse 130% 58% at 24% 82%,rgba(230,110,80,.4) 0%,transparent 64%),

body.tod-dusk #ambient .amb-hills{filter:brightness(.6) saturate(.72) hue-rotate(-8deg);}
body.tod-dusk #ambient .amb-sun{top:auto;bottom:16%;left:18%;right:auto;opacity:.85;}
body.tod-dusk #ambient .amb-stars{opacity:.55;}
body.tod-dusk #ambient .amb-vignette{background:radial-gradient(ellipse 80% 62% at 50% 38%,rgba(12,6,20,.42) 40%,rgba(6,4,12,.78) 100%);}

body.tod-night #ambient{
  background:
    radial-gradient(ellipse 120% 52% at 50% 0%,rgba(50,80,130,.36) 0%,transparent 68%),
    linear-gradient(180deg,#070b14 0%,#0d1524 40%,#121d30 72%,#16263a 100%);}
body.tod-night #ambient .amb-hills{filter:brightness(.4) saturate(.5) hue-rotate(8deg);}
body.tod-night #ambient .amb-sun{top:56px;right:34px;opacity:1;
  background:radial-gradient(circle at 38% 34%,#fdfbee 0%,#dcd9c0 52%,rgba(185,183,158,0) 72%);

body.tod-night #ambient .amb-sun::after{display:none;}

body.tod-night #ambient .amb-stars{opacity:.95;}
body.tod-night #ambient .amb-vignette{background:radial-gradient(ellipse 80% 62% at 50% 38%,rgba(2,4,10,.4) 40%,rgba(2,3,8,.8) 100%);}
body.tod-night .farm-scene{filter:brightness(.62) saturate(.75) hue-rotate(6deg);}
body.tod-dusk .farm-scene{filter:brightness(.78) saturate(.86) sepia(.1);}
body.tod-dawn .farm-scene{filter:brightness(.84) saturate(.92) sepia(.08);}
body.tod-golden .farm-scene{filter:brightness(1.02) saturate(1.1) sepia(.14);}

/* индикатор фазы в HUD */
.liv-phase{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:750;
  padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.08);color:#cfe0c5;}

/* ---------- 2. СВЕТЛЯЧКИ / СНЕЖИНКИ ---------- */
.liv-fireflies{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1;}
.liv-ff{position:absolute;width:4px;height:4px;border-radius:50%;background:#eaff9a;
  box-shadow:0 0 8px 3px rgba(220,255,140,.6);opacity:0;}
body.tod-night .liv-ff{animation:livFly 8s ease-in-out infinite;}
@keyframes livFly{
  0%{opacity:0;transform:translate(0,0) scale(.7)}
  18%{opacity:.9}
  50%{transform:translate(34px,-44px) scale(1);opacity:.75}
  80%{opacity:.85}
  100%{opacity:0;transform:translate(-20px,-76px) scale(.8)}}

/* ---------- 3. ПИТОМЕЦ ---------- */
.liv-pet{position:absolute;right:6px;bottom:calc(env(safe-area-inset-bottom) + 58px);z-index:9;width:56px;cursor:pointer;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.45));transition:transform .2s;}
.liv-pet:active{transform:scale(.93);}
.liv-pet.sleeping{opacity:.8;}
.liv-pet svg{display:block;width:56px;height:46px;transition:transform .3s;}
.liv-pet.wag svg{animation:petWag .5s ease-in-out 3;}
@keyframes petWag{0%,100%{transform:rotate(0)}30%{transform:rotate(-7deg)}70%{transform:rotate(6deg)}}
.liv-pet-bubble{position:absolute;right:48px;bottom:30px;background:#f4faf0;color:#1b2a1f;
  font:800 9px/1.2 var(--font-ui);padding:4px 7px;border-radius:9px 9px 2px 9px;white-space:nowrap;
  box-shadow:0 3px 8px rgba(0,0,0,.3);animation:bubbleIn .3s ease-out;}
@keyframes bubbleIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.liv-pet-lvl{position:absolute;right:-2px;top:-2px;min-width:16px;height:16px;border-radius:99px;
  background:#c9a44e;color:#231a06;font:800 9px/16px var(--font-ui);text-align:center;padding:0 3px;
  box-shadow:0 2px 5px rgba(0,0,0,.35);}

/* ---------- 4. ЖИВОТНЫЕ НА СЦЕНЕ ---------- */
.liv-critters{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1;}
.liv-critter{position:absolute;font-size:0;opacity:.92;}
.liv-bird{position:absolute;width:22px;height:10px;opacity:.75;}
.liv-bird::before,.liv-bird::after{content:'';position:absolute;top:0;width:11px;height:8px;
  border:1.6px solid rgba(30,45,32,.75);border-radius:50% 50% 0 0;border-bottom:0;}
.liv-bird::before{left:0;transform:rotate(-14deg);}
.liv-bird::after{right:0;transform:rotate(14deg);}

/* ---------- 5. ШТОРМ ---------- */
.liv-storm-banner{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;
  background:linear-gradient(120deg,#2a2230,#3a2a30 55%,#402a28);border:1px solid #6b4a44;
  position:relative;overflow:hidden;margin-bottom:9px;}
.liv-storm-banner::after{content:'';position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 30%,rgba(255,180,150,.14) 50%,transparent 70%);
  transform:translateX(-100%);animation:fairShine 3s ease-in-out infinite;}
.liv-storm-ic{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:11px;
  background:#4a2a24;color:#f0a08a;}
.liv-storm-body{flex:1;min-width:0;}
.liv-storm-body b{display:block;font-size:11.5px;color:#f7e2da;font-weight:800;}
.liv-storm-body small{font-size:9.5px;color:#c9a89e;}
.liv-storm-timer{flex:none;font:800 10px var(--font-ui);color:#f0b8a0;background:#3a2420;padding:5px 8px;border-radius:8px;}
.liv-choice{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.liv-choice button{border:1px solid #4a5a44;border-radius:12px;padding:11px 12px;background:#202a24;
  text-align:left;cursor:pointer;color:#eaf3e3;font-family:inherit;}
.liv-choice button:active{transform:scale(.98);}
.liv-choice button b{display:block;font-size:12px;margin-bottom:2px;}
.liv-choice button small{font-size:9.5px;color:#9fae9c;}
.liv-choice button.safe{border-color:#4a7a44;background:#1f2d1e;}
.liv-choice button.risky{border-color:#7a5a34;background:#2b251a;}

.liv-card{aspect-ratio:1;border-radius:9px;background:#1a231d;border:1px solid #33423a;

.liv-card.owned.new{animation:cardNew 1.4s ease-in-out 2;}
@keyframes cardNew{0%,100%{box-shadow:0 0 0 0 rgba(230,190,110,0)}50%{box-shadow:0 0 0 3px rgba(230,190,110,.6)}}

.liv-card .lc-ic{width:20px;height:20px;color:#cfe0c5;}

.liv-card-meta{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-top:7px;}
.liv-card-meta b{font-size:11px;color:#eef3ea;}
.liv-card-meta small{font-size:9.5px;color:#9fae9c;}

.liv-week{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;

  position:relative;overflow:hidden;margin-bottom:9px;}
.liv-week::after{content:'';position:absolute;inset:0;

.liv-week-body{flex:1;min-width:0;}
.liv-week-body b{display:block;font-size:11.5px;color:#faf3dd;font-weight:800;}
.liv-week-body small{font-size:9.5px;color:#cfc09a;}
.liv-week-track{height:5px;border-radius:99px;background:#3a3422;margin-top:5px;overflow:hidden;}
.liv-week-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#c9a44e,#f0d68f);}

/* переключатель фермы — 5 вкладок скроллом */
.farm-switch{overflow-x:auto;scrollbar-width:none;}
.farm-switch::-webkit-scrollbar{display:none;}
.farm-switch button{min-width:56px;}

/* питомец в диалоге */
.liv-pet-hero{text-align:center;padding:4px 0 8px;}
.liv-pet-hero svg{width:110px;height:88px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));}
.liv-pet-xp{height:6px;border-radius:99px;background:#2d3a2e;margin:8px 0 4px;overflow:hidden;}
.liv-pet-xp i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8fbf5f,#c3e08a);}
.liv-pet-actions{display:flex;gap:7px;margin-top:10px;}
.liv-pet-actions button{flex:1;border:0;border-radius:11px;padding:10px 6px;cursor:pointer;font-family:inherit;

.liv-pet-actions button:active{transform:scale(.96);}
.liv-pet-actions .feed{background:linear-gradient(180deg,#d8b25e,#b98f3c);color:#231a06;}
.liv-pet-actions .play{background:#2b3a30;color:#cfe0c5;border:1px solid #3d5040;}

@media (prefers-reduced-motion:reduce){
  .liv-ff,.liv-pet.wag svg,.liv-card.owned.new{animation:none!important;}
}

function fmtTime(sec){

  return h + ' ч ' + (m%60) + ' мин';
}

let AC = null;
function beep(freq, dur=0.07, type='sine', vol=0.12){
  if (!S || !S.settings.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  }catch(e){}
}

function seasonInfo(){

  const days = Math.floor((Date.now()-S.createdAt)/86400000);
  const m = days % 12;
