/* ---------------- СТРИК С ЗАМОРОЗКОЙ ---------------- */
function RET_touchStreak(){
  const R = S.ret;
  const st = R.streak;
  const today = RET_today();
  if (st.last === today) return { counted:true, isNew:false };

  // если пришли вчера — продолжаем; если пропустили и есть заморозка — восстанавливаем
  const yesterday = yesterdayStr();
  if (st.last === yesterday){
    st.count = (st.count||0) + 1;
  } else if (st.last && st.freezes > 0 && st.last !== today){
    st.freezes--; st.usedFreeze = true;
    st.count = (st.count||0) + 1;
    setTimeout(()=>toast('Заморозка стрика спасла серию!', 'good', 'shield'), 1500);
  } else {
    st.count = 1;
  }
  st.last = today;
  st.best = Math.max(st.best||0, st.count);
  S.stats.bestStreak = Math.max(S.stats.bestStreak||0, st.count);

  // заморозки накапливаются
  if (st.count % 7 === 0) st.freezes = Math.min(STREAK_FREEZE_MAX, (st.freezes||0) + 1);

  // вехи
  const ms = STREAK_MILESTONES[st.count];
  if (ms){
    st.lastMilestone = st.count;
    addCoins(ms.coins); S.gems += ms.gems;
    if (ms.skin) S.ret.skin = ms.skin;
    setTimeout(()=>{
      FX.confetti();
      openDialog(`<div style="text-align:center">
        <div class="big-emoji">🔥</div>
        <h2>${ms.text}</h2>
        <p class="muted">Стрик ${st.count} дней подряд</p>
        <p><b>+${fmt(ms.coins)} монет и +${ms.gems} ${gemWord(ms.gems)}</b></p>
        ${ms.skin?`<p class="muted">Открыт скин фермы: «${ms.skin}»</p>`:''}
        <button class="btn btn-primary btn-block" onclick="App.closeModal()">Продолжить</button></div>`);
    }, 600);
  }
  RET_checkAchievements();
  return { counted:true, isNew:true };
}

const AGING_TIERS = [
  { key:'fresh',  name:'Свежий',   mult:1.0,  hours:0,   color:'#9fae9c', icon:'🌾' },
  { key:'aged1',  name:'Выдержка', mult:1.25, hours:2,   color:'#b5d48a', icon:'⏳' },
  { key:'aged2',  name:'Выдержано',mult:1.55, hours:6,   color:'#e8c078', icon:'⭐' },
  { key:'aged3',  name:'Элита',    mult:2.0,  hours:12,  color:'#f0d68f', icon:'🏆' },
];

function RET_agingTier(p){
  if (!p) return null;
  const elapsed = (Date.now() - p.startedAt) / 3600000; // часы реального времени
  let t = 0;
  for (let i=AGING_TIERS.length-1; i>=0; i--){ if (elapsed >= AGING_TIERS[i].hours){ t = i; break; } }
  return { tier: AGING_TIERS[t], index: t, elapsed, progress: t>=AGING_TIERS.length-1 ? 1 : (elapsed - AGING_TIERS[t].hours) / (AGING_TIERS[t+1].hours - AGING_TIERS[t].hours) };
}

function RET_agedGoods(){
  return (S.ret.aging.slots||[]).filter(Boolean);
}

function RET_putToAge(good){
  const R = S.ret; const A = R.aging;
  if (!S.goods[good] || S.goods[good] <= 0) return;
  const freeSlot = A.slots.findIndex(s=>!s);
  if (freeSlot < 0){ toast('Все ячейки выдержки заняты', 'bad', 'box'); sfx.bad(); return; }
  const units = Math.min(S.goods[good], A.sizeCap || 24);
  S.goods[good] -= units;
  A.slots[freeSlot] = { good, units, startedAt: Date.now(), slot: freeSlot };
  toast(`${GOODS[good].name} ×${units} на выдержку`, 'good', 'clock');
  sfx.pop(); save(); renderAll();
}

function RET_takeFromAge(slotIndex){
  const R = S.ret, A = R.aging;
  const p = A.slots[slotIndex];
  if (!p) return;
  const tierInfo = RET_agingTier(p);
  const mult = tierInfo.tier.mult;
  const price = GOODS[p.good].price;
  const gain = Math.round(p.units * price * mult);
  A.slots[slotIndex] = null;
  addCoins(gain);
  S.stats.aged = (S.stats.aged||0) + 1;
  RET_track('age', 1);
  toast(`Продано выдержанного: +${fmt(gain)} монет (${mult}×)`, 'good', 'coin');
  sfx.coin(); buzz(45);
  FX.confetti(); FX.coin(document.querySelector('#modal-root .dialog'), document.querySelector('[data-coins]'));
  save(); renderAll();
}

function RET_autoSellAged(){
  let total = 0, count = 0;
  const A = S.ret.aging;
  A.slots.forEach((p, i)=>{
    if (!p) return;
    const t = RET_agingTier(p);
    total += Math.round(p.units * GOODS[p.good].price * t.tier.mult) * 1;
    count++;
    A.slots[i] = null;
  });
  if (total > 0){
    addCoins(total);
    toast(`+${fmt(total)} монет за ${count} парт.`, 'good', 'coin');
    sfx.coin(); save(); renderAll();
  }
}

/* ---------------- УХОД ЗА ЖИВОТНЫМИ (мягкая механика) ---------------- */
function RET_penMood(building){
  // mood = минимум из feed/water/clean + бонус, если всё в порядке
  const minVal = Math.min(building.feed||0, building.water||0, building.clean||0);
  const avg = ((building.feed||0)+(building.water||0)+(building.clean||0))/3;
  if (minVal < 20) return { level:'bad', label:'Голодные', mult:0.5 };
  if (minVal < 40) return { level:'warn', label:'Нужен уход', mult:0.75 };
  if (avg < 70) return { level:'warn', label:'Нормально', mult:0.95 };
  return { level:'good', label:'Довольны', mult:1.15 };
}

/* ---------------- ПРОПУСК ---------------- */
function RET_passLevel(){
  return Math.min(PASS_TRACKS.length, Math.floor((S.ret.pass.xp||0) / PASS_XP_PER_LEVEL) + 1);
}
function RET_passProgress(){
  const xp = S.ret.pass.xp||0;
  const lvl = RET_passLevel();
  if (lvl >= PASS_TRACKS.length) return 1;
  return (xp % PASS_XP_PER_LEVEL) / PASS_XP_PER_LEVEL;
}
function RET_claimPass(track, level){
  const P = S.ret.pass;
  const tier = PASS_TRACKS.find(t=>t.level===level);
  if (!tier) return;
  const list = track==='premium' ? P.premiumClaimed : P.freeClaimed;
  if (list.includes(level)) return;
  if (level > RET_passLevel()-1 && level > RET_passLevel()) { toast('Ещё не достигнуто', 'bad', 'lock'); return; }
  if (list.includes(level)) return;
  const reward = tier[track];
  if (track==='premium' && !P.premium){ toast('Премиум-пропуск не активирован', 'bad', 'star'); return; }
  list.push(level);
  if (reward.coins) addCoins(reward.coins);
  if (reward.gems) S.gems += reward.gems;
  if (reward.skin) S.ret.skin = reward.skin;
  toast(`Пропуск: ${reward.coins?`+${fmt(reward.coins)} монет`:''}${reward.gems?` +${reward.gems} ${gemWord(reward.gems)}`:''}${reward.skin?' + скин':''}`, 'good', 'gift');
  sfx.good(); save(); renderAll();
}

/* ---------- БЛОК: ЕЖЕДНЕВНЫЕ ЗАДАНИЯ ---------- */
function RET_renderDailyQuests(){
  RET_rollDaily();
  const R = S.ret;
  let html = `<div class="sec-title"><h3>${ic('target')} Задания дня</h3><small>${R.daily.ids.filter(id=>R.daily.claimed?.[id]).length}/${R.daily.ids.length} выполнено</small></div><div class="quest-list">`;
  for (const qid of R.daily.ids){
    const st = RET_questState(qid);
    if (!st) continue;
    const pct = Math.min(100, st.prog/st.target*100);
    const rw = st.def.reward;
    const coins = rw.coins[st.tier] ?? rw.coins[0];
    html += `<div class="quest-item ${st.done?'done':''} ${st.claimed?'claimed':''}">
      <span class="quest-ic">${ic(st.def.icon)}</span>
      <div class="quest-body">
        <b>${st.def.text.replace('{n}', st.target)}</b>
        <div class="quest-bar"><i style="width:${pct}%"></i></div>
        <div class="quest-prog">${fmt(st.prog)} / ${fmt(st.target)} · +${fmt(coins)} монет</div>
      </div>
      ${st.claimed
        ? `<span class="quest-check">${ic('check')}</span>`
        : st.done
          ? `<button class="quest-claim" onclick="App.claimQuest('${qid}')">Забрать</button>`
          : `<button class="quest-claim" disabled>…</button>`}
    </div>`;
  }
  html += `</div>`;
  return html;
}

/* ---------- БЛОК: СТРИК ---------- */
function RET_renderStreak(){
  const st = S.ret.streak;
  const claimed = st.last === RET_today();
  const shown = claimed ? st.count : (st.last === yesterdayStr() ? st.count+1 : 1);
  const days = Math.min(7, ((shown-1) % 7) + 1);
  const dots = Array.from({length:7}, (_,i)=>`<i class="${i<days?'on':''}"></i>`).join('');
  const freezes = Array.from({length:STREAK_FREEZE_MAX}, (_,i)=>`<i class="${i<(st.freezes||0)?'on':''}"></i>`).join('');
  const nextMs = STREAK_MILESTONES[shown];
  return `<div class="streak-card">
    <span class="streak-flame">${ic('target')}</span>
    <div class="streak-info">
      <b>${shown} ${shown===1?'день':shown<5?'дня':'дней'} подряд <span class="streak-freeze">${freezes}</span></b>
      <small>${nextMs? `Награда за ${shown} дней готова!` : 'Заморозка восстановит серию, если пропустите день'}</small>
      <div class="streak-days">${dots}</div>
    </div>
    ${claimed ? `<span class="chip-mini">${ic('check')} Сегодня</span>` : ''}
  </div>`;
}

function RET_renderFair(){

}

  const R = S.ret;

  // Геометрия карты (% от контейнера)

/* ---------- СКЛАД-БУНКЕР (выдержка) ---------- */
function RET_renderBunker(){
  const goods = Object.keys(S.goods).filter(g=>S.goods[g]>0);
  let html = `<div class="sec-title"><h3>${ic('clock')} Бункер выдержки</h3><small>Чем дольше лежит — тем дороже</small></div>`;
  const A = S.ret.aging;

  // Текущие партии
  html += `<div class="age-card"><div class="age-head">
    <span class="age-ic">${ic('clock')}</span>
    <div><b>Партии на выдержке</b><small>${RET_agedGoods().length} из 3 ячеек занято</small></div>
  </div><div class="age-slots">`;

  for (let i=0; i<3; i++){
    const p = A.slots[i];
    if (!p){
      html += `<div class="age-slot"><div class="age-empty">Пусто</div></div>`;
    } else {
      const ti = RET_agingTier(p);
      const isMax = ti.index >= AGING_TIERS.length-1;
      const gain = Math.round(p.units * GOODS[p.good].price * ti.tier.mult);
      html += `<div class="age-slot active" onclick="App.takeAged(${i})">
        <div class="as-good">${goodsIcon(p.good)} ${GOODS[p.good].name.slice(0,8)} ×${p.units}</div>
        <div class="as-mult ${isMax?'as-mult-max':''}">${ti.tier.mult}×</div>
        <div class="as-time">${isMax ? 'МАКСИМУМ' : ti.tier.name}</div>
      </div>`;
    }
  }
  html += `</div></div>`;

  // Показать товары на складе, которые можно отложить
  if (goods.length){
    html += `<div class="sec-title" style="margin-top:12px"><h3>${ic('box')} На складе</h3><small>Положить на выдержку</small></div>`;
    html += `<div class="goods-grid">`;
    for (const g of goods.slice(0, 8)){
      const price = GOODS[g].price;
      const tiers = AGING_TIERS.map(t=>`${t.mult}×`).join(' → ');
      html += `<button class="goods-item" style="cursor:pointer" onclick="App.putAged('${g}')">
        <span class="goods-symbol">${goodsIcon(g)}</span><span>${GOODS[g].name}</span><b>×${fmt(S.goods[g])}</b>
      </button>`;
    }
    html += `</div><div class="muted-small" style="margin-top:6px">Тап по товару — положить до 24 ед. на выдержку. Максимум даёт ${AGING_TIERS[3].mult}×.</div>`;
  } else {
    html += `<div class="empty-state">${ic('box')}<b>Склад пуст</b><small>Урожай появится после уборки</small></div>`;
  }
  return html;
}

/* ---------- ЗАГОНЫ / ЖИВОТНЫЕ ---------- */

  const notOwned = Object.keys(S.buildings).filter(id=>!S.buildings[id].owned);

  if (!owned.length){
    html += `<div class="empty-state">${ic('cow')}<b>Загонов пока нет</b><small>Построй курятник в «Хозяйстве»</small></div>`;
    html += `<button class="btn btn-primary btn-block" onclick="App.tab('business')">${ic('barn')} Открыть хозяйство</button>`;
    return html;
  }

  for (const id of owned){
    const b = S.buildings[id], d = BUILDINGS[id];

    const ready = b.stored > 0;
    html += `<div class="pen-card">
      <div class="pen-head">
        <span class="pen-ic">${ic(BLD_ICON[id]||'barn')}</span>
        <div><b>${d.name}</b><small>${ready?`${b.stored} ед. ${GOODS[d.good].name} готово`:`Работает · ${fmtTime(Math.max(0,(b.cycleEndsAt-Date.now())/1000))}`}</small></div>
        <span class="pen-status ${mood.level}">${mood.label}</span>
      </div>
      <div class="pen-care">
        <button class="${b.feed<40?'low':''}" onclick="App.feedPen('${id}')">${ic('sack')}Корм ${b.feed}%</button>
        <button class="${b.water<40?'low':''}" onclick="App.waterPen('${id}')">${ic('droplet')}Вода ${b.water}%</button>
        <button class="${b.clean<40?'low':''}" onclick="App.cleanPen('${id}')">${ic('wrench')}Чисто ${b.clean}%</button>
      </div>
      <div class="pen-mood">Настроение: <b>${mood.level==='good'?'отличное':mood.level==='warn'?'нормальное':'плохое'}</b> · Доход ×${mood.mult}</div>
      ${ready ? `<button class="btn btn-gold btn-block btn-sm" style="margin-top:8px" onclick="App.collectPen('${id}')">${ic('box')} Забрать ${b.stored} ${GOODS[d.good].name}</button>` : ''}
    </div>`;

  return html;
}

/* ---------- ОФФЛАЙН-ЭКРАН ---------- */
function RET_showOfflineScreen(info){
  const elapsed = info.elapsedSec || 0;
  const coins = info.coins || 0;
  const lines = info.lines || [];
  const readyFields = info.readyFields || 0;
  const agedReady = info.agedReady || 0;

  const rows = [];
  if (readyFields) rows.push(`<div class="offline-stat gold"><b>${readyFields}</b><small>полей готово к уборке</small></div>`);
  if (agedReady) rows.push(`<div class="offline-stat gold"><b>${agedReady}</b><small>партии достигли элитного класса</small></div>`);
  if (info.animals) rows.push(`<div class="offline-stat"><b>${info.animals}</b><small>загонов накопили продукцию</small></div>`);
  if (info.prod) rows.push(`<div class="offline-stat"><b>${info.prod}</b><small>цехов завершили работу</small></div>`);
  if (coins) rows.push(`<div class="offline-stat gold"><b>+${fmt(coins)}</b><small>монет заработано автоматически</small></div>`);

  const body = `
    <div class="offline-hero">
      <div class="big">${ic('sun','ic-xl')}</div>
      <h2 style="justify-content:center">Пока вас не было</h2>
      <div class="offline-time">${ic('clock')} ${fmtTime(elapsed)} прошло</div>
    </div>
    ${rows.length ? `<div class="offline-grid">${rows.join('')}</div>` : `<p class="muted" style="text-align:center">Ферма отдыхала вместе с вами.</p>`}
    ${lines.length ? `<div style="margin-top:8px">${lines.map(l=>`<p style="font-weight:700;font-size:11px;margin:4px 0">• ${l}</p>`).join('')}</div>` : ''}
    <button class="btn btn-primary btn-block" style="margin-top:12px" onclick="App.closeModal(); App.tab('farm');">${ic('play')} Вернуться на ферму</button>
    ${readyFields ? `<button class="btn btn-gold btn-block btn-sm" style="margin-top:6px" onclick="App.closeModal(); App.tab('map');">${ic('wheat')} Собрать урожай · ${readyFields}</button>` : ''}
  `;
  openDialog(body);
  document.body.classList.add('ret-offline-open');
  sfx.good();
}

/* ---------- ВКЛАДКА «ФЕРМА» — НОВАЯ ВЕРСИЯ С ПЕРЕКЛЮЧАТЕЛЕМ ---------- */
/* Заменяет старый renderFarm. Сохраняет сцену и срочные блоки, добавляет карту. */
function RET_renderFarm(){
  const view = ui.farmView || 'map';

  // --- исходные вычисления
  const owned = S.fields.filter(f=>f.owned);
  const ready = owned.filter(f=>f.state==='ready' && !f.busy);
  const growing = owned.filter(f=>f.state==='growing').length;
  const active = activeContracts().length;
  const login = S.loginReward || (S.loginReward={lastClaim:'',streak:0});
  const loginClaimed = login.lastClaim === todayStr();
  const loginStreak = loginClaimed ? (login.streak||1) : (login.lastClaim===yesterdayStr() ? (login.streak||0)+1 : 1);
  const loginDay = (loginStreak-1) % LOGIN_REWARDS.length + 1;
  const loginPrize = LOGIN_REWARDS[loginDay-1];
  const loginPrizeText = [loginPrize.coins?`+${fmt(loginPrize.coins)} монет`:null, loginPrize.gems?`+${loginPrize.gems} ${gemWord(loginPrize.gems)}`:null].filter(Boolean).join(' и ');

  const focus = ready[0] || owned.find(f=>f.state==='prepared') || owned.find(f=>f.state==='sterna') || owned.find(f=>f.state==='growing');
  let focusText='Расширь хозяйство', focusSub='Открой карту и выбери новое поле', focusIcon='map';
  if (focus){
    if (focus.state==='ready'){ focusText='Урожай созрел'; focusSub=`${focus.name} · ${CROPS[focus.crop]?.name||'культура'} ждёт уборки`; focusIcon='wheat'; }
    else if (focus.state==='growing'){ focusText='Поля растут'; focusSub=`${focus.name} · осталось ${fmtTime(Math.max(0,(focus.t1-Date.now())/1000))}`; focusIcon='clock'; }
    else if (focus.state==='prepared'){ focusText='Поле готово к посеву'; focusSub=`${focus.name} · выбери культуру`; focusIcon='seed'; }
    else { focusText='Пора в поле'; focusSub=`${focus.name} · почва ждёт обработки`; focusIcon='tractor'; }
  }
  const tutAttr = S.tutorial && !S.tutorial.done && (S.tutorial.step===0 && focus?.id==='f1' || S.tutorial.step===2 && focus?.id==='f1') ? `data-tut="${S.tutorial.step===0?'harvest':'field-f1'}"` : '';

  // --- переключатель вида
  const sw = (id, icon, label) => `<button class="${view===id?'active':''}" onclick="App.farmView('${id}')">${ic(icon)}${label}</button>`;
  const switcher = `<div class="farm-switch">
    ${sw('map','map','Ферма')}
    ${sw('quests','target','Задания')}
    ${sw('pass','medal','Пропуск')}
    ${sw('ach','star','Достижения')}
  </div>`;

  let body = '';

  if (view === 'map'){
    body = `
      <div class="daily-focus ${S.daily.goal?'is-done':''}" onclick="App.tab('tasks')">
        <span class="focus-mark">${ic(S.daily.goal?'check':'target')}</span>
        <span class="focus-copy"><b>${S.daily.goal?'Цель дня выполнена':'Заказы на сегодня'}</b><small>${S.daily.goal?'Награда получена':'3 заказа · награда 5 самоцветов'}</small>
          <span class="focus-progress"><i style="width:${Math.min(100,S.daily.contracts/3*100)}%"></i></span></span>
        <span class="focus-count">${S.daily.contracts}/3 <small>→</small></span>
      </div>
      ${RET_renderFair()}
      ${RET_renderStreak()}
      ${RET_renderFarmMap()}
      <div class="overview-actions" style="margin-top:10px">
        <button class="overview-action" onclick="App.tab('map')">${ic('seed')}<span>Мои поля</span></button>
        <button class="overview-action" onclick="App.openBunker()">${ic('box')}<span>Склад</span></button>
        <button class="overview-action" onclick="App.openPens()">${ic('cow')}<span>Загоны</span></button>
        <button class="overview-action" ${S.tutorial.step===1?'data-tut="sell"':''} onclick="App.openMarket()">${ic('coin')}<span>Рынок</span></button>
      </div>
      ${RET_renderDailyQuests()}
      <div class="login-reward ${loginClaimed?'claimed':''}">
        <button class="login-stamp" type="button" ${loginClaimed?'disabled':''} onclick="App.claimDailyReward()" aria-label="${loginClaimed?'Награда уже получена':'Забрать ежедневную награду'}">${ic(loginClaimed?'check':'gift')}</button>
        <span class="login-copy"><b>${loginClaimed?'Награда получена':`Ежедневный бонус · день ${loginDay}/7`}</b><small>${loginClaimed?`Стрик: ${RET_streakCount()} дн.`:'Вернись завтра и получи больше'}</small>
          <span class="reward-track">${LOGIN_REWARDS.map((_,i)=>`<i class="${i<loginDay?'filled':''}"></i>`).join('')}</span>
        </span>
        <button class="login-claim" ${loginClaimed?'disabled':''} onclick="App.claimDailyReward()">${loginClaimed?'Получено':'Забрать'}</button>
      </div>`;
  } else if (view === 'quests'){
    body = `${RET_renderStreak()}${RET_renderFair()}${RET_renderDailyQuests()}`;
  } else if (view === 'pass'){
    body = RET_renderPassCard();
  } else if (view === 'ach'){
    body = RET_renderAchievements();
  }

  // --- сцена (только для карты)
  const scene = view === 'map' ? `
    <div class="farm-scene compact-scene season-${seasonInfo().id} weather-${weatherInfo().id}" role="group" aria-label="Островная ферма · ${seasonInfo().name}">
      <div class="scene-top"><span class="scene-kicker">ОСТРОВ • ${seasonInfo().name.toUpperCase()}</span>
        <button class="scene-weather" onclick="App.openForecast()">${ic(weatherInfo().icon)} ${weatherInfo().name}</button></div>
      <div class="scene-copy"><div class="scene-title">Твоя ферма</div><div class="scene-caption">Всё важное — под рукой</div></div>
      <div class="scene-count">${owned.length} / ${S.fields.length} полей</div>
    </div>` : '';

  $('#screen').innerHTML = `${scene}${switcher}${body}`;
  positionCoach();
}

/* ---------- ДОСТИЖЕНИЯ ---------- */
function RET_renderAchievements(){
  const R = S.ret;
  const statVal = {
    harvests: S.stats.harvests||0, earned: S.stats.earned||0, contractsDone: S.stats.contractsDone||0,
    aged: S.stats.aged||0, buildings: Object.values(S.buildings).filter(b=>b.owned).length,
    bestStreak: R.streak?.best||0,
  };
  let html = `<div class="sec-title"><h3>${ic('star')} Достижения</h3><small>${R.ach.unlocked.length} / ${ACHIEVEMENTS.length}</small></div><div class="ach-grid">`;
  for (const a of ACHIEVEMENTS){
    const done = R.ach.unlocked.includes(a.id);
    const cur = Math.min(a.need, statVal[a.stat]||0);
    html += `<div class="ach-item ${done?'done':'locked'}">
      <span class="ach-ic">${ic(done?'medal':'info')}</span>
      <div class="ach-body"><b>${a.name}</b><small>${done?'Получено':a.desc + ' · ' + cur + '/' + a.need}</small></div>
      <span class="ach-rw">${a.reward.coins?`<span class="ic" style="width:9px;height:9px;display:inline-block;vertical-align:-1px">${I.coin}</span> ${fmt(a.reward.coins)}`:''}${a.reward.gems?` <span class="ic" style="width:9px;height:9px;display:inline-block;vertical-align:-1px">${I.gem}</span> ${a.reward.gems}`:''}</span>
    </div>`;
  }
  html += `</div>`;
  return html;
}

/* ============================================================
   ХУКИ (PATCHES) — встраивание модуля в существующую игру
   Вызывается один раз после загрузки основного скрипта.
   Все патчи безопасны: если что-то не найдено — просто пропускаем.
   ============================================================ */
function RET_installHooks(){
  /* [HOOK 1] renderFarm → новая версия со вкладками */
  if (typeof renderFarm === 'function'){
    window.__ret_origRenderFarm = renderFarm;
    renderFarm = function(){ RET_renderFarm(); };
  }

  /* [HOOK 2] renderAll должен пересчитывать задачи/стрик */
  const origRenderAll = window.renderAll;
  if (typeof origRenderAll === 'function'){
    window.renderAll = function(){
      if (S && S.ret){ RET_rollDaily(); RET_rollFair(); }
      return origRenderAll.apply(this, arguments);
    };
  }

  /* [HOOK 3] completeFieldWork — учёт урожая в заданиях */
  if (typeof completeFieldWork === 'function'){
    const orig = completeFieldWork;
    completeFieldWork = function(f){
      const before = {...S.goods};
      const hadCrop = f.crop;
      const result = orig.apply(this, arguments);
      if (hadCrop){
        let delta = 0;
        for (const g in S.goods){ delta += Math.max(0, S.goods[g] - (before[g]||0)); }
        if (delta > 0) RET_track('harvest', delta);
      }
      return result;
    };
  }

  /* [HOOK 4] sellGood — деньги в заданиях */
  if (typeof sellGood === 'function'){
    const orig = sellGood;
    sellGood = function(good, qty){
      const gain = orig.apply(this, arguments);
      if (gain > 0) RET_track('sellCoins', gain);
      return gain;
    };
  }

  /* [HOOK 5] claimContract — заказы в заданиях + множитель ярмарки */
  if (typeof claimContract === 'function'){
    const orig = claimContract;
    claimContract = function(id){
      const c = S.board.find(x=>x.id===id);
      return orig.call(this, id);
    };
  }
  if (typeof contractRewardMult === 'undefined'){
    window.contractRewardMult = function(){ return RET_contractMult(); };
  }

  /* [HOOK 6] startFieldWork — учёт посева */
  if (typeof startFieldWork === 'function'){
    const orig = startFieldWork;
    startFieldWork = function(f, action, extra){
      const ok = orig.apply(this, arguments);
      if (ok && action === 'sow') RET_track('plant', 1);
      return ok;
    };
  }

  /* [HOOK 7] startProduction — цеха в заданиях */
  if (typeof startProduction === 'function'){
    const orig = startProduction;
    startProduction = function(id){
      const wasRunning = S.productions[id]?.running;
      const result = orig.apply(this, arguments);
      if (!wasRunning && S.productions[id]?.running) RET_track('produce', 1);
      return result;
    };
  }

  /* [HOOK 8] collectBuilding — сбор продукции */
  if (typeof collectBuilding === 'function'){
    const orig = collectBuilding;
    collectBuilding = function(id){
      const had = S.buildings[id]?.stored > 0;
      const result = orig.apply(this, arguments);
      if (had) RET_track('collect', 1);
      return result;
    };
  }

  /* [HOOK 9] careBuilding — уход за животными */
  if (typeof careBuilding === 'function'){
    const orig = careBuilding;
    careBuilding = function(id, kind){
      if (RET_freeCare()){ sfx.pop(); return; } // ярмарка: бесплатный уход
      const result = orig.apply(this, arguments);
      RET_track('care', 1);
      return result;
    };
  }

  /* [HOOK 10] рост культур с учётом ярмарки */
  if (typeof growthFactor === 'function'){
    const orig = growthFactor;
    growthFactor = function(){
      return orig.apply(this, arguments) * RET_growthMult();
    };
  }

  /* [HOOK 11] цены с учётом ярмарки */
  if (typeof bestPoint === 'function'){
    const orig = bestPoint;
    bestPoint = function(good){
      const r = orig.apply(this, arguments);
      const fm = RET_priceMult();
      if (fm !== 1) return { ...r, mult: Math.round(r.mult * fm * 100) / 100 };
      return r;
    };
  }

  /* [HOOK 12] починка техники — в заданиях */
  if (window.App && typeof App.repairMachine === 'function'){
    const orig = App.repairMachine.bind(App);
    App.repairMachine = function(id){
      const wasBroken = S.machines[id]?.cond < 100;
      const result = orig(id);
      if (wasBroken) RET_track('repair', 1);
      return result;
    };
  }

  /* [HOOK 13] заказ получен — учёт */
  const origClaim = window.App?.claimContract;
  if (window.App && typeof origClaim === 'function'){
    window.App.claimContract = function(id){
      const result = origClaim.call(App, id);
      RET_track('contract', 1);
      return result;
    };
  }

  /* [HOOK 14] Добавляем новые методы в App */
  if (window.App){
    Object.assign(App, {
      farmView(v){ ui.farmView = v; sfx.click(); renderScreen(); },
      claimQuest(qid){ RET_claimQuest(qid); },
      openBunker(){ openDialog(`<h2>${ic('clock')} Бункер</h2>${RET_renderBunker()}`); },
      openPens(){ openDialog(`<h2>${ic('cow')} Загоны</h2>${RET_renderPens()}`); },
      openFair(){ RET_openFair(); },
      putAged(g){ RET_putToAge(g); if (ui.modal) openDialog(`<h2>${ic('clock')} Бункер</h2>${RET_renderBunker()}`); },
      takeAged(i){ RET_takeFromAge(i); openDialog(`<h2>${ic('clock')} Бункер</h2>${RET_renderBunker()}`); },
      feedPen(id){ RET_penCare(id,'feed'); openDialog(`<h2>${ic('cow')} Загоны</h2>${RET_renderPens()}`); },
      waterPen(id){ RET_penCare(id,'water'); openDialog(`<h2>${ic('cow')} Загоны</h2>${RET_renderPens()}`); },
      cleanPen(id){ RET_penCare(id,'clean'); openDialog(`<h2>${ic('cow')} Загоны</h2>${RET_renderPens()}`); },
      collectPen(id){ collectBuilding(id); openDialog(`<h2>${ic('cow')} Загоны</h2>${RET_renderPens()}`); },
      passInfo(){ openDialog(`<div style="text-align:center"><div class="big-emoji">🎖️</div><h2 style="justify-content:center">Фермерский пропуск</h2><p class="muted">Пока прототип: награды выдаются автоматически за очки опыта. В финальной версии появится премиум-ветка за самоцветы.</p><button class="btn btn-primary btn-block" onclick="App.closeModal()">Понятно</button></div>`); }
    });
  }

  /* [HOOK 15] Первый рендер экрана гарантирует инициализацию RET */
  const origRenderScreen = window.renderScreen;
  if (typeof origRenderScreen === 'function'){
    window.renderScreen = function(){
      if (S && !S.ret) RET_afterState();
      if (S && !S.liv && typeof LIV_afterState === 'function') LIV_afterState();
      return origRenderScreen.apply(this, arguments);
    };
  }
}

/* ---------- Дополнительные хелперы, используемые хуками ---------- */
function RET_penCare(id, kind){
  const b = S.buildings[id];
  if (!b || !b.owned) return;
  // Если уже максимум — не тратим деньги и не считаем действие
  if ((b[kind]||0) >= 100){ toast('Уже в порядке', '', 'check'); return; }
  const cost = RET_freeCare() ? 0 : 8;
  if (cost && S.coins < cost){ toast('Не хватает монет', 'bad', 'coin'); sfx.bad(); return; }
  if (cost) addCoins(-cost);
  b[kind] = clamp((b[kind]||0) + 30, 0, 100);
  sfx.pop(); RET_track('care', 1); save(); renderAll();
}

function RET_openFair(){
  const f = RET_fair();

  openDialog(`<div style="text-align:center">

    <button class="btn btn-primary btn-block" onclick="App.closeModal()">Отлично</button></div>`);
}

/* ---------- Оффлайн-экран (перехват) ---------- */
function RET_installOfflineHook(){
  if (typeof applyOffline !== 'function') return;
  const orig = applyOffline;
  applyOffline = function(){
    // восстанавливаем корректный lastSeen, чтобы расчёт оффлайна был верным
    if (window.__retPrevSeen) S.lastSeen = window.__retPrevSeen;
    // считаем ДО вызова оригинальной applyOffline (она внутри вызывает save и обнуляет lastSeen)
    const prevSeenSnap = S.lastSeen;
    const elapsedSec = Math.min((Date.now() - prevSeenSnap)/1000, OFFLINE_CAP);
    const gameSecSnap = elapsedSec * ts();
    const before = S.coins;
    // сохраняем прошлую реализацию для эффектов (готовые поля и т.д.), но перехватываем диалог
    const dialogSnap = window.openDialog;
    let captured = [];
    window.openDialog = function(html){ captured.push(html); };
    try { orig.apply(this, arguments); } finally { window.openDialog = dialogSnap; }

    const gameSec = gameSecSnap;
    if (gameSec < 60){ window.__retPrevSeen = null; return; }

    // собираем статистику для нового экрана
    const readyFields = S.fields.filter(f=>f.owned && f.state==='ready').length;
    const agedReady = RET_agedGoods().filter(p=>RET_agingTier(p).index>=2).length;
    const animals = Object.keys(S.buildings).filter(id=>S.buildings[id].owned && S.buildings[id].stored>0).length;
    const prod = Object.keys(S.productions).filter(id=>{
      const p = S.productions[id];
      return p.owned && !p.running && Object.values(p.stored||{}).some(v=>v>0);
    }).length;
    const coins = Math.max(0, S.coins - before);

    window.__retPrevSeen = null;
    RET_showOfflineScreen({
      elapsedSec: gameSec, coins, readyFields, agedReady, animals, prod,
      lines: [],
    });
  };
}

/* ---------- Запуск всех хуков ---------- */
function RET_boot(){
  // Хуки ставятся всегда — они патчат функции, S нужен только при вызовах.
  RET_installHooks();
  RET_installOfflineHook();
  RET_guardSave();
}

/* Не позволяем save() обновлять lastSeen до того, как посчитан оффлайн */
function RET_guardSave(){
  if (typeof save !== 'function' || save.__retGuarded) return;
  const orig = save;
  const wrapped = function(){
    const prev = S ? S.lastSeen : null;
    const result = orig.apply(this, arguments);
    if (S && prev && window.__retPrevSeen) S.lastSeen = prev;
    return result;
  };
  wrapped.__retGuarded = true;
  save = wrapped;
  window.save = wrapped;
}
/* Инициализация дневных систем — вызывается, когда S уже существует */
function RET_afterState(){
  if (!S) return;
  RET_migrate();
  RET_rollDaily();
  RET_rollFair();
  RET_touchStreak();
  RET_checkAchievements();
  try { if (typeof LIV_afterState === 'function') LIV_afterState(); } catch(e){}
}

RET_boot();

/* ---------------- МИГРАЦИЯ ---------------- */
function LIV_migrate(){
  if (!S) return;
  if (!S.liv) S.liv = {};
  const L = S.liv;
  if (!L.pet) L.pet = { name:'Рекс', xp:0, fed:Date.now(), lastPlay:0, adopted:false };
  if (!L.exp) L.exp = { running:null, done:[] };
  if (!L.cards) L.cards = { owned:[], seen:[] };
  if (!L.storm) L.storm = { date:'', id:null, resolved:false, deadline:0 };
  if (!L.week) L.week = { start:'', points:0, claimed:[] };
  if (!S.stats.petLevel) S.stats.petLevel = 1;
  if (!S.stats.expeditions) S.stats.expeditions = 0;
}

/* ---------------- ВРЕМЯ СУТОК ---------------- */
function LIV_todPhase(){
  const h = new Date().getHours();
  for (const p of TOD_PHASES){
    if (p.from <= p.to){ if (h >= p.from && h < p.to) return p; }
    else { if (h >= p.from || h < p.to) return p; }
  }
  return TOD_PHASES[1];
}

function LIV_applyTOD(){
  const p = LIV_todPhase();
  const body = document.body;
  ['dawn','day','golden','dusk','night'].forEach(id => body.classList.toggle('tod-'+id, id === p.id));
  return p;
}

/* Бонусы времени суток */
function LIV_todYieldMult(){
  const p = LIV_todPhase();
  if (p.id === 'golden') return 1.10;
  return 1;
}
function LIV_todAgingMult(){
  return LIV_todPhase().id === 'night' ? 1.4 : 1;
}
function LIV_todMilkMult(){
  return LIV_todPhase().id === 'dawn' ? 1.15 : 1;
}
function LIV_todContractMult(){

/* ---------------- ШТОРМ ---------------- */
function LIV_rollStorm(){
  const L = S.liv;
  const today = todayStr();
  if (L.storm.date === today) return;
  L.storm = { date: today, id: null, resolved: false, deadline: 0 };
  // 40% шанс, что сегодня будет событие
  if (S.level >= 2 && Math.random() < 0.40){
    L.storm.id = pick(STORM_EVENTS).id;
    L.storm.deadline = Date.now() + 3*3600*1000; // 3 часа
  }
  save();
}
function LIV_stormEvent(){
  const L = S.liv;
  if (!L?.storm?.id || L.storm.resolved) return null;
  if (Date.now() > L.storm.deadline){ L.storm.resolved = true; return null; }
  return STORM_EVENTS.find(e => e.id === L.storm.id) || null;
}
function LIV_stormSafe(){
  const ev = LIV_stormEvent();
  if (!ev) return;
  if (S.coins < ev.safeCost){ toast('Не хватает монет', 'bad', 'coin'); sfx.bad(); return; }
  addCoins(-ev.safeCost);
  S.liv.storm.resolved = true;
  toast(`${ev.name} пережит без потерь!`, 'good', 'shield');
  sfx.good(); save(); renderAll();
  openDialog(`<div style="text-align:center">
    <div class="big-emoji">🛡️</div><h2>Урожай спасён</h2>
    <p class="muted">Потрачено ${fmt(ev.safeCost)} монет, но всё осталось целым.</p>
    <button class="btn btn-primary btn-block" onclick="App.closeModal()">Хорошо</button></div>`);
}
function LIV_stormRisk(){
  const ev = LIV_stormEvent();
  if (!ev) return;
  S.liv.storm.resolved = true;
  const luck = Math.random();
  if (luck < 0.45){
    toast('Пронесло! Ничего не пострадало', 'good', 'sun');
    sfx.good(); FX.confetti();
    save(); renderAll();
    openDialog(`<div style="text-align:center">
      <div class="big-emoji">🍀</div><h2>Повезло!</h2>
      <p class="muted">${ev.name} прошёл мимо. Вы сохранили и деньги, и урожай.</p>
      <button class="btn btn-primary btn-block" onclick="App.closeModal()">Отлично</button></div>`);
  } else {
    const lossPct = rand(ev.lossMin, ev.lossMax);
    let lost = 0;
    for (const g in S.goods){
      const cut = Math.floor(S.goods[g] * lossPct);
      if (cut > 0){ S.goods[g] -= cut; lost += cut; }
    }
    // также бьёт по растущим полям
    let fieldHit = 0;
    for (const f of S.fields){
      if (f.owned && f.state === 'growing' && f.crop){
        if (Math.random() < 0.5){ if (f.t1 && f.t0){ f.t1 = f.t0 + (f.t1 - f.t0) * 1.35; fieldHit++; } }
      }
    }
    sfx.bad(); FX.shake();
    save(); renderAll();
    openDialog(`<div style="text-align:center">
      <div class="big-emoji">😖</div><h2>${ev.name} ударил</h2>
      <p class="muted">Потеряно ${fmt(lost)} ед. товара${fieldHit ? `, ${fieldHit} полей задержались` : ''}.</p>
      <button class="btn btn-primary btn-block" onclick="App.closeModal()">Переживём</button></div>`);
  }
}

/* ---------------- ЭКСПЕДИЦИИ ---------------- */
function LIV_expStart(id){
  const def = EXPEDITIONS.find(e => e.id === id);
  const L = S.liv.exp;
  if (!def) return;
  if (L.running){ toast('Экспедиция уже идёт', 'bad', 'clock'); return; }
  if (S.level < def.min){ toast(`Нужен ${def.min} уровень`, 'bad', 'star'); return; }
  if (S.coins < def.cost){ toast('Не хватает монет', 'bad', 'coin'); sfx.bad(); return; }
  addCoins(-def.cost);
  L.running = { id: def.id, startedAt: Date.now(), endsAt: Date.now() + def.dur*60000 };
  toast(`Отправлен в ${def.name} · ${def.dur} мин`, 'good', 'map');
  sfx.pop(); save(); renderAll();
}
function LIV_expCollect(){
  const L = S.liv.exp;
  const r = L.running;
  if (!r) return;
  const def = EXPEDITIONS.find(e => e.id === r.id);
  if (Date.now() < r.endsAt){ toast('Ещё в пути', '', 'clock'); return; }
  L.running = null;
  S.stats.expeditions = (S.stats.expeditions||0) + 1;

  const gained = [];
  const roll = Math.random();
  if (roll < 0.35){
    const coins = Math.round(def.cost * rand(1.8, 3.2));
    addCoins(coins); gained.push(`+${fmt(coins)} монет`);
  } else if (roll < 0.7){
    const gems = randi(1, 3);
    S.gems += gems; gained.push(`+${gems} ${gemWord(gems)}`);
  } else {
    const card = LIV_randomCard();
    if (card){ gained.push(`карточка «${card.name}»`); }
    else { const coins = Math.round(def.cost * 1.5); addCoins(coins); gained.push(`+${fmt(coins)} монет`); }
  }
  // бонус за уровень
  if (Math.random() < 0.3){ addCoins(Math.round(def.cost*0.6)); gained.push(`бонус +${fmt(Math.round(def.cost*0.6))}`); }

  LIV_petXP(10);
  RET_track('_noop', 20);
  sfx.good(); FX.confetti(); buzz(50);
  save(); renderAll();
  openDialog(`<div style="text-align:center">
    <div class="big-emoji">🧭</div><h2>Экспедиция вернулась</h2>
    <p class="muted">${def.name}</p>
    <p style="font-weight:800;color:#f0d68f">${gained.join('<br>')}</p>
    <button class="btn btn-primary btn-block" onclick="App.closeModal()">Забрать</button></div>`);
}
function LIV_randomCard(){
  const owned = S.liv.cards.owned;
  const pool = CARD_SET.filter(c => !owned.includes(c.id));
  if (!pool.length) return null;
  // редкие выпадают реже
  const weighted = [];
  for (const c of pool){
    const w = c.r === 'common' ? 6 : c.r === 'rare' ? 3 : 1;
    for (let i = 0; i < w; i++) weighted.push(c);
  }
  const card = pick(weighted);
  owned.push(card.id);
  setTimeout(()=>{
    FX.confetti();
    toast(`Новая карточка: ${card.name}`, 'good', card.icon);
    sfx.good();
  }, 500);
  return card;
}
function LIV_grantCard(){
  const c = LIV_randomCard();
  if (c){ save(); renderAll(); }
  return c;
}

function LIV_weekStart(){
  const d = new Date();
  const day = d.getDay() || 7;
  const monday = new Date(d); monday.setDate(d.getDate() - day + 1);
  return monday.getFullYear() + '-' + (monday.getMonth()+1) + '-' + monday.getDate();
}
function LIV_rollWeek(){
  const L = S.liv;
  const cur = LIV_weekStart();
  if (!L.week.claimed) L.week.claimed = [];
  if (L.week.start === cur) return;
  L.week = { start: cur, points: 0, claimed: [] };
  save();
}
function LIV_weekPoints(n){
  const L = S.liv;
  LIV_rollWeek();
  L.week.points = (L.week.points||0) + n;
}
const WEEK_MILESTONES = [
  { at:500,  reward:{coins:800},           name:'500 очков' },
  { at:1500, reward:{gems:3},              name:'1 500 очков' },
  { at:3500, reward:{coins:2500, gems:2},  name:'3 500 очков' },
  { at:7000, reward:{coins:5000, gems:8},  name:'7 000 очков' },
];
function LIV_weekClaim(){
  const L = S.liv; LIV_rollWeek();
  const pts = L.week.points || 0;
  let claimedAny = false;
  for (const m of WEEK_MILESTONES){
    if (pts >= m.at && !(L.week.claimed||[]).includes(m.at)){
      L.week.claimed.push(m.at);
      if (m.reward.coins) addCoins(m.reward.coins);
      if (m.reward.gems) S.gems += m.reward.gems;
      claimedAny = true;
    }
  }
  if (claimedAny){
    toast('Награда недели получена!', 'good', 'gift');
    sfx.good(); FX.confetti(); save(); renderAll();
  } else {
    toast('Пока нечего забирать', '', 'clock');
  }
}

      <div class="liv-exp-body"><b>${def.name}</b><small>${ready?'Вернулся с находками!':'В пути · '+fmtTime(left)}</small>
        <div class="liv-exp-prog"><i style="width:${pct}%"></i></div></div>
      ${ready?`<button class="liv-exp-go" onclick="App.expCollect()">Забрать</button>`:''}
    </div>`;
  }
  html += `<div class="liv-exp">`;
  for (const e of EXPEDITIONS){
    const locked = S.level < e.min;
    html += `<div class="liv-exp-card ${locked?'locked':''}">
      <span class="liv-exp-ic">${ic(locked?'info':e.icon)}</span>
      <div class="liv-exp-body"><b>${e.name}</b>
        <small>${locked ? `Откроется на ${e.min} уровне` : `${e.desc} · ${e.dur} мин`}</small></div>
      <button class="liv-exp-go" ${locked||r?'disabled':''} onclick="App.expStart('${e.id}')">${locked?'🔒':fmt(e.cost)}</button>
    </div>`;
  }
  html += `</div>`;
  if (!r) html += `<div class="muted-small" style="margin-top:8px;text-align:center">Экспедиция приносит монеты, самоцветы и редкие карточки</div>`;
  return html;
}

/* ---------- КОЛЛЕКЦИЯ ---------- */
function LIV_renderCollection(){
  const owned = S.liv.cards.owned;
  const total = CARD_SET.length;
  const byRarity = {
    common: CARD_SET.filter(c=>c.r==='common').length,
    rare: CARD_SET.filter(c=>c.r==='rare').length,
    epic: CARD_SET.filter(c=>c.r==='epic').length,
  };
  let html = `<div class="sec-title"><h3>${ic('star')} Коллекция</h3><small>${owned.length} / ${total}</small></div>`;
  html += `<div class="liv-cards">`;
  for (const c of CARD_SET){
    const has = owned.includes(c.id);
    html += `<div class="liv-card ${has?'owned':'locked'}" ${has?`onclick="App.cardInfo('${c.id}')"`:''}>
      <span class="lc-ic">${I[c.icon]||I.box}</span>
      ${has?`<span class="liv-card-rarity" style="color:${CARD_RARITY_COLOR[c.r]}">${c.r==='epic'?'★':'•'}</span>`:''}
    </div>`;
  }
  html += `</div>`;
  html += `<div class="liv-card-meta">
    <b>Собрано ${Math.round(owned.length/total*100)}%</b>
    <small>${ICON_LEGEND(byRarity)}</small>
  </div>`;
  return html;
}
function ICON_LEGEND(r){
  return `<span style="color:${CARD_RARITY_COLOR.common}">•</span> обычные ${r.common} · <span style="color:${CARD_RARITY_COLOR.rare}">•</span> редкие ${r.rare} · <span style="color:${CARD_RARITY_COLOR.epic}">★</span> эпик ${r.epic}`;
}
function openCardInfo(id){
  const c = CARD_SET.find(x=>x.id===id);
  if (!c) return;
  openDialog(`<div style="text-align:center">
    <div class="big-emoji">${ic(c.icon,'ic-xl')}</div>
    <h2 style="justify-content:center">${c.name}</h2>
    <p class="muted">${c.r==='epic'?'Эпическая находка':c.r==='rare'?'Редкая находка':'Обычная находка'}</p>
    <button class="btn btn-primary btn-block" onclick="App.closeModal()">Закрыть</button></div>`);
}

/* ---------- HUD: фаза дня ---------- */
function LIV_phaseChip(){
  const p = LIV_todPhase();
  return `<span class="liv-phase">${ic(p.icon)} ${p.name}</span>`;
}

/* ============================================================
   ЖИВОЙ МИР — ХУКИ
   ============================================================ */

function LIV_installHooks(){
  LIV_injectBirdKeyframes();

  /* [1] Множитель урожая: золотой час + питомец */
  if (typeof fieldYield === 'function'){
    const orig = fieldYield;
    fieldYield = function(f){
      let v = orig.apply(this, arguments);
      try {
        const pet = LIV_petBonus().yield * LIV_petMood().mult;
        v *= (1 + pet) * LIV_todYieldMult();
      } catch(e){}
      return v;
    };
  }

  /* [2] Ночная выдержка ×1.4 */
  if (typeof RET_agingTier === 'function'){
    const orig = RET_agingTier;
    RET_agingTier = function(p){
      const r = orig.apply(this, arguments);
      if (!r || !p) return r;
      const boost = LIV_todAgingMult();
      if (boost === 1) return r;
      // ночью «время» идёт быстрее — пересчитываем индекс
      const elapsed = ((Date.now() - p.startedAt) / 3600000) * boost;
      let t = 0;
      for (let i = AGING_TIERS.length-1; i >= 0; i--){ if (elapsed >= AGING_TIERS[i].hours){ t = i; break; } }
      return { tier: AGING_TIERS[t], index: t, elapsed, progress: t>=AGING_TIERS.length-1?1:(elapsed-AGING_TIERS[t].hours)/(AGING_TIERS[t+1].hours-AGING_TIERS[t].hours) };
    };
  }

  /* [3] Молоко на рассвете + очки недели при сборе продукции */
  if (typeof collectBuilding === 'function'){
    const orig = collectBuilding;
    collectBuilding = function(id){
      const before = S.goods[BUILDINGS[id]?.good] || 0;
      const res = orig.apply(this, arguments);
      const after = S.goods[BUILDINGS[id]?.good] || 0;
      const got = after - before;
      if (got > 0){
        // рассветный бонус к молоку
        if (BUILDINGS[id]?.good === 'milk'){
          const extra = Math.round(got * (LIV_todMilkMult() - 1));
          if (extra > 0){ addGoods('milk', extra); toast(`Рассвет: молоко +${extra}`, 'good', 'milk'); }
        }
        LIV_weekPoints(got);
        LIV_petXP(2);
      }
      return res;
    };
  }

  /* [4] Заказы: закатный бонус + очки недели */
  if (window.App && typeof App.claimContract === 'function'){
    const orig = App.claimContract.bind(App);
    App.claimContract = function(id){
      const res = orig(id);
      try {
        const mult = LIV_todContractMult();
        if (mult > 1){
          const bonus = 150;
          addCoins(bonus);
          toast(`Закат: бонус заказа +${fmt(bonus)}`, 'good', 'coin');
        }
        LIV_weekPoints(120);
      } catch(e){}
      return res;
    };
  }

  /* [5] Урожай: очки недели + опыт питомцу */
  if (typeof completeFieldWork === 'function'){
    const orig = completeFieldWork;
    completeFieldWork = function(f){
      const beforeCoins = 0;
      const hadCrop = f && f.crop;
      const res = orig.apply(this, arguments);
      if (hadCrop){
        LIV_weekPoints(45);
        LIV_petXP(3);
        // случайная карточка при уборке — 6% шанс
        if (Math.random() < 0.06) LIV_grantCard();
      }
      return res;
    };
  }

  /* [6] Продажа: очки недели */
  if (typeof sellGood === 'function'){
    const orig = sellGood;
    sellGood = function(good, qty){
      const gain = orig.apply(this, arguments);
      if (gain > 0){ LIV_weekPoints(Math.round(gain/10)); }
      return gain;
    };
  }

  /* [7] renderFarm: добавляем питомца, шторм, недельную ярмарку */
  if (typeof RET_renderFarm === 'function'){
    window.__liv_origRenderFarm = RET_renderFarm;
    RET_renderFarm = function(){
      const res = window.__liv_origRenderFarm.apply(this, arguments);
      try { LIV_afterRender(); } catch(e){}
      return res;
    };
  }

  /* [8] Новые методы App */
  if (window.App){
    Object.assign(App, {
      openPet(){ sfx.click(); openPet(); },
      feedPet(){ LIV_feedPet(); },
      playPet(){ LIV_playPet(); },
      openStorm(){ sfx.click(); openStorm(); },
      stormSafe(){ LIV_stormSafe(); },
      stormRisk(){ LIV_stormRisk(); },
      openWeek(){ sfx.click(); openWeek(); },
      weekClaim(){ LIV_weekClaim(); },
      expStart(id){ LIV_expStart(id); openExpeditions(); },
      expCollect(){ LIV_expCollect(); },
      openExpeditions(){ sfx.click(); openExpeditions(); },
      cardInfo(id){ openCardInfo(id); },
    });
  }
}

/* ---------- Действия после рендера главной ---------- */
function LIV_afterRender(){
  // время суток
  LIV_applyTOD();

  // Светлячки — в фон, чтобы жили над всей фермой
  const ambient = document.getElementById('ambient');
  if (ambient && !ambient.querySelector('.liv-fireflies')){
    const ff = document.createElement('div');
    ff.className = 'liv-fireflies';
    ambient.appendChild(ff);
    LIV_spawnFireflies(ff);
  }

  // Питомец — постоянный компаньон на экране, вне прокручиваемой области
  const app = document.getElementById('app');
  if (app && !app.querySelector('.liv-pet')){
    const wrap = document.createElement('div');
    wrap.innerHTML = LIV_renderPetBadge();
    const petEl = wrap.firstElementChild;
    if (petEl){
      // прячем на экранах, где перекрыл бы контент
      petEl.style.display = (ui.tab === 'farm') ? '' : 'none';
      app.appendChild(petEl);
    }
  } else if (app){
    const pet = app.querySelector('.liv-pet');
    if (pet) pet.style.display = (ui.tab === 'farm') ? '' : 'none';
  }
}

/* ---------- Экраны ---------- */
function openExpeditions(){
  openDialog(`<h2>${ic('map')} Экспедиции</h2>${LIV_renderExpeditions()}`);
}
function openCollection(){
  openDialog(`<h2>${ic('star')} Коллекция</h2>${LIV_renderCollection()}`);
}

/* ---------- Расширение вкладок фермы ---------- */
function LIV_extendFarmTabs(){
  if (typeof RET_renderFarm !== 'function') return;
  // Добавляем 2 новые вкладки через переопределение
  const orig = RET_renderFarm;
  RET_renderFarm = function(){
    const view = ui.farmView || 'map';
    if (view === 'exped'){
      $('#screen').innerHTML = `<div class="farm-switch">${LIV_switchHTML('exped')}</div>
        ${LIV_renderWeek()}${LIV_renderStorm()}${LIV_renderExpeditions()}
        ${LIV_renderCollection()}`;
      positionCoach();
      return;
    }
    if (view === 'cards'){
      $('#screen').innerHTML = `<div class="farm-switch">${LIV_switchHTML('cards')}</div>
        ${LIV_renderCollection()}
        <div style="margin-top:14px">${LIV_renderExpeditions()}</div>`;
      positionCoach();
      return;
    }
    // добавляем шторм и ярмарку в существующие представления
    const r = orig.apply(this, arguments);
    try {
      const stormHTML = LIV_renderStorm();
      const weekHTML = LIV_renderWeek();
      if (view === 'map' && (stormHTML || weekHTML)){
        const host = document.querySelector('.daily-focus');
        if (host && !document.querySelector('.liv-storm-banner') && !document.querySelector('.liv-week')){
          host.insertAdjacentHTML('afterend', stormHTML + weekHTML);
        }
      }
    } catch(e){}
    return r;
  };
}

function LIV_switchHTML(active){
  const sw = (id, icon, label) => `<button class="${active===id?'active':''}" onclick="App.farmView('${id}')">${ic(icon)}${label}</button>`;
  return sw('map','map','Ферма') + sw('quests','target','Задания') + sw('exped','map','Походы') + sw('cards','star','Карточки') + sw('pass','medal','Пропуск') + sw('ach','medal','Награды');
}

/* ---------- Периодическое обновление (раз в минуту) ---------- */
function LIV_tickMinute(){
  if (!S || !S.liv) return;
  // смена времени суток
  const p = LIV_todPhase();
  if (window.__liv_lastPhase !== p.id){
    window.__liv_lastPhase = p.id;
    LIV_applyTOD();
    const names = { dawn:'Рассвет', day:'День', golden:'Золотой час', dusk:'Закат', night:'Ночь' };
    if (window.__liv_booted) toast(`${names[p.id]} · ${p.bonus}`, '', p.icon);
  }
  // питомец говорит
  if (Math.random() < 0.12){
    const mood = LIV_petMood();
    const lines = mood.key === 'happy' ? ['Гав!','Всё под контролем','Я слежу за полем','Хороший день!']
      : mood.key === 'ok' ? ['Покорми меня...','Скучно...']
      : ['Я голодный...','Покорми, пожалуйста'];
    LIV_petSay(pick(lines));
  }
  LIV_rollStorm();
}

/* ---------- Запуск ---------- */
function LIV_boot(){
  LIV_installHooks();
  LIV_extendFarmTabs();
  if (S){
    LIV_migrate();
    LIV_rollStorm();
    LIV_rollWeek();
    LIV_applyTOD();
  }
  setInterval(LIV_tickMinute, 60000);
  setTimeout(()=>{ window.__liv_booted = true; }, 3000);
}

/* ---------- Обёртка инициализации ---------- */
function LIV_afterState(){
  if (!S) return;
  LIV_migrate();
  LIV_rollStorm();
  LIV_rollWeek();
  LIV_applyTOD();
  // карточка-подарок при первом запуске
  if (!S.liv.cards.owned.length){
    S.liv.cards.owned.push('wheat','eggs','coin');
  }
}

LIV_boot();

init();
</script>
