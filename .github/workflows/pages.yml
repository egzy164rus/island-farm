name: Publish Island Farm PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # Собираем только то, что реально нужно сайту.
      # Раньше сюда попадали .git и .github — из-за этого публикация падала.
      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest .nojekyll _site/
          cp -r art modules _site/
          cp icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png _site/ 2>/dev/null || true
          echo "--- содержимое артефакта ---"
          ls -la _site
          du -sh _site
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
